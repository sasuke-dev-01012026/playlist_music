<!DOCTYPE html>
<html lang="id" data-mode="music">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlayList Music</title>

  <!-- Font & ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="dns-prefetch" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Design tokens, reset, dan gaya global */

    :root {
      --bg: #000;
      --panel: #121212;
      --card: #181818;
      --card-h: #262626;
      --chip: #1f1f1f;
      --text: #fff;
      --muted: #b3b3b3;
      /* Identitas warna: Playlist Music = ungu, Lyric Video = hijau. Seluruh aksen memakai --accent. */
      --music: #7C3AED;
      --music-h: #9061F9;
      --lyric: #1DB954;
      --lyric-h: #1ED760;
      --accent: var(--music);
      --accent-h: var(--music-h);
      --on-accent: #fff;
      --gap: 7px;
      --nav-h: 63px;
      --player-h: 86px;
      --side-w: 299px;
      --r: 9px;

      /* Skala tipografi (acuan Material Design 3, basis 16px). Nilai rem agar ikut pengaturan font browser. */
      --fs-2xs: .6875rem;  /* 11px  label kecil: eyebrow, header tabel, waktu, durasi */
      --fs-xs: .75rem;     /* 12px  teks sekunder: deskripsi kartu, artis, keterangan */
      --fs-sm: .8125rem;   /* 13px  label padat: chip, pager, toast, baris lagu */
      --fs-md: .875rem;    /* 14px  teks utama: body, navigasi, judul kartu/lagu */
      --fs-lg: 1rem;       /* 16px  ikon kontrol, penekanan */
      --fs-xl: 1.125rem;   /* 18px  subjudul, judul tontonan, tile genre */
      --fs-2xl: 1.5rem;    /* 24px  judul section */
      --fs-display: clamp(1.75rem, 1rem + 3.2vw, 3.25rem); /* judul hero, mengalir mengikuti lebar layar */
      --fw-regular: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --lh-tight: 1.2;
      --lh-snug: 1.35;
      --lh-normal: 1.5;
      --ls-display: -.02em;
      --ls-heading: -.01em;
      --ls-eyebrow: .08em;
    }

    :root[data-mode="lyric"] {
      --accent: var(--lyric);
      --accent-h: var(--lyric-h);
      --on-accent: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font, system-ui, sans-serif);
      font-size: var(--fs-md);
      overflow: hidden;
      line-height: var(--lh-normal);
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      line-height: 1.25;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Layout grid aplikasi (app shell) */

    .app {
      height: 100dvh;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
      grid-template-areas: "nav nav" "side main" "player player";
    }

    .nav {
      grid-area: nav;
    }

    .side {
      grid-area: side;
    }

    .main {
      grid-area: main;
    }

    .player-bar {
      grid-area: player;
    }

    /* Komponen Navbar: logo + pencarian */

    .nav {
      display: grid;
      grid-template-columns: 1fr minmax(0, 1.2fr) 1fr;
      align-items: center;
      gap: 15px;
      padding: 0 7px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 7px;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: var(--fs-lg);
      flex-shrink: 0;
      transition: .2s;
    }

    .logo-icon i {
      margin-left: 1px;
    }

    @media (hover: hover) and (pointer: fine) { .logo:hover .logo-icon {
      background: var(--accent-h);
      transform: scale(1.06);
    } }

    .search {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 47px;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--chip);
      border: 2px solid transparent;
      color: var(--muted);
      transition: .2s;
    }

    @media (hover: hover) and (pointer: fine) { .search:hover {
      background: #2a2a2a;
    } }

    .search:focus-within {
      border-color: #fff;
      color: #fff;
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: #fff;
      font: var(--fw-medium) var(--fs-md)/1.4 var(--font, system-ui, sans-serif);
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
    }

    /* Komponen Sidebar */

    .side {
      background: var(--panel);
      border-radius: var(--r);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* Item navigasi (sidebar & tabs mobile) */

    .side-nav {
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 11px 13px;
      border-radius: 7px;
      color: var(--muted);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-md);
      text-align: left;
      transition: .15s;
    }

    .nav-item i {
      width: 21px;
      text-align: center;
      font-size: var(--fs-lg);
    }

    @media (hover: hover) and (pointer: fine) { .nav-item:where(:not(.active)):hover {
      color: #fff;
    } }

    .nav-item.active {
      color: #fff;
      background: #2a2a2a;
    }

    .tabs {
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 11px 0 3px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs .nav-item {
      width: auto;
      flex: none;
      white-space: nowrap;
      padding: 7px 15px;
      gap: 7px;
      font-size: var(--fs-xs);
      background: var(--chip);
      border-radius: 999px;
    }

    .tabs .nav-item.active {
      background: #fff;
      color: #000;
    }

    /* Area konten utama: section, grid, hero, tile genre */

    .main {
      background: linear-gradient(180deg, #2a2a2a 0, var(--panel) 279px);
      border-radius: var(--r);
      overflow-y: auto;
      padding: 7px 23px 31px;
      scroll-behavior: smooth;
    }

    .main::-webkit-scrollbar {
      width: 9px;
    }

    .main::-webkit-scrollbar-thumb {
      background: #ffffff33;
      border-radius: 9px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .section {
      margin-top: 23px;
    }

    .section h2 {
      font-size: var(--fs-2xl);
      font-weight: var(--fw-bold);
      margin-bottom: 11px;
      letter-spacing: var(--ls-heading);
      line-height: 1.25;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(159px, 1fr));
      gap: 7px;
    }

    .back {
      color: var(--muted);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      margin-top: 15px;
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }

    @media (hover: hover) and (pointer: fine) { .back:hover {
      color: #fff;
    } }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 23px;
      padding: 15px 0 7px;
    }

    .hero>img, .hero>.gen {
      width: clamp(109px, 18vw, 199px);
      aspect-ratio: 1;
      border-radius: 7px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 7px 23px #00000080;
    }

    .hero.round>img {
      border-radius: 50%;
    }

    .hero .gen {
      display: grid;
      place-items: center;
      font-size: 3rem;
    }

    .hero small {
      text-transform: uppercase;
      font-size: var(--fs-2xs);
      font-weight: var(--fw-bold);
      letter-spacing: var(--ls-eyebrow);
      line-height: var(--lh-tight);
    }

    .hero h1 {
      font-size: var(--fs-display);
      line-height: 1.1;
      margin: 5px 0 7px;
      letter-spacing: var(--ls-display);
      font-weight: var(--fw-bold);
    }

    .hero p {
      color: var(--muted);
      font-size: var(--fs-md);
      line-height: var(--lh-normal);
    }

    .gtile {
      aspect-ratio: 1.6;
      border-radius: 9px;
      padding: 15px;
      font-weight: var(--fw-bold);
      font-size: var(--fs-xl);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s;
      line-height: var(--lh-tight);
    }

    @media (hover: hover) and (pointer: fine) { .gtile:hover {
      transform: scale(1.03);
    } }

    .gtile small {
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      opacity: .85;
    }

    .sub {
      font-size: var(--fs-xl);
      font-weight: var(--fw-bold);
      margin: 23px 0 11px;
      line-height: 1.3;
      letter-spacing: var(--ls-heading);
    }

    .credit {
      margin-top: 39px;
      padding: 19px 0 3px;
      border-top: 1px solid #ffffff1a;
      text-align: center;
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      color: var(--muted);
    }

    .credit-name {
      font-size: var(--fs-xl);
      font-weight: var(--fw-bold);
      color: #fff;
      line-height: var(--lh-snug);
    }

    .credit i {
      color: #e8115b;
      margin: 0 1px;
    }

    /* Komponen Card & Cover */

    .card {
      background: var(--card);
      border-radius: 7px;
      padding: 13px;
      position: relative;
      cursor: pointer;
      transition: background .25s;
      min-width: 0;
    }

    .card.playing {
      background: var(--card-h);
    }
    @media (hover: hover) and (pointer: fine) { .card:hover {
      background: var(--card-h);
    } }

    .cover {
      position: relative;
      aspect-ratio: 1;
      border-radius: 5px;
      overflow: hidden;
      background: #333;
      box-shadow: 0 7px 23px #00000080;
      margin-bottom: 13px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play {
      position: absolute;
      right: 7px;
      bottom: 7px;
      width: 47px;
      height: 47px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      display: grid;
      place-items: center;
      font-size: var(--fs-lg);
      box-shadow: 0 7px 7px #0000004d;
      opacity: 0;
      transform: translateY(7px);
      transition: .25s;
    }

    .card.playing .card-play, .card-play:focus-visible {
      opacity: 1;
      transform: none;
    }
    @media (hover: hover) and (pointer: fine) { .card:hover .card-play {
      opacity: 1;
      transform: none;
    } }

    @media (hover: hover) and (pointer: fine) { .card-play:hover {
      background: var(--accent-h);
      transform: scale(1.06);
    } }

    .card-title {
      font-weight: var(--fw-bold);
      font-size: var(--fs-md);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .card.playing .card-title {
      color: var(--accent);
    }

    .card-desc {
      font-size: var(--fs-xs);
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.round .cover {
      border-radius: 50%;
    }

    .card.round .card-title, .card.round .card-desc {
      text-align: center;
    }

    /* Komponen daftar lagu (track list) */

    .row {
      display: grid;
      grid-template-columns: 39px minmax(0, 3fr) minmax(0, 2fr) 55px;
      align-items: center;
      gap: 11px;
      padding: 7px 11px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--muted);
      font-size: var(--fs-sm);
    }

    .row.head {
      border-bottom: 1px solid #ffffff1a;
      border-radius: 0;
      cursor: default;
      font-size: var(--fs-2xs);
      text-transform: uppercase;
      margin-bottom: 7px;
      letter-spacing: .06em;
      font-weight: var(--fw-semibold);
    }

    @media (hover: hover) and (pointer: fine) { .row:not(.head):hover {
      background: #ffffff1a;
    } }

    .n {
      text-align: center;
    }

    .n i {
      display: none;
      color: #fff;
    }

    .row.playing .n b {
      display: none;
    }
    @media (hover: hover) and (pointer: fine) { .row:hover .n b {
      display: none;
    } }

    .row.playing .n i {
      display: inline;
    }
    @media (hover: hover) and (pointer: fine) { .row:hover .n i {
      display: inline;
    } }

    .t {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .t img {
      width: 39px;
      height: 39px;
      border-radius: 3px;
      flex: none;
      object-fit: cover;
    }

    .t>span {
      min-width: 0;
    }

    .t em {
      display: block;
      font-style: normal;
      color: #fff;
      font-weight: var(--fw-semibold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: var(--fs-md);
      line-height: 1.3;
    }

    .row.playing .t em {
      color: var(--accent);
    }

    .t small {
      display: block;
      font-size: var(--fs-xs);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    @media (hover: hover) and (pointer: fine) { .c-al[data-go]:hover {
      text-decoration: underline;
      color: #fff;
    } }

    .c-al {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-t {
      text-align: right;
    }

    .nosrc {
      opacity: .5;
    }

    /* Komponen Player Bar */

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
      align-items: center;
      gap: 15px;
      padding: 0 11px;
      background: #000;
    }

    .now {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .now img {
      width: 55px;
      height: 55px;
      border-radius: 5px;
      object-fit: cover;
      flex: none;
      background: #333;
    }

    .now-text {
      min-width: 0;
    }

    .now-title {
      font-weight: var(--fw-semibold);
      font-size: var(--fs-md);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .now-desc {
      font-size: var(--fs-xs);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      line-height: 1.3;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      max-width: 639px;
      width: 100%;
      justify-self: center;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 19px;
    }

    .ctl {
      color: var(--muted);
      font-size: var(--fs-lg);
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      position: relative;
      transition: .15s;
    }

    @media (hover: hover) and (pointer: fine) { .ctl:hover {
      color: #fff;
      transform: scale(1.08);
    } }

    .ctl.active {
      color: var(--accent);
    }

    .ctl.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
    }

    #play {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: var(--fs-lg);
    }

    @media (hover: hover) and (pointer: fine) { #play:hover {
      transform: scale(1.07);
    } }

    .seek {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
    }

    .time {
      font-size: var(--fs-2xs);
      color: var(--muted);
      min-width: 37px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .time:first-child {
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 3px;
      outline: 0;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      background: linear-gradient(to right, #fff var(--p, 0%), #4d4d4d var(--p, 0%));
    }

    @media (hover: hover) and (pointer: fine) { input[type=range]:hover {
      background: linear-gradient(to right, var(--accent) var(--p, 0%), #4d4d4d var(--p, 0%));
    } }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: .15s;
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: #fff;
    }

    input[type=range]:focus-visible::-webkit-slider-thumb {
      opacity: 1;
    }
    @media (hover: hover) and (pointer: fine) { input[type=range]:hover::-webkit-slider-thumb {
      opacity: 1;
    } }

    .extra {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      color: var(--muted);
    }

    .extra input {
      max-width: 109px;
    }

    .sc-credit {
      font-size: var(--fs-2xs);
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    @media (hover: hover) and (pointer: fine) { .sc-credit:hover {
      color: #ff5500;
    } }

    /* Komponen Toast */

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--player-h) + 23px);
      transform: translateX(-50%) translateY(9px);
      background: #fff;
      color: #000;
      padding: 9px 17px;
      border-radius: 999px;
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 80;
      max-width: 90vw;
      text-align: center;
      line-height: 1.3;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* Komponen Pagination & filter huruf artis */

    .pager-info {
      text-align: center;
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      margin-top: 23px;
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin: 9px 0 7px;
    }

    .pager button, .letters button {
      min-width: 35px;
      height: 35px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-weight: var(--fw-bold);
      font-size: var(--fs-sm);
      transition: .15s;
    }

    @media (hover: hover) and (pointer: fine) { .pager button:hover:not(:disabled):not(.active), .letters button:hover:not(:disabled):not(.active) {
      background: #2a2a2a;
      color: #fff;
    } }

    .pager button.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .letters button.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .pager button:disabled, .letters button:disabled {
      opacity: .3;
      cursor: default;
    }

    .pager .gap {
      color: var(--muted);
      padding: 0 1px;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin: 27px 0 7px;
    }

    /* Media queries (tablet, mobile, layar besar, reduced motion) */

    @media (max-width:720px) {
      .tabs {
        display: flex;
      }

      .row {

    /* Penyempurnaan tipografi */

    /* =====================================================================
       Material Design 3 refinement layer
       Hanya memperbarui tampilan (shape, elevation, state layer, tipografi,
       spacing, motion, responsivitas). Palet warna, struktur, dan perilaku
       tidak berubah.
       ===================================================================== */

    :root {
      /* Shape scale (M3) */
      --shape-xs: 4px;
      --shape-sm: 8px;
      --shape-md: 12px;
      --shape-lg: 16px;
      --shape-full: 999px;
      --r: var(--shape-lg);

      /* Elevation: bayangan halus, hanya dari hitam */
      --elev-1: 0 1px 2px #0000004d, 0 1px 3px 1px #00000026;
      --elev-2: 0 1px 2px #0000004d, 0 2px 6px 2px #00000026;
      --elev-3: 0 4px 8px 3px #00000026, 0 1px 3px #0000004d;

      /* State layer (M3): hover 8%, focus 10%, pressed 10% */
      --sl-hover: #ffffff14;
      --sl-press: #ffffff1f;
      --outline: #ffffff1f;

      /* Motion (M3 easing + duration) */
      --ease: cubic-bezier(.2, 0, 0, 1);
      --ease-out: cubic-bezier(0, 0, 0, 1);
      --dur-s: 120ms;
      --dur-m: 200ms;
      --dur-l: 300ms;

      --gap: 8px;
      --nav-h: 64px;
    }

    /* ---- Fokus & seleksi ---- */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: inherit;
    }

    .search input:focus-visible { outline: 0; }
    ::selection { background: var(--accent); color: var(--on-accent); }

    /* ---- Tombol dasar: tap target, transisi, pressed ---- */
    button { transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease), transform var(--dur-s) var(--ease), box-shadow var(--dur-m) var(--ease), opacity var(--dur-m) var(--ease); }
    button:disabled { cursor: default; }

    /* ---- Navbar ---- */
    .nav { gap: 16px; padding: 0 8px; }
    .nav-left { gap: 12px; }
    .logo { padding: 0 8px; border-radius: var(--shape-full); }
    .logo-icon { width: 40px; height: 40px; box-shadow: var(--elev-1); transition: background-color var(--dur-m) var(--ease), transform var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .logo:hover .logo-icon { transform: scale(1.05); box-shadow: var(--elev-2); } }

    /* Search bar (M3 search: pill, state layer, fokus dengan ring) */
    .search {
      height: 48px;
      padding: 0 16px;
      gap: 12px;
      background: var(--chip);
      border: 1px solid transparent;
      box-shadow: inset 0 0 0 1px transparent;
      transition: background-color var(--dur-m) var(--ease), border-color var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease), color var(--dur-m) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .search:hover { background: #2a2a2a; } }
    .search:focus-within {
      background: var(--chip);
      border-color: #fff;
      box-shadow: inset 0 0 0 1px #fff;
      color: #fff;
    }
    .search input { font-size: var(--fs-md); font-weight: var(--fw-medium); letter-spacing: .01em; }
    .search input::placeholder { color: var(--muted); opacity: 1; }
    .search input::-webkit-search-cancel-button { filter: invert(1); opacity: .7; cursor: pointer; }

    .nav-right { gap: 4px; }

    /* Segmented / version switch */

    /* ---- Sidebar (navigation drawer / rail) ---- */
    .side { border-radius: var(--shape-lg); box-shadow: var(--elev-1); }

    .side-nav { padding: 8px; gap: 4px; }
    .nav-item {
      position: relative;
      min-height: 48px;
      padding: 0 16px;
      gap: 16px;
      border-radius: var(--shape-full);
      font-size: var(--fs-md);

    }
    .nav-item i { width: 24px; font-size: var(--fs-lg); }
    @media (hover: hover) and (pointer: fine) { .nav-item:where(:not(.active)):hover { background: var(--sl-hover); color: #fff; } }
    
    .nav-item.active { background: #2a2a2a; color: #fff; }

    /* Tabs / chips di HP */
    .tabs { gap: 8px; padding: 12px 0 4px; scroll-snap-type: x proximity; }
    .tabs .nav-item {
      min-height: 36px;
      height: 36px;
      padding: 0 16px;
      gap: 8px;
      font-size: var(--fs-sm);
      background: var(--chip);
      box-shadow: inset 0 0 0 1px var(--outline);

    }
    @media (hover: hover) and (pointer: fine) { .tabs .nav-item:where(:not(.active)):hover { background: #2a2a2a; } }
    .tabs .nav-item.active { background: #fff; color: #000; box-shadow: none; }

    /* ---- Area utama ---- */
    .main { border-radius: var(--shape-lg); padding: 8px 24px 32px; box-shadow: var(--elev-1); }
    .main::-webkit-scrollbar { width: 10px; }
    .main::-webkit-scrollbar-thumb { background: #ffffff33; border-radius: var(--shape-full); border: 3px solid transparent; background-clip: content-box; }
    @media (hover: hover) and (pointer: fine) { .main::-webkit-scrollbar-thumb:hover { background: #ffffff59; background-clip: content-box; } }

    .section { margin-top: 24px; }
    .section h2 { font-size: var(--fs-2xl); font-weight: var(--fw-bold); line-height: 1.3; margin-bottom: 12px; }
    .sub { margin: 24px 0 12px; font-weight: var(--fw-bold); }
    .grid { gap: 12px; }

    .back {
      height: 36px;
      margin-top: 16px;
      padding: 0 16px 0 12px;
      gap: 8px;
      border-radius: var(--shape-full);
      font-size: var(--fs-sm);
      letter-spacing: .01em;
      transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .back:hover { background: var(--sl-hover); color: #fff; } }

    /* Hero */
    .hero { gap: 24px; padding: 16px 0 8px; }
    .hero>img, .hero>.gen { border-radius: var(--shape-md); box-shadow: var(--elev-3); }
    .hero.round>img { border-radius: 50%; }
    .hero small { font-size: var(--fs-2xs); letter-spacing: var(--ls-eyebrow); }
    .hero h1 { margin: 6px 0 8px; line-height: 1.1; }
    .hero p { line-height: var(--lh-normal); }

    /* Genre tile */
    .gtile {
      border-radius: var(--shape-md);
      padding: 16px;
      box-shadow: var(--elev-1);
      transition: transform var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease), filter var(--dur-m) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .gtile:hover { transform: translateY(-2px); box-shadow: var(--elev-3); filter: brightness(1.06); } }

    .credit { margin-top: 40px; padding: 20px 0 4px; border-top: 1px solid var(--outline); line-height: var(--lh-normal); }

    /* ---- Card (M3 filled card) ---- */
    .card {
      border-radius: var(--shape-md);
      padding: 12px;
      box-shadow: none;
      transition: background-color var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease), transform var(--dur-m) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .card:hover { box-shadow: var(--elev-2); } }
    
    .cover { border-radius: var(--shape-sm); box-shadow: var(--elev-2); margin-bottom: 12px; }
    .card.round .cover { border-radius: 50%; }
    .card-play {
      right: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      box-shadow: var(--elev-3);
      transition: opacity var(--dur-m) var(--ease), transform var(--dur-m) var(--ease), background-color var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .card-play:hover { transform: scale(1.05); } }
    
    .card-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); line-height: 1.35; margin-bottom: 4px; letter-spacing: .005em; }
    .card-desc { line-height: 1.45; }

    /* ---- Track list (M3 list item) ---- */
    .row {
      grid-template-columns: 40px minmax(0, 3fr) minmax(0, 2fr) 56px;
      gap: 12px;
      min-height: 56px;
      padding: 8px 12px;
      border-radius: var(--shape-sm);
      transition: background-color var(--dur-m) var(--ease);
    }
    .row.head { min-height: 0; padding: 8px 12px; margin-bottom: 8px; letter-spacing: .08em; }
    @media (hover: hover) and (pointer: fine) { .row:not(.head):hover { background: var(--sl-hover); } }
    
    .row.playing:not(.head) { background: #ffffff0f; }
    .t { gap: 12px; }
    .t img { width: 40px; height: 40px; border-radius: var(--shape-xs); }
    .t em { line-height: 1.35; }
    .t small { line-height: 1.35; margin-top: 1px; }
    .c-t { font-variant-numeric: tabular-nums; }

    /* ---- Player bar (M3 bottom app bar) ---- */
    .player-bar { padding: 0 12px; gap: 16px; border-radius: var(--shape-lg); box-shadow: 0 -1px 0 var(--outline); }
    .now { gap: 12px; }
    .now img { width: 56px; height: 56px; border-radius: var(--shape-sm); box-shadow: var(--elev-1); }
    .now-title { font-weight: var(--fw-semibold); line-height: 1.35; }
    .now-desc { line-height: 1.35; }
    .controls { gap: 9px; padding-bottom: 2px; }
    .btns { gap: 12px; }
    .ctl {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease), transform var(--dur-s) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .ctl:hover { background: var(--sl-hover); color: #fff; transform: none; } }
    
    .ctl.active::after { bottom: 3px; }
    #play { width: 44px; height: 44px; background: #fff; color: #000; box-shadow: var(--elev-2); }
    @media (hover: hover) and (pointer: fine) { #play:hover { background: #fff; transform: scale(1.06); box-shadow: var(--elev-3); } }
    
    .seek { gap: 12px; }
    .time { font-size: var(--fs-2xs); min-width: 36px; letter-spacing: .02em; }

    /* Slider (M3): track 4px, thumb 14px dengan halo saat fokus */
    input[type=range] { height: 4px; border-radius: var(--shape-full); transition: background-color var(--dur-m) var(--ease); }
    input[type=range]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px #00000080;
      transition: opacity var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease), transform var(--dur-s) var(--ease);
    }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #00000080; }
    input[type=range]::-moz-range-track { height: 4px; background: transparent; border-radius: var(--shape-full); }
    @media (hover: hover) and (pointer: fine) { input[type=range]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px var(--sl-hover), 0 1px 3px #00000080; } }
    
    input[type=range]:focus-visible { outline-offset: 6px; }
    .extra { gap: 12px; }
    .sc-credit { transition: color var(--dur-m) var(--ease); }

    /* ---- Toast (M3 snackbar) ---- */
    .toast {
      bottom: calc(var(--player-h) + 24px);
      padding: 12px 20px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--shape-sm);
      box-shadow: var(--elev-3);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      letter-spacing: .01em;
      transition: opacity var(--dur-m) var(--ease), transform var(--dur-l) var(--ease);
    }

    /* ---- Pagination & filter huruf ---- */
    .pager-info { margin-top: 24px; letter-spacing: .02em; }
    .pager { gap: 8px; margin: 12px 0 8px; }
    .letters { gap: 8px; margin: 28px 0 8px; }
    .pager button, .letters button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      background: var(--chip);
      box-shadow: inset 0 0 0 1px var(--outline);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      letter-spacing: .01em;
      transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease), transform var(--dur-s) var(--ease);
    }
    @media (hover: hover) and (pointer: fine) { .pager button:hover:not(:disabled):not(.active), .letters button:hover:not(:disabled):not(.active) { background: #2a2a2a; color: #fff; } }
    
    .pager button.active, .letters button.active { box-shadow: var(--elev-1); }
    .pager button:disabled, .letters button:disabled { opacity: .38; }

    /* ---- Category chips (M3 filter chip) ---- */

    /* ---- Favorite (icon button) ---- */
    .fav-btn { width: 40px; height: 40px; transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease), transform var(--dur-s) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .fav-btn:hover:not(:disabled) { background: var(--sl-hover); transform: none; } }
    
    .now .fav-btn { width: 40px; padding: 0; justify-content: center; margin-left: auto; margin-right: -8px; }
    .row.fav { grid-template-columns: 40px minmax(0, 3fr) minmax(0, 2fr) 56px 24px; }
    .row.fav .fav-btn { width: 100%; height: 32px; border-radius: 0; }
    @media (hover: hover) and (pointer: fine) { .row.fav .fav-btn:hover:not(:disabled) { background: none; } }

    /* ---- Videos ---- */
    .vgrid { gap: 20px 12px; }
    .vthumb { border-radius: var(--shape-md); box-shadow: var(--elev-1); transition: transform var(--dur-m) var(--ease), box-shadow var(--dur-m) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .vcard:hover .vthumb { transform: none; box-shadow: var(--elev-3); } }
    
    .vdur { padding: 2px 6px; border-radius: var(--shape-xs); letter-spacing: .02em; }
    .vplay { width: 48px; height: 48px; margin: -24px 0 0 -24px; box-shadow: var(--elev-3); transition: opacity var(--dur-m) var(--ease), transform var(--dur-m) var(--ease), background-color var(--dur-m) var(--ease); }
    .vmeta { padding: 12px 4px 0; }
    .vtitle { font-weight: var(--fw-semibold); line-height: 1.4; }
    .vsub { margin-top: 4px; }
    .vfav { top: 8px; right: 8px; width: 32px; height: 32px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

    /* Theater */
    .theater-stage, .theater-frame, .theater-poster { border-radius: var(--shape-md); }
    .theater-stage { box-shadow: var(--elev-2); }
    .theater.mini .theater-frame, .theater:not(.watching) .theater-frame { border: 0; box-shadow: var(--elev-3), 0 0 0 1px var(--outline); }
    .theater-poster .vplay { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
    .theater-info { gap: 12px; padding: 12px 4px 0; }
    .theater-title { font-weight: var(--fw-bold); line-height: 1.35; }
    .theater-meta { line-height: 1.45; margin-top: 4px; }

    /* Info musik di bawah pemutar: cover album bulat di kiri, artis / judul / album di kanan */
    .theater-info { align-items: center; gap: 14px; }
    .theater-cover { flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #333; box-shadow: var(--elev-1); }
    .theater-cover[hidden] { display: none; }
    .theater-text { display: flex; flex-direction: column; gap: 2px; }
    .theater-artist { font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 1.3; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .theater-artist:empty, .theater-meta:empty { display: none; }
    .theater-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .theater-meta { margin-top: 0; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width:720px) {
      .theater-info { gap: 12px; }
      .theater-cover { width: 48px; height: 48px; }
    }
    .theater.watching { gap: 16px; }
    .theater-back { margin: 12px 0; --tb-y: 12px; }
    .mini-btn { width: 32px; height: 32px; top: 8px; transition: background-color var(--dur-m) var(--ease), transform var(--dur-s) var(--ease); }
    .mini-btn.open { left: 8px; }
    .mini-btn.close { right: 8px; }
    
    .theater-next h3 { font-size: var(--fs-md); font-weight: var(--fw-semibold); padding: 0 8px 8px; letter-spacing: .01em; }
    .next-item { gap: 11px; padding: 7px; border-radius: var(--shape-sm); transition: background-color var(--dur-m) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .next-item:hover { background: var(--sl-hover); } }
    
    .next-thumb { border-radius: var(--shape-sm); }
    .next-title { font-weight: var(--fw-semibold); line-height: 1.35; }

    /* ---- Up next (Videos): label seksi, indikator sedang diputar, album, Love, dan durasi ---- */
    .next-item { --next-thumb-w: 109px; position: relative; align-items: stretch; }
    .next-thumb-box { position: relative; flex: none; width: var(--next-thumb-w); align-self: flex-start; }
    .next-thumb-box .next-thumb { display: block; width: 100%; }
    .next-play { position: absolute; inset: 0; display: grid; place-items: center; border-radius: var(--shape-sm); background: #00000066; color: var(--accent); font-size: var(--fs-md); opacity: 0; transition: opacity var(--dur-m) var(--ease); pointer-events: none; }
    @media (hover: hover) and (pointer: fine) { .next-item:hover .next-play { opacity: 1; } }
    .next-text { flex: 1; align-self: center; display: flex; flex-direction: column; gap: 1px; }
    .next-title { font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .next-sub { margin-top: 0; font-size: var(--fs-xs); color: #d0d0d0; }
    .next-album { font-size: var(--fs-2xs); line-height: 1.3; color: var(--muted); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Kolom kanan Up next: durasi di bawah; lebar tetap supaya durasi rata kanan dan lurus antar item */
    .next-side { flex: none; width: 40px; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; align-self: stretch; margin: -3px -3px -1px 0; }
    .next-drag { flex: none; width: 14px; height: calc(var(--next-thumb-w) * 9 / 16); align-self: flex-start; margin: 0 -2px 0 -7px; padding: 0; border: 0; background: none; display: flex; align-items: stretch; justify-content: flex-start; border-radius: 4px; color: var(--muted); font-size: var(--fs-sm); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .next-drag:hover { background: var(--sl-hover); color: var(--accent); } }
    
    .next-drag:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* Ikon drag handle ala YouTube (Mix): dua garis horizontal sangat tipis 14x1, jarak 4, rapat dan di tengah secara vertikal terhadap tinggi thumbnail; area sentuh = setinggi thumbnail, menempel di tepi kiri item */
    @media (hover: hover) and (pointer: fine) { .next-drag:hover { background: none; } }
    .next-drag { align-items: center; }
    .next-drag-lines { display: block; width: 14px; height: 6px; margin-left: 0; pointer-events: none; background: linear-gradient(currentColor 0 0) top / 100% 1px no-repeat, linear-gradient(currentColor 0 0) bottom / 100% 1px no-repeat; }
    .next-dur { padding: 0 5px 1px 0; font-size: var(--fs-2xs); font-weight: var(--fw-medium, 500); font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; color: var(--muted); opacity: .75; text-align: right; white-space: nowrap; }
    /* Saat digeser: item terangkat, item lain bergeser mulus memberi tempat */
    .next-list.is-dragging { user-select: none; -webkit-user-select: none; }
    .next-list.is-dragging .next-item:not(.dragging) { transition: transform 160ms var(--ease); }
    .next-item.dragging { z-index: 3; cursor: grabbing; background: color-mix(in srgb, var(--accent) 14%, var(--bg, #121212)); box-shadow: var(--elev-3); transition: none; }
    .next-item.dragging .next-drag { color: var(--accent); }
    @media (max-width:720px) {
      .next-item { --next-thumb-w: 112px; }
      .next-side { width: 44px; }
      .next-drag { width: 16px; }
      .next-play { display: none; }
    }
    @media (max-width:380px) {
      .next-item { --next-thumb-w: 96px; }
      .next-item { gap: 9px; }
    }

    /* Info musik di bawah video: kolom kanan = durasi (kanan atas) + Love / Play-Pause / Bagikan (bawah, horizontal) */
    .theater-side { flex: none; align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; margin-right: -6px; }
    .theater-dur { padding: 2px 10px 0 0; font-size: var(--fs-sm); font-weight: var(--fw-medium, 500); font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; color: var(--muted); white-space: nowrap; }
    .theater-dur:empty { display: none; }
    .theater-actions { display: flex; align-items: center; }
    .th-act { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); font-size: var(--fs-lg); transition: background-color var(--dur-m) var(--ease), color var(--dur-m) var(--ease), transform var(--dur-s) var(--ease); }
    @media (hover: hover) and (pointer: fine) { .th-act:hover:not(:disabled) { background: var(--sl-hover); color: #fff; } }
    
    .th-act:disabled { opacity: .4; cursor: default; }
    .th-act.play.on { color: var(--accent); }
    @media (hover: hover) and (pointer: fine) { .th-act.play:hover:not(:disabled), .th-act.share:hover:not(:disabled) { color: var(--accent); } }
    .th-act.fav.on { color: #e8115b; }
    @media (hover: hover) and (pointer: fine) { .th-act.fav.on:hover:not(:disabled) { color: #e8115b; } } /* sama dengan ikon love di bar pemutar */
    .th-act:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .theater-side[hidden] { display: none; }
    @media (max-width:720px) {
      .th-act { width: 34px; height: 34px; font-size: var(--fs-md); }
      .theater-side { margin-right: -4px; }
      .theater-dur { padding-right: 8px; font-size: var(--fs-xs); }
    }

    /* ---- Responsif ---- */
    @media (max-width:1100px) {
      .nav-item { padding: 0; }
      .side-nav { align-items: stretch; }
    }

    @media (max-width:720px) {
      :root { --nav-h: 56px; }
      .app { gap: 0; }
      .nav { gap: 8px; padding: 0 12px; }
      .logo-icon { width: 36px; height: 36px; }
      .search { height: 40px; padding: 0 12px; gap: 8px; }
      .main { border-radius: 0; padding: 4px 16px 20px; box-shadow: none; }
      .section { margin-top: 20px; }
      .grid { gap: 8px; }
      .card { padding: 10px; border-radius: var(--shape-md); }
      .card-play { width: 40px; height: 40px; }

      .row { grid-template-columns: 28px minmax(0, 1fr) 44px; gap: 8px; padding: 8px 4px; }
      .row.fav { grid-template-columns: 28px minmax(0, 1fr) 44px 24px; }
      .hero { gap: 16px; }
      .vgrid { gap: 16px 8px; }
      .player-bar { border-radius: 0; gap: 4px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--outline); box-shadow: none; }
      .now img { width: 44px; height: 44px; }
      .btns { gap: 20px; }
      .ctl { width: 44px; height: 44px; }
      #play { width: 48px; height: 48px; }
      .pager button, .letters button { min-width: 44px; height: 44px; }
      .tabs .nav-item { height: 40px; min-height: 40px; }
      .toast { bottom: calc(var(--player-h) + 16px); max-width: calc(100vw - 32px); }
      .theater.watching { padding: 0 0 16px; }
      .theater-stage, .theater-frame, .theater-poster { border-radius: 0; box-shadow: none; }
      .theater-info { padding: 12px 16px 0; }
      .theater-back { margin: 8px 12px; --tb-y: 8px; --tb-x: 12px; }
      .theater-next { margin: 0 8px; }
    }

    /* Layar sangat kecil (<= 380px): kepadatan dijaga, tap target tetap nyaman */
    @media (max-width:380px) {
      .main { padding-left: 12px; padding-right: 12px; }
      .logo-icon { width: 34px; height: 34px; }
      .btns { gap: 12px; }
      .row { grid-template-columns: 24px minmax(0, 1fr) 40px; }
      .row.fav { grid-template-columns: 24px minmax(0, 1fr) 40px 24px; }
      .card-title { font-size: var(--fs-sm); }
      .hero>img, .hero>.gen { width: 96px; }
    }

    @media (prefers-reduced-motion:reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }

    /* Pagination: selalu satu baris. Tidak pernah wrap; bila ruang sempit, jarak dan ukuran tombol dikecilkan bertahap. */
    .pager {
      flex-wrap: nowrap;
      justify-content: flex-start;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      padding: 4px;
      margin: 8px 0 4px;
    }
    .pager::-webkit-scrollbar { display: none; }
    /* Rata tengah saat muat; bila meluap, isi mulai dari tepi kiri dan bisa digeser */
    .pager > :first-child { margin-left: auto; }
    .pager > :last-child { margin-right: auto; }
    .pager button, .pager .gap { flex: none; white-space: nowrap; }

    @media (max-width:420px) {
      .pager { gap: 4px; }
      .pager button { min-width: 38px; height: 38px; padding: 0 8px; }
    }
    @media (max-width:340px) {
      .pager { gap: 3px; }
      .pager button { min-width: 34px; height: 34px; padding: 0 6px; }
      .pager .gap { padding: 0; }
    }

    /* =====================================================================
       Refinement layer v3 — penyempurnaan visual akhir
       Hanya CSS. Struktur HTML, JavaScript, data, dan palet aksen
       (ungu = Music, hijau = Videos) tidak diubah.
       Prinsip: satu skala permukaan (tonal surface), satu skala sudut,
       tanpa gradient dekoratif, state yang konsisten di semua komponen.
       ===================================================================== */

    :root {
      color-scheme: dark;
      --font: "Plus Jakarta Sans", "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;

      /* Skala permukaan netral: panel < kartu < hover < terpilih */
      --panel: #121212;
      --card: #1a1a1a;
      --card-h: #242424;
      --chip: #202020;
      --surface-4: #2d2d2d;
      --outline: #ffffff1f;
      --muted: #b8b8b8;

      /* Kontainer aksen (state terpilih yang lembut), mengikuti mode aktif */
      --accent-c: color-mix(in srgb, var(--accent) 24%, var(--panel));
      --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);

      /* Skala sudut: kontrol = pil, kartu = 16, cover = 12, thumb kecil = 8 */
      --shape-card: 16px;
      --shape-cover: 12px;
      --shape-thumb: 8px;

      /* Tipografi: bobot lebih ringan, tracking rapat hanya untuk judul besar */
      --fs-2xl: 1.375rem;
      --ls-eyebrow: .01em;
    }

    body { font-family: var(--font); font-feature-settings: "tnum" 0, "kern" 1; }
    .search input { font-family: var(--font); }
    h1, h2, .sub { text-wrap: balance; }
    :root[data-mode="lyric"] { --accent-c: color-mix(in srgb, var(--lyric) 22%, var(--panel)); }

    /* ---- Permukaan utama: rata, tanpa gradient ---- */
    .main { background: var(--panel); box-shadow: none; padding: 8px 28px 40px; }
    .side { background: var(--panel); box-shadow: none; }
    .player-bar { background: var(--panel); box-shadow: none; padding: 0 16px; }

    /* ---- Teks bagian & judul ---- */
    .section h2 { font-size: var(--fs-2xl); font-weight: var(--fw-bold); letter-spacing: -.015em; margin-bottom: 14px; }
    .sub { font-size: var(--fs-xl); font-weight: var(--fw-semibold); }
    
    .hero small { text-transform: none; font-size: var(--fs-sm); font-weight: var(--fw-semibold); letter-spacing: .01em; opacity: .75; }
    .hero h1 { font-weight: 800; letter-spacing: -.025em; }
    .hero>img, .hero>.gen { border-radius: var(--shape-card); }
    .hero.round>img { border-radius: 50%; }

    /* ---- Navbar & pencarian ---- */
    .search { background: var(--card); box-shadow: inset 0 0 0 1px var(--outline); border-color: transparent; }
    @media (hover: hover) and (pointer: fine) { .search:hover { background: var(--card-h); } }
    .search:focus-within { background: var(--card); border-color: transparent; box-shadow: inset 0 0 0 2px var(--accent-h); color: #fff; }
    .search input::placeholder { font-weight: var(--fw-regular); }

    /* ---- Navigasi samping: item aktif memakai kontainer aksen ---- */
    @media (hover: hover) and (pointer: fine) { .nav-item:where(:not(.active)):hover { background: var(--sl-hover); } }
    .nav-item.active { background: var(--accent-c); color: #fff; }
    .nav-item.active i { color: var(--accent-h); }

    /* Tab di HP: terpilih = aksen penuh, sama dengan chip kategori dan pagination */
    .tabs .nav-item { background: var(--chip); }
    .tabs .nav-item.active { background: var(--accent); color: var(--on-accent); box-shadow: none; }
    .tabs .nav-item.active i { color: inherit; }

    /* ---- Kartu ---- */
    .card { border-radius: var(--shape-card); padding: 14px; }
    .card.playing { background: var(--card-h); }
    @media (hover: hover) and (pointer: fine) { .card:hover { background: var(--card-h); } }
    @media (hover: hover) and (pointer: fine) { .card:hover { box-shadow: none; } }
    .cover { border-radius: var(--shape-cover); box-shadow: 0 2px 8px #00000066; margin-bottom: 14px; }
    .card.round .cover { border-radius: 50%; }
    .card-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
    .card.playing .card-title, .row.playing .t em, .vcard.playing .vtitle { color: var(--accent-h); }
    .card-play { color: var(--on-accent); box-shadow: 0 4px 12px #00000080; }
    @media (hover: hover) and (pointer: fine) { .card-play:hover { background: var(--accent-h); } }
    .gtile { border-radius: var(--shape-card); padding: 18px; }
    @media (hover: hover) and (pointer: fine) { .gtile:hover { transform: none; filter: brightness(1.1); box-shadow: var(--elev-2); } }

    /* ---- Daftar lagu ---- */
    .row { border-radius: var(--shape-cover); }
    .row.head { text-transform: none; font-size: var(--fs-xs); font-weight: var(--fw-semibold); letter-spacing: .02em; border-bottom: 1px solid var(--outline); border-radius: 0; }
    @media (hover: hover) and (pointer: fine) { .row:not(.head):hover { background: #ffffff10; } }
    .row.playing:not(.head) { background: var(--accent-soft); }
    .t img { border-radius: var(--shape-thumb); }
    .t em { font-weight: var(--fw-semibold); }

    /* ---- Video ---- */
    .vthumb { border-radius: var(--shape-card); box-shadow: none; background: var(--card); }
    @media (hover: hover) and (pointer: fine) { .vcard:hover .vthumb { box-shadow: 0 6px 18px #00000099; } }
    .vplay { color: var(--on-accent); }
    .vdur { border-radius: 6px; background: #000000cc; }
    .vfav { background: #000000b3; }
    .theater.watching { background: var(--panel); }
    .theater-stage, .theater-frame, .theater-poster { border-radius: var(--shape-card); }
    .theater-title { font-weight: var(--fw-bold); letter-spacing: -.01em; }
    .next-item { border-radius: var(--shape-cover); }
    .next-thumb, .next-play { border-radius: var(--shape-thumb); }
    .next-item.dragging { background: var(--surface-4); }

    /* ---- Bar pemutar ---- */
    .now img { border-radius: var(--shape-cover); box-shadow: 0 2px 8px #00000066; }
    .now-title { font-weight: var(--fw-semibold); }
    #play { background: var(--accent); color: var(--on-accent); box-shadow: none; }
    @media (hover: hover) and (pointer: fine) { #play:hover { background: var(--accent-h); box-shadow: var(--elev-2); } }
    .ctl.active { color: var(--accent-h); }
    .ctl.active::after { background: var(--accent-h); }

    /* Slider: bagian terisi selalu berwarna aksen agar progres terbaca jelas */
    input[type=range] {
      background: linear-gradient(to right, var(--accent-h) var(--p, 0%), #ffffff2e var(--p, 0%));
    }
    @media (hover: hover) and (pointer: fine) { input[type=range]:hover { background: linear-gradient(to right, var(--accent-h) var(--p, 0%), #ffffff40 var(--p, 0%)); } }
    input[type=range]::-webkit-slider-thumb { background: #fff; }

    /* ---- Chip, tab, pagination, filter huruf ---- */
    
    .pager button,
    .letters button { background: var(--chip); }
    @media (hover: hover) and (pointer: fine) { .pager button:hover:not(:disabled):not(.active),
    .letters button:hover:not(:disabled):not(.active) { background: var(--surface-4); } }
    .pager button, .letters button { min-width: 38px; height: 38px; padding: 0 10px; }
    .pager { justify-content: safe center; gap: 6px; }
    .pager-info { font-weight: var(--fw-medium); }

    /* ---- Toast & kredit ---- */
    .toast { border-radius: var(--shape-cover); }
    .credit { font-weight: var(--fw-medium); }
    .credit-name { font-size: var(--fs-lg); }

    /* ---- Layar kecil ---- */
    @media (max-width:720px) {
      .main { padding: 4px 16px 24px; }
      .card { padding: 10px; border-radius: var(--shape-cover); }
      .cover { border-radius: var(--shape-thumb); margin-bottom: 10px; }
      .card.round .cover { border-radius: 50%; }
      .gtile { padding: 14px; border-radius: var(--shape-cover); }
      .row { border-radius: var(--shape-thumb); }
      .vthumb, .theater-stage, .theater-frame, .theater-poster { border-radius: var(--shape-cover); }
      .theater-stage, .theater-frame, .theater-poster { border-radius: 0; }
      .player-bar { background: var(--panel); border-top: 1px solid var(--outline); }
      #play { width: 48px; height: 48px; }
      .pager { gap: 4px; }
      .pager button, .letters button { min-width: 40px; height: 40px; padding: 0 8px; }
      .section h2 { font-size: var(--fs-2xl); }
    }
    @media (max-width:420px) {
      .pager button { min-width: 36px; height: 36px; padding: 0 6px; }
    }
    @media (max-width:340px) {
      .pager button { min-width: 32px; height: 32px; padding: 0 4px; }
    }

    /* Up next sejajar dengan video: tombol Kembali setinggi 36px + margin 12px atas/bawah = 60px, dikurangi padding item 7px */
    @media (min-width:1101px) {
      .theater.watching .theater-next { margin-top: 53px; }
    }

    /* Halaman tontonan: artis, judul lagu, dan album selalu satu baris, terpotong dengan titik-titik (…) */
    .theater-text { min-width: 0; }
    .theater-title, .theater-meta, .theater-artist {
      display: block;
      max-width: 100%;
      white-space: nowrap;
      text-wrap: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Penyesuaian spacing Music Bar */
    .player-bar .now { margin-top: 2px; }              /* cover + judul lagu: jarak atas +2px */
    .player-bar #play { margin-top: -2px; margin-bottom: -2px; } /* tombol Play: jarak atas & bawah -2px */
    .player-bar #dur { margin-bottom: 2px; }           /* durasi lagu: jarak bawah +2px */

    /* Videos (hijau): info lagu sudah tampil di bawah pemutar video, jadi bar tidak menampilkan data lagu (cover, judul, dll.) dan tingginya diperkecil; desain tetap identik */
    :root[data-mode="lyric"] { --player-h: 80px; }
    :root[data-mode="lyric"] .player-bar .now { margin-top: 0; }
    :root[data-mode="lyric"] .player-bar .now > * { display: none; }
    @media (max-width:720px) {
      :root[data-mode="lyric"] { --player-h: 84px; }
      :root[data-mode="lyric"] .player-bar { gap: 0; }
    }

    /* =====================================================================
       Refinement layer v4 — audit akhir (CSS saja; HTML, JS, dan data tetap)
       ===================================================================== */

    /* Tile genre: warna tile berasal dari data (inline), sebagian terlalu terang
       untuk teks putih (R&B 2.5:1, Pop Rock/Punk Rock/Folk <4:1). Lapisan gelap
       di belakang teks menaikkan kontras ke >=4.5:1 tanpa mengubah hue tile. */
    .gtile { position: relative; isolation: isolate; overflow: hidden; color: #fff; }
    .gtile::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: #00000052;
      pointer-events: none;
    }
    .gtile small { opacity: 1; }

    /* Kredit sumber di bar pemutar: 11px dengan area sentuh 17px terlalu kecil */
    .sc-credit {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 4px;
      font-size: var(--fs-xs);
    }

    /* =====================================================================
       Interactive states v5: satu sumber kebenaran untuk urutan state
       default → hover → pressed (:active) → selected → focus-visible → disabled
       - Semua :hover di atas dibatasi ke (hover: hover) and (pointer: fine),
         sehingga perangkat sentuh tidak pernah menampilkan hover yang menempel.
       - Elemen terpilih (.active) tidak berubah saat di-hover.
       - Aturan pressed (:active) dikumpulkan di sini, sesudah semua hover,
         agar pada specificity sama selalu pressed yang menang atas hover.
       ===================================================================== */

    /* Pressed */
    .logo:active .logo-icon { transform: scale(.94); }

    .nav-item:active { background: var(--sl-press); }
    .back:active { background: var(--sl-press); }
    .gtile:active { transform: scale(.98); box-shadow: var(--elev-1); }
    .card:active { transform: scale(.985); }
    .card-play:active { transform: scale(.94); }
    .row:not(.head):active { background: var(--sl-press); }
    .ctl:active { background: var(--sl-press); transform: scale(.92); }
    #play:active { transform: scale(.94); box-shadow: var(--elev-1); }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); box-shadow: 0 0 0 8px var(--sl-press), 0 1px 3px #00000080; }
    .pager button:active:not(:disabled), .letters button:active:not(:disabled) { transform: scale(.95); }
    
    .fav-btn:active:not(:disabled) { background: var(--sl-press); transform: scale(.9); }
    .row.fav .fav-btn:active:not(:disabled) { background: none; }
    .vcard:active .vthumb { transform: scale(.985); }
    .mini-btn:active { transform: scale(.92); }
    .next-item:active { background: var(--sl-press); }
    .next-drag:active { cursor: grabbing; background: var(--sl-press); }
    .next-drag:active { background: none; }
    .th-act:active:not(:disabled) { background: var(--sl-press); transform: scale(.9); }

    /* Pressed pada elemen terpilih: respons singkat tanpa kehilangan penanda selected */
    .nav-item.active:active { background: color-mix(in srgb, var(--accent) 30%, var(--panel)); }
    .tabs .nav-item.active:active { background: var(--accent-h); }

    /* Disabled: tidak responsif terhadap hover maupun pressed */
    button:disabled:active { transform: none; }

    /* Fokus keyboard: slider memakai outline sendiri agar terlihat di semua browser */
    input[type=range]:focus-visible { outline: 2px solid var(--accent); }

    /* Perangkat sentuh (tanpa hover): elemen yang disingkap lewat hover harus
       tetap terlihat, sama seperti tampilan HP (<=720px), agar tidak hilang di tablet */
    @media (hover: none) {
      .card-play { opacity: 1; transform: none; }
    }

    /* Daftar lagu Indonesian/International Songs (tema ungu) di layar sentuh:
       baris lagu tidak menampilkan highlight apa pun saat disentuh. Baris yang sedang
       diputar (.playing) tetap memakai penanda aslinya; klik, putar, dan navigasi tidak berubah. */
    @media (hover: none), (pointer: coarse) {
      :root[data-mode="music"] [data-songs-list] .row:not(.head):active { background: transparent; }
      :root[data-mode="music"] [data-songs-list] .row.playing:not(.head):active { background: var(--accent-soft); }
    }

  </style>
</head>

  <!-- Widget SoundCloud tersembunyi: mesin pemutar audio -->

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script type="module">
    'use strict';

    /* ################ CONFIG       ################ */

    /* ---- config/constants.js ---- */
    /**
     * Konfigurasi aplikasi: satu-satunya tempat untuk teks, angka, dan daftar tetap.
     * Mengubah label menu, durasi timer, atau pesan toast cukup dilakukan di sini.

      { view: 'songs-int', label: 'International Songs', icon: 'fa-earth-americas' },
      { view: 'artists', label: 'Artists', icon: 'fa-microphone-lines' },

    ]);

    const MODES = Object.freeze({

      lyric: { key: 'lyric', label: 'Playlist Music Lyric Video', short: 'Videos', icon: 'fa-play', subtitle: 'Video musik berlirik', title: 'PlayList Music · Lyric Video' },
    });
    const DEFAULT_MODE = 'music';

    /** Dua kategori di dalam setiap versi. Kategori hanya menyaring tampilan, bukan memisahkan koleksi. */
    const CATEGORIES = Object.freeze({
      id: { key: 'id', label: 'Indonesian Songs', icon: 'fa-flag' },
      int: { key: 'int', label: 'International Songs', icon: 'fa-earth-americas' },
    });
    const DEFAULT_CATEGORY = 'id';

    /** Jumlah lagu per section di halaman Home. */
    const HOME_RECOMMENDED_COUNT = 9;
    const HOME_RECENT_COUNT = 11;

    /** Jumlah item per halaman pada daftar Songs, Artists, dan Albums (pagination angka). */
    const PAGE_SIZE = 100;

    /** Halaman detail/pencarian dipetakan ke menu utama yang harus tampil aktif. */
    const SECTION_OF_VIEW = Object.freeze({
      artist: 'artists',
      album: 'albums',
      genre: 'genres',
      playlist: 'playlists',
      search: 'search',
    });

    const TIMING = Object.freeze({
      TOAST_MS: 2600,
      PLAY_NUDGE_MS: 1500,
      PLAY_WARNING_MS: 4000,

    });

    const MESSAGES = Object.freeze({
      NO_SOURCE: 'Sumber audio/video lagu ini belum diisi',
      NOT_STARTED: 'Lagu belum mulai, tekan tombol play sekali lagi',
      NO_PLAYER: 'Pemutar gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.',
      YT_ERROR: 'Video YouTube lagu ini tidak bisa diputar (dibatasi pemilik video, dihapus, atau web dibuka dari file lokal).',
      NOTHING_PLAYABLE: 'Tidak ada lagu yang bisa diputar',
      NO_RESULTS: 'Tidak ada lagu yang cocok.',
      NO_ARTISTS: 'Tidak ada artis dengan huruf ini.',
      NO_PLAYLISTS: 'Belum ada playlist.',
      NO_SONGS: 'Belum ada lagu di kategori ini.',
      NO_RECENT: 'Belum ada lagu yang diputar. Putar lagu mana pun, nanti muncul di sini.',
      NO_FAVORITES: 'Belum ada lagu favorit. Putar lagu, lalu tekan ikon love di bar pemutar untuk menambahkannya ke sini.',
    });

    const DEFAULT_VOLUME = 1;

    /** Huruf untuk pagination A-Z; item non-latin dikelompokkan ke "#" (lihat letterOf). */
    const ALPHABET = Object.freeze('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
    const LETTER_PAGES = Object.freeze([...ALPHABET, '#']);

    /* ---- config/events.js ---- */
    /** Nama event yang dipakai EventBus. Dipusatkan agar tidak ada string "ajaib" tersebar. */
    const Events = Object.freeze({
      ROUTE_CHANGE: 'route:change',
      MODE_CHANGE: 'mode:change',
      CATEGORY_CHANGE: 'category:change',
      PLAYER_RESET: 'player:reset',
      FAVORITES_CHANGE: 'favorites:change',
      PLAYER_STATE: 'player:state',
      PLAYER_TRACK: 'player:track',
      PLAYER_PROGRESS: 'player:progress',
      PLAYER_DURATION: 'player:duration',
      TOAST: 'toast:show',
    });

    /* ################ UTILS        ################ */

    /* ---- utils/array.js ---- */
    /** Helper struktur data & algoritma generik (tidak tahu apa pun tentang domain musik). */

    /** Perbandingan teks bahasa Indonesia, tidak peka huruf besar/kecil, angka dibaca sebagai angka. */
    const TEXT_COLLATOR = new Intl.Collator('id', { sensitivity: 'base', numeric: true });
    const compareText = (a, b) => TEXT_COLLATOR.compare(String(a), String(b));

    /**
     * Fisher-Yates shuffle, O(n), menghasilkan salinan baru (array asli tidak berubah).
     * Distribusi acak seragam, tidak seperti `sort(() => Math.random() - .5)`.
     */
    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Membangun Map key -> item untuk pencarian O(1). */
    function indexBy(items, keyOf) {
      const index = new Map();
      for (const item of items) index.set(keyOf(item), item);
      return index;
    }

    /** Mengelompokkan item per key dalam satu kali lintasan O(n); urutan asli tiap grup dipertahankan. */
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    /* ---- utils/dom.js ---- */
    /** Helper kecil untuk DOM dan keamanan teks. */

    const byId = (id) => document.getElementById(id);

    const HTML_ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

    /** Meloloskan teks dinamis sebelum disisipkan ke template HTML. */
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => HTML_ENTITIES[c]);

    /** Menghapus karakter berbahaya dari input pengguna (dipakai pada judul hasil pencarian). */
    const stripHtmlChars = (value) => String(value).replace(/[<>&]/g, '');

    /** Mengisi bagian "terisi" dari input[type=range] lewat CSS variable --p. */
    const paintRange = (input, percent) => input.style.setProperty('--p', `${percent}%`);

    const e = escapeHtml; /* alias singkat untuk template HTML */

    /* ---- utils/format.js ---- */
    /** Fungsi murni untuk memformat angka menjadi teks tampilan. */

    /** 125 -> "2:05". Nilai tidak valid menghasilkan "0:00". */
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const rest = String(Math.floor(seconds % 60)).padStart(2, '0');
      return `${minutes}:${rest}`;
    }

    /** Huruf pertama nama untuk filter A-Z; selain huruf latin dikelompokkan ke "#". */
    function letterOf(name) {
      const first = String(name).trim().charAt(0).toUpperCase();
      return /[A-Z]/.test(first) ? first : '#';
    }

    /** Gambar tanpa sumber valid (kosong / string "undefined") diganti placeholder abu-abu bertema musik. */
    /** Glyph di tengah cover: not musik untuk versi Songs, segitiga play untuk versi Videos (thumbnail video). */
    const GLYPHS = {
      music: (fill, opacity) =>
        `<path d="M230 110v140a45 45 0 1 1-20-37V150l-70 18v110a45 45 0 1 1-20-37V135z" fill="${fill}" fill-opacity="${opacity}"/>`,
      lyric: (fill, opacity) =>
        `<path d="M165 135L165 265L280 200Z" fill="${fill}" fill-opacity="${opacity}" stroke="${fill}" stroke-opacity="${opacity}" stroke-width="16" stroke-linejoin="round"/>`,
    };
    /** Versi yang glyph-nya dipakai; diatur App saat membangun katalog dan saat pindah versi. */
    let placeholderMode = DEFAULT_MODE;

    const PLACEHOLDER_CACHE = new Map();
    const placeholderSvg = (background, fill, opacity) => {
      const key = `${placeholderMode}|${background}|${fill}|${opacity}`;
      let uri = PLACEHOLDER_CACHE.get(key);
      if (uri === undefined) {
        uri = 'data:image/svg+xml,' + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${background}"/>` +
          `${GLYPHS[placeholderMode](fill, opacity)}</svg>`);
        PLACEHOLDER_CACHE.set(key, uri);
      }
      return uri;
    };

    /** Gambar abu-abu polos (artis, playlist, pemutar kosong). */
    const placeholderImg = () => placeholderSvg('#333', '#777', 1);

    /** Warna cover album diambil dari data JSON (COLORS), dirujuk lewat colorId album. */
    const colorHex = (colorId) => COLORS.find((c) => c.id === colorId)?.hex;

    /** Placeholder berwarna (warna ditentukan oleh `colorId` album dari data JSON, jadi album yang sama selalu berwarna sama). */
    const colorfulPlaceholder = (colorId) => placeholderSvg(colorHex(colorId) ?? '#333333', '#ffffff', .85);

    const safeImg = (src, seed = null) => (!src || src === 'undefined' || src === 'null')
      ? (seed === null ? placeholderImg() : colorfulPlaceholder(seed))
      : src;

    /** Durasi lagu untuk tampilan; belum diketahui (0) tampil "--:--", bukan "0:00". */
    const formatDuration = (seconds) => (seconds > 0 ? formatTime(seconds) : '--:--');

    /** Durasi video untuk daftar Up next: selalu mm:ss (03:45), atau j:mm:ss (1:02:15) bila lebih dari satu jam; belum diketahui = "--:--". */
    const formatClock = (seconds) => {
      if (!(seconds > 0)) return '--:--';
      const total = Math.floor(seconds);
      const h = Math.floor(total / 3600);
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
    };

    /** Ringkasan koleksi lagu, mis. "3 lagu · 10 mnt 05 dtk". */
    function formatTotal(songs) {
      const total = songs.reduce((sum, song) => sum + song.duration, 0);
      return `${songs.length} lagu · ${formatTime(total).replace(':', ' mnt ')} dtk`;
    }

    /* ---- models/Song.js ---- */
    /** Menerima ID video YouTube polos, atau URL (watch / youtu.be / embed / shorts); hasilnya selalu ID 11 karakter atau null. */
    function youTubeIdFrom(value) {
      if (!value) return null;
      const text = String(value).trim();
      if (/^[\w-]{11}$/.test(text)) return text;
      const match = text.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|shorts\/|live\/|watch\?(?:.*&)?v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    class Song {
      constructor({ id, name, albumId, genreId, dur, sc = null, yt = null }) {
        this.id = id;
        this.name = name;
        this.albumId = albumId;
        this.genreId = genreId;
        /** Durasi dalam detik; diperbarui dengan durasi asli dari SoundCloud saat lagu diputar. */
        this.duration = dur;
        /** ID track/playlist SoundCloud (lagu versi Playlist Music). null = bukan lagu SoundCloud. */
        this.soundCloudId = sc;
        /** ID video YouTube (lagu versi Lyric Video). */
        this.youTubeId = youTubeIdFrom(yt);
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.album = null;
        this.genre = null;
        this.searchText = '';
      }

      get artist() {
        return this.album.artist;
      }

      get artistId() {
        return this.album.artistId;
      }

      /** Kategori lagu = kategori artisnya. */
      get cat() {
        return this.album.cat;
      }

      /** Thumbnail 16:9 video YouTube (null untuk lagu SoundCloud). */
      get thumb() {
        return this.youTubeId ? `https://i.ytimg.com/vi/${this.youTubeId}/mqdefault.jpg` : null;
      }

      get cover() {
        return this.thumb ?? this.album.img;
      }

      get isPlayable() {
        return Boolean(this.soundCloudId || this.youTubeId);
      }

      /** Kunci cache durasi: ID SoundCloud, atau "yt:<id>" untuk lagu YouTube. */
      get cacheKey() {
        return this.soundCloudId || (this.youTubeId ? `yt:${this.youTubeId}` : null);
      }

      /** Menyiapkan teks pencarian sekali saja, setelah relasi tersedia. */
      buildSearchText() {
        this.searchText = `${this.name} ${this.artist.name} ${this.album.name}`.toLowerCase();
      }

      matches(query) {
        return this.searchText.includes(query);
      }
    }

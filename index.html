<!DOCTYPE html>
<html lang="id" data-mode="music">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlayList Music</title>

  <!-- Font & ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="dns-prefetch" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Token warna (tema terang/gelap): ada di CSS biasa agar tersedia sebelum Tailwind selesai memproses -->
  <style>
    :root{color-scheme:light dark;--bg:#fff;--surface:#f5f5f7;--surface-2:#e8e8ed;--text:#1d1d1f;--muted:#6e6e73;--sep:#0000001a;--glass:rgba(255,255,255,.8);
      --music:#fa2d48;--lyric:#0a7aff;--accent:var(--music);--on-accent:#fff;
      --tab-h:60px;--mini-h:68px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
      --dock:calc(var(--tab-h) + var(--safe-b) + var(--mini-h) + 20px);--side-w:248px;--top-h:76px}
    @media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f5f5f7;--muted:#98989f;--sep:#ffffff1f;--glass:rgba(28,28,30,.8)}}
    :root[data-mode=lyric]{--accent:var(--lyric)}
    html,body{height:100%;margin:0;background:var(--bg)}
  </style>
  <!-- Tailwind CSS v4 (CDN resmi) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">

/* ============================================================
   DESIGN SYSTEM
   Skala: spacing kelipatan 4px · radius 8 / 12 / 16 / pil
          tinggi kontrol 36 / 40 / 44 · ikon 16 / 20 / 24
          bayangan: card (halus) dan float (melayang)
   ============================================================ */
@theme inline {
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-fg: var(--text);
  --color-muted: var(--muted);
  --color-sep: var(--sep);
  --color-accent: var(--accent);
  --color-glass: var(--glass);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgb(0 0 0 / .08), 0 6px 16px -8px rgb(0 0 0 / .28);
  --shadow-float: 0 10px 32px -6px rgb(0 0 0 / .28);
  --ease-out-soft: cubic-bezier(.2, .8, .2, 1);
}

/* ---------------- Dasar ---------------- */
@layer base {
  html, body { height: 100%; }
  body { @apply bg-bg text-fg font-sans text-[15px] leading-snug overflow-hidden antialiased; }
  button, [data-go], [data-play], [data-sub], [data-az] { cursor: pointer; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  * { scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
}

@layer components {
  .nosrc { opacity: .4; }

  /* ---------------- Kerangka ---------------- */
  .app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); opacity: 0; transition: opacity .2s ease; }
  .tw-ready .app { opacity: 1; }
  .side { display: none; }
  .main { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 4px 16px calc(var(--dock) + 16px); scroll-behavior: auto; }

  /* ---------------- Navbar ---------------- */
  .nav { display: flex; align-items: center; gap: 12px; padding: calc(var(--safe-t) + 10px) 16px 8px; border-bottom: 1px solid var(--sep); }
  .nav-left { display: flex; }
  .nav-right { display: none; }
  .logo { display: block; border-radius: 12px; transition: transform .15s var(--ease-out-soft); }
  .logo:active { transform: scale(.92); }
  .logo-icon { @apply grid size-10 place-items-center rounded-xl bg-accent text-white text-base; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 38%, transparent); transition: background-color .25s ease, box-shadow .25s ease; }
  .logo-icon.spin { animation: spin .45s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .search { @apply flex flex-1 items-center gap-2 h-10 px-3.5 rounded-xl bg-surface text-muted; transition: box-shadow .15s ease, background-color .15s ease; }
  .search:focus-within { box-shadow: 0 0 0 2px var(--accent); background: var(--bg); }
  .search input { @apply min-w-0 flex-1 bg-transparent text-fg text-base outline-none placeholder:text-muted; font: inherit; font-size: 16px; }

  /* ---------------- Tab bar bawah (ponsel) ---------------- */
  .tabs { @apply fixed inset-x-0 bottom-0 z-80 flex overflow-hidden border-t border-sep bg-glass; height: calc(var(--tab-h) + var(--safe-b)); padding: 6px 0 var(--safe-b); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  .tabs .nav-item { @apply flex min-w-0 flex-1 flex-col items-center gap-0.5 px-1 text-muted text-[11px] font-medium leading-tight text-center; transition: color .2s ease; }
  .tabs .nav-item i { @apply grid h-7 w-14 place-items-center rounded-full text-[18px]; transition: background-color .2s ease, transform .2s var(--ease-out-soft); }
  .tabs .nav-item:active i { transform: scale(.9); }
  .tabs .nav-item span { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .tabs .nav-item.active { @apply text-accent font-semibold; }
  .tabs .nav-item.active i { background: color-mix(in srgb, var(--accent) 14%, transparent); }

  /* ---------------- Judul & bagian ---------------- */
  .sub, .section h2 { @apply text-[22px] font-bold leading-tight tracking-tight; margin: 20px 0 12px; }
  .section { margin-bottom: 12px; }
  .back { @apply inline-flex h-9 items-center gap-2 rounded-full bg-surface px-3.5 text-sm font-semibold text-accent; margin: 8px 0; transition: background-color .15s ease, transform .15s ease; }
  .back:active { transform: scale(.96); }
  @media (hover: hover) { .back:hover { background: var(--surface-2); } }
  .theater-back { @apply absolute top-2 left-2 z-4 size-9 justify-center rounded-full bg-black/60 p-0 text-white text-[0px]; margin: 0; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .theater-back i { font-size: 15px; }
  .theater.watching .theater-back { display: none; }

  /* ---------------- Chip filter, indeks A-Z ---------------- */
  :root { --nav-h: 58px; --nav-bar-h: calc(var(--safe-t) + 59px); }
  .subbar { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 4px 16px 12px; background: var(--bg); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { @apply h-9 flex-none rounded-full bg-surface px-4 text-sm font-semibold text-fg; transition: background-color .2s ease, color .2s ease, transform .15s var(--ease-out-soft); }
  .chip:active { transform: scale(.95); }
  .chip.active { @apply bg-accent; color: var(--on-accent); }
  @media (hover: hover) { .chip:not(.active):hover { background: var(--surface-2); } }
  .more { height: 48px; }
  .az { position: fixed; right: 2px; top: calc(var(--safe-t) + 150px); bottom: calc(var(--dock) + 10px); z-index: 60; width: 22px; display: flex; flex-direction: column; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 10px; font-weight: 700; line-height: 1; color: var(--accent); }
  .az span { flex: 1 1 0; min-height: 0; width: 100%; display: grid; place-items: center; border-radius: 8px; transition: background-color .12s ease; }
  .az span.off { opacity: .28; }
  .az span.on { background: var(--accent); color: var(--on-accent); }
  .main.has-az { padding-right: 34px; }

  /* Songs/Library di ponsel: navbar ikut tergulir, chip menempel di atas */
  .app.nav-in-main { grid-template-rows: minmax(0, 1fr); }
  .app.nav-in-main .main { padding-top: 0; }
  .main > .nav { margin: 0 -16px 4px; }
  .main.has-az > .nav { margin-right: -34px; }
  .app.nav-in-main::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-t); z-index: 6; }
  .app.nav-in-main .subbar { top: var(--safe-t); display: flex; align-items: center; height: var(--nav-h); padding-top: 0; padding-bottom: 0; margin-bottom: 14px; background: transparent; }
  .app.nav-in-main .subbar > * { flex: 1; min-width: 0; }
  .app.nav-in-main .main.has-az .subbar { margin-right: -34px; padding-right: 34px; }
  .app.nav-in-main h2.sub:has(+ .subbar) { margin-bottom: 4px; }
  .app.nav-in-main.bar-stuck .subbar, .app.nav-in-main.bar-stuck::before { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  .app.nav-in-main.bar-stuck .subbar { box-shadow: 0 1px 0 var(--sep); }

  /* ---------------- Kartu cover ---------------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; }
  .card { min-width: 0; cursor: pointer; }
  .cover { @apply relative aspect-square overflow-hidden rounded-xl bg-surface shadow-card; }
  .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--ease-out-soft); }
  @media (hover: hover) { .card:hover .cover img { transform: scale(1.04); } }
  .card:active .cover { transform: scale(.98); }
  .cover { transition: transform .15s var(--ease-out-soft); }
  .card.round .cover { border-radius: 50%; }
  .card.round { text-align: center; }
  .avatar { position: relative; isolation: isolate; display: grid; place-items: center; width: 100%; height: 100%; aspect-ratio: 1; overflow: hidden; color: #fff; font-weight: 700; letter-spacing: .02em; line-height: 1; user-select: none; background: linear-gradient(145deg, var(--a1), var(--a2)); }
  .avatar > span { font-size: clamp(28px, 11vw, 56px); }
  .cover .avatar { container-type: inline-size; }
  .cover .avatar > span { font-size: 38cqw; }
  .hero > .avatar { width: min(64vw, 260px); height: auto; border-radius: 16px; box-shadow: var(--shadow-float); }
  .hero > .avatar > span { font-size: clamp(56px, 20vw, 96px); }
  .hero.round > .avatar { border-radius: 50%; }
  .card-title, .card-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-title { @apply mt-2.5 text-sm font-semibold leading-snug; }
  .card-desc { @apply text-[13px] text-muted; }
  .card.playing .card-title { color: var(--accent); }
  .card-play { @apply absolute right-2 bottom-2 grid size-9 place-items-center rounded-full bg-white/95 text-accent text-[13px]; box-shadow: 0 2px 8px rgb(0 0 0 / .3); opacity: 0; transform: scale(.9); transition: opacity .18s ease, transform .18s var(--ease-out-soft); }
  .card.playing .card-play, .card-play:focus-visible { opacity: 1; transform: none; }
  @media (hover: none) { .card-play { opacity: 1; transform: none; } }
  @media (hover: hover) { .card:hover .card-play { opacity: 1; transform: none; } .card-play:hover { transform: scale(1.08) !important; } }

  /* Kartu genre: warna solid + sedikit kilau, tanpa gradasi berat */
  .gtile { @apply relative isolate flex cursor-pointer flex-col justify-end overflow-hidden rounded-xl p-4 text-lg font-bold leading-tight text-white; aspect-ratio: 16/10; background: linear-gradient(160deg, color-mix(in srgb, var(--g) 88%, #fff), color-mix(in srgb, var(--g) 78%, #000)); box-shadow: 0 2px 8px color-mix(in srgb, var(--g) 32%, transparent); transition: transform .18s var(--ease-out-soft), box-shadow .18s ease; }
  .gtile small { display: block; font-size: 12px; font-weight: 500; opacity: .9; }
  .gtile-txt { max-width: calc(100% - 44px); }
  .gtile-ico { @apply pointer-events-none absolute top-3 right-3 grid size-11 place-items-center text-[30px] leading-none text-white/90; transition: transform .25s var(--ease-out-soft); }
  @media (hover: hover) {
    .gtile:hover { transform: translateY(-2px); box-shadow: 0 10px 20px color-mix(in srgb, var(--g) 42%, transparent); }
    .gtile:hover .gtile-ico { transform: scale(1.08) rotate(-6deg); }
  }
  .gtile:active { transform: scale(.98); }

  /* ---------------- Hero detail ---------------- */
  .hero { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 8px 0 24px; text-align: center; }
  .hero > img, .hero > .gen { width: min(64vw, 260px); aspect-ratio: 1; border-radius: 16px; object-fit: cover; box-shadow: var(--shadow-float); }
  .hero.round > img { border-radius: 50%; }
  .gen { display: grid; place-items: center; color: #fff; font-size: 64px; }
  .gen-genre { position: relative; overflow: hidden; font-size: clamp(64px, 22vw, 96px); background: linear-gradient(160deg, color-mix(in srgb, var(--g) 88%, #fff), color-mix(in srgb, var(--g) 76%, #000)); }
  .gen-genre i { line-height: 1; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .2)); }
  .hero small { @apply text-xs font-semibold uppercase tracking-wider text-muted; }
  .hero h1 { @apply font-extrabold leading-tight tracking-tight; font-size: clamp(26px, 6vw, 44px); overflow-wrap: anywhere; }
  .hero p { @apply mt-1.5 text-muted; }
  .hero a { color: var(--accent) !important; font-weight: 600 !important; text-decoration: none; }
  @media (hover: hover) { .hero a:hover { text-decoration: underline; } }

  /* ---------------- Daftar lagu ---------------- */
  .row { display: grid; grid-template-columns: 0 minmax(0, 1fr) auto auto; align-items: center; min-height: 64px; cursor: pointer; background: linear-gradient(var(--sep), var(--sep)) bottom right / calc(100% - 60px) 1px no-repeat; transition: background-color .15s ease; }
  .row:not(.head):active { background-color: var(--surface); }
  .row.playing { grid-template-columns: 24px minmax(0, 1fr) auto auto; }
  .row.head, .c-al { display: none; }
  .row .n { grid-column: 1; overflow: hidden; color: var(--accent); font-size: 13px; }
  .row .n b { display: none; }
  .row .n i { display: block; }
  .row .t { grid-column: 2; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 0; }
  .row .t img { @apply size-12 flex-none rounded-lg bg-surface-2 object-cover; }
  .row .t > span { min-width: 0; }
  .row .t em, .row .t small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t em { font-style: normal; font-size: 15px; font-weight: 600; }
  .row .t small { font-size: 13px; color: var(--muted); }
  .row.playing .t em { color: var(--accent); }
  .row .c-t { grid-column: 3; padding: 0 4px 0 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fav-btn { @apply grid size-10 place-items-center rounded-full text-muted; transition: color .15s ease, transform .15s var(--ease-out-soft), background-color .15s ease; }
  .fav-btn.on { color: var(--accent); }
  .fav-btn:active { transform: scale(.85); }
  .fav-btn:disabled { opacity: .4; pointer-events: none; }
  @media (hover: hover) { .fav-btn:hover { background: var(--surface); } }

  /* ---------------- Video ---------------- */
  .vgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px 16px; }
  .vcard { position: relative; min-width: 0; cursor: pointer; }
  .vthumb { @apply relative aspect-video overflow-hidden rounded-xl bg-surface-2 shadow-card; transition: transform .15s var(--ease-out-soft); }
  .vcard:active .vthumb { transform: scale(.985); }
  .vthumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--ease-out-soft); }
  @media (hover: hover) { .vcard:hover .vthumb img { transform: scale(1.03); } }
  .vdur { @apply absolute right-2 bottom-2 rounded-md bg-black/75 px-1.5 py-px text-xs font-semibold tabular-nums text-white; }
  .vplay { @apply absolute top-1/2 left-1/2 grid size-13 -translate-1/2 place-items-center rounded-full bg-white/95 text-accent text-lg; margin: 0; box-shadow: 0 4px 16px rgb(0 0 0 / .35); opacity: 0; scale: .9; transition: opacity .18s ease, scale .18s var(--ease-out-soft); }
  .vcard.playing .vplay { opacity: 1; scale: 1; }
  @media (hover: hover) { .vcard:hover .vplay { opacity: 1; scale: 1; } }
  .vmeta { padding: 10px 2px 0; }
  .vtitle, .vsub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtitle { font-size: 15px; font-weight: 600; }
  .vsub { font-size: 13px; color: var(--muted); }
  .vcard.playing .vtitle { color: var(--accent); }
  .vfav { @apply absolute top-2 right-2 size-9 bg-black/50 text-white; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .vfav.on { color: #fff; }
  @media (hover: hover) { .vfav:hover { background: rgb(0 0 0 / .7); } }

  /* ---------------- Halaman tontonan (theater) ---------------- */
  .theater { display: none; }
  .theater.show:not(.watching) { display: block; }
  .theater.watching { position: fixed; inset: var(--nav-bar-h) 0 calc(var(--tab-h) + var(--safe-b)) 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px; padding: 0 0 calc(var(--mini-h) + 28px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); }
  .theater-main { position: relative; min-width: 0; }
  .theater-stage { position: relative; width: 100%; aspect-ratio: 16/9; margin: 0; padding: 0; background: #000; }
  .theater-frame { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: #000; }
  .theater-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
  .theater.watching:not(.mini) .theater-frame { border-radius: 0; }
  .theater.mini .theater-frame, .theater:not(.watching) .theater-frame { position: fixed; inset: auto 12px calc(var(--tab-h) + var(--safe-b) + var(--mini-h) + 20px) auto; z-index: 60; width: 200px; aspect-ratio: 16/9; box-shadow: var(--shadow-float); animation: pop-in .25s var(--ease-out-soft); }
  @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  .theater:not(.watching) .theater-stage { height: 0; aspect-ratio: auto; background: none; }
  .theater:not(.watching) :is(.theater-back, .theater-info, .theater-next, .theater-poster) { display: none; }
  .mini-btn { @apply absolute top-1.5 z-3 hidden size-7 place-items-center rounded-full bg-black/60 text-xs text-white; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background-color .15s ease; }
  .mini-btn:hover { background: rgb(0 0 0 / .8); }
  .mini-btn.open { left: 6px; }
  .mini-btn.close { right: 6px; }
  .theater.mini .mini-btn, .theater:not(.watching) .mini-btn { display: grid; }
  .theater-poster { display: none; position: absolute; inset: 0; z-index: 2; overflow: hidden; background: #000; }
  .theater.poster .theater-poster { display: block; }
  .theater-poster img { width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  .theater-poster .vplay { opacity: 1; scale: 1; width: 64px; height: 64px; font-size: 22px; }
  .theater-info { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 16px 16px 0; }
  .theater-cover { display: block; flex: none; width: clamp(44px, 12vw, 56px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--surface-2); }
  .theater-cover[hidden] { display: none; }
  .theater-cover img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .theater-cover .avatar { container-type: inline-size; border-radius: 50%; }
  .theater-cover .avatar > span { font-size: 38cqw; }
  .theater-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .theater-title, .theater-artist, .theater-meta { display: block; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theater-title { order: 1; font-size: 19px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
  .theater-artist { order: 2; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--accent); }
  .theater-meta { order: 3; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .theater-artist:empty, .theater-meta:empty, .theater-dur:empty { display: none; }
  .theater-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .theater-dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .theater-actions { display: flex; gap: 2px; }
  .th-act { @apply grid size-10 place-items-center rounded-full text-base text-muted; transition: color .15s ease, background-color .15s ease, transform .15s var(--ease-out-soft); }
  .th-act:active { transform: scale(.88); }
  @media (hover: hover) { .th-act:hover { background: var(--surface); color: var(--text); } }
  .th-act.fav.on { color: var(--accent); }
  .th-act:disabled { opacity: .4; }
  .theater-next { min-width: 0; padding: 0; }
  .next-list { display: flex; flex-direction: column; }
  .next-item { position: relative; display: flex; align-items: center; padding: 8px 16px 8px 0; transition: background-color .15s ease; cursor: pointer; }
  @media (hover: hover) { .next-item:not(.dragging):hover { background: var(--surface); } }
  .next-drag { flex: none; width: 20px; align-self: stretch; display: flex; align-items: center; justify-content: center; margin-right: 4px; color: var(--muted); touch-action: none; cursor: grab; }
  .next-drag-lines { display: block; flex: none; width: 12px; height: 10px; overflow: visible; pointer-events: none; }
  .next-drag-lines line { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  .next-thumb-box { position: relative; flex: none; margin-right: 12px; width: 120px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .next-thumb { width: 100%; height: 100%; object-fit: cover; }

  <script>
    /* UI saja: ketuk mini player (ponsel) membuka sheet Now Playing; Esc atau layar melebar menutupnya. */
    (() => {
      const mq = matchMedia('(max-width: 899px)');
      const player = document.getElementById('player');
      const close = () => player.classList.remove('open');
      player.addEventListener('click', (ev) => {
        if (!mq.matches) return;
        if (player.classList.contains('open')) {
          if (ev.target === player && ev.clientY - player.getBoundingClientRect().top < 90) close();
          return;
        }
        if (!ev.target.closest('button, input, a') && ev.target.closest('.now')) player.classList.add('open');

      document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });

    /* ---- utils/array.js ---- */
    /** Helper struktur data & algoritma generik (tidak tahu apa pun tentang domain musik). */

    /** Perbandingan teks bahasa Indonesia, tidak peka huruf besar/kecil, angka dibaca sebagai angka. */
    const TEXT_COLLATOR = new Intl.Collator('id', { sensitivity: 'base', numeric: true });
    const compareText = (a, b) => TEXT_COLLATOR.compare(String(a), String(b));

    /**
     * Fisher-Yates shuffle, O(n), menghasilkan salinan baru (array asli tidak berubah).
     * Distribusi acak seragam, tidak seperti `sort(() => Math.random() - .5)`.
     */
    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Membangun Map key -> item untuk pencarian O(1). */
    function indexBy(items, keyOf) {
      const index = new Map();
      for (const item of items) index.set(keyOf(item), item);
      return index;
    }

    /** Mengelompokkan item per key dalam satu kali lintasan O(n); urutan asli tiap grup dipertahankan. */
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    /** Meloloskan teks dinamis sebelum disisipkan ke template HTML. */
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => HTML_ENTITIES[c]);

    /** Menghapus karakter berbahaya dari input pengguna (dipakai pada judul hasil pencarian). */
    const stripHtmlChars = (value) => String(value).replace(/[<>&]/g, '');

    /** Mengisi bagian "terisi" dari input[type=range] lewat CSS variable --p. */
    const paintRange = (input, percent) => input.style.setProperty('--p', `${percent}%`);

    /* ---- utils/format.js ---- */
    /** Fungsi murni untuk memformat angka menjadi teks tampilan. */

    /** 125 -> "2:05". Nilai tidak valid menghasilkan "0:00". */
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const rest = String(Math.floor(seconds % 60)).padStart(2, '0');
      return `${minutes}:${rest}`;
    }

    /** Huruf pertama nama untuk filter A-Z; selain huruf latin dikelompokkan ke "#". */
    function letterOf(name) {
      const first = String(name).trim().charAt(0).toUpperCase();
      return /[A-Z]/.test(first) ? first : '#';
    }

    /** Gambar tanpa sumber valid (kosong / string "undefined") diganti placeholder abu-abu bertema musik. */
    /** Glyph di tengah cover: not musik untuk versi Songs, segitiga play untuk versi Videos (thumbnail video). */
    const GLYPHS = {
      music: (fill, opacity) =>
        `<path d="M230 110v140a45 45 0 1 1-20-37V150l-70 18v110a45 45 0 1 1-20-37V135z" fill="${fill}" fill-opacity="${opacity}"/>`,
      lyric: (fill, opacity) =>
        `<path d="M165 135L165 265L280 200Z" fill="${fill}" fill-opacity="${opacity}" stroke="${fill}" stroke-opacity="${opacity}" stroke-width="16" stroke-linejoin="round"/>`,
    };
    /** Versi yang glyph-nya dipakai; diatur App saat membangun katalog dan saat pindah versi. */
    let placeholderMode = DEFAULT_MODE;

    const PLACEHOLDER_CACHE = new Map();
    const placeholderSvg = (background, fill, opacity) => {
      const key = `${placeholderMode}|${background}|${fill}|${opacity}`;
      let uri = PLACEHOLDER_CACHE.get(key);
      if (uri === undefined) {
        uri = 'data:image/svg+xml,' + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${background}"/>` +
          `${GLYPHS[placeholderMode](fill, opacity)}</svg>`);
        PLACEHOLDER_CACHE.set(key, uri);
      }
      return uri;
    };

    /** Gambar abu-abu polos (artis, pemutar kosong). */
    const placeholderImg = () => placeholderSvg('#333', '#777', 1);

    /** Warna cover album diambil dari data JSON (COLORS), dirujuk lewat colorId album. */
    const colorHex = (colorId) => COLORS.find((c) => c.id === colorId)?.hex;

    /** Placeholder berwarna (warna ditentukan oleh `colorId` album dari data JSON, jadi album yang sama selalu berwarna sama). */
    const colorfulPlaceholder = (colorId) => placeholderSvg(colorHex(colorId) ?? '#333333', '#ffffff', .85);

    const safeImg = (src, seed = null) => (!src || src === 'undefined' || src === 'null')
      ? (seed === null ? placeholderImg() : colorfulPlaceholder(seed))
      : src;

    /** Durasi lagu untuk tampilan; belum diketahui (0) tampil "--:--", bukan "0:00". */
    const formatDuration = (seconds) => (seconds > 0 ? formatTime(seconds) : '--:--');

    /** Durasi video untuk daftar Up next: selalu mm:ss (03:45), atau j:mm:ss (1:02:15) bila lebih dari satu jam; belum diketahui = "--:--". */
    const formatClock = (seconds) => {
      if (!(seconds > 0)) return '--:--';
      const total = Math.floor(seconds);
      const h = Math.floor(total / 3600);
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
    };

    /** Ringkasan koleksi lagu, mis. "3 lagu · 10 mnt 05 dtk". */
    function formatTotal(songs) {
      const total = songs.reduce((sum, song) => sum + song.duration, 0);
      return `${songs.length} lagu · ${formatTime(total).replace(':', ' mnt ')} dtk`;
    }

<!DOCTYPE html>
<html lang="id" data-mode="local">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlayList Music</title>

  <!-- Font & ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Design tokens, reset, dan gaya global */

    :root {
      --bg: #000;
      --panel: #121212;
      --card: #181818;
      --card-h: #262626;
      --chip: #1f1f1f;
      --text: #fff;
      --muted: #b3b3b3;
      /* Identitas warna: LOCAL = ungu, PRO = hijau Spotify. Seluruh aksen memakai --accent. */
      --local: #7C3AED;
      --local-h: #9061F9;
      --pro: #1DB954;
      --pro-h: #1ED760;
      --accent: var(--local);
      --accent-h: var(--local-h);
      --on-accent: #fff;
      --gap: 8px;
      --nav-h: 64px;
      --player-h: 84px;
      --side-w: 300px;
      --r: 10px;
    }

    :root[data-mode="pro"] {
      --accent: var(--pro);
      --accent-h: var(--pro-h);
      --on-accent: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Montserrat", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Layout grid aplikasi (app shell) */

    .app {
      height: 100dvh;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
      grid-template-areas: "nav nav" "side main" "player player";
    }

    .nav {
      grid-area: nav;
    }

    .side {
      grid-area: side;
    }

    .main {
      grid-area: main;
    }

    .player-bar {
      grid-area: player;
    }

    /* Komponen Navbar: logo + pencarian */

    .nav {
      display: grid;
      grid-template-columns: 1fr minmax(0, 1.2fr) 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 8px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: .2s;
    }

    .logo-icon i {
      margin-left: 2px;
    }

    .logo:hover .logo-icon {
      background: var(--accent-h);
      transform: scale(1.06);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--chip);
      border: 2px solid transparent;
      color: var(--muted);
      transition: .2s;
    }

    .search:hover {
      background: #2a2a2a;
    }

    .search:focus-within {
      border-color: #fff;
      color: #fff;
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: #fff;
      font: 500 .95rem "Montserrat", sans-serif;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 12px;
      font-weight: 600;
      font-size: .9rem;
      color: var(--muted);
      white-space: nowrap;
      transition: .15s;
    }

    .nav-link:hover {
      color: #fff;
      transform: scale(1.04);
    }

    .divider {
      width: 1px;
      height: 28px;
      background: #555;
      margin: 0 12px;
    }

    /* Komponen Sidebar */

    .side {
      background: var(--panel);
      border-radius: var(--r);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px 20px;
      font-weight: 700;
      color: var(--muted);
    }

    .side-head .add {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .side-head .add:hover {
      background: #2a2a2a;
      color: #fff;
    }

    .side-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .promo {
      background: var(--chip);
      border-radius: var(--r);
      padding: 20px;
    }

    .promo h4 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .promo p {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .promo button {
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: .85rem;
      padding: 8px 18px;
      border-radius: 999px;
      transition: .2s;
    }

    .promo button:hover {
      transform: scale(1.04);
    }

    /* Item navigasi (sidebar & tabs mobile) */

    .side-nav {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 700;
      font-size: .95rem;
      text-align: left;
      transition: .15s;
    }

    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .nav-item:hover {
      color: #fff;
    }

    .nav-item.active {
      color: #fff;
      background: #2a2a2a;
    }


    .tabs {
      display: none;
      gap: 9px;
      overflow-x: auto;
      padding: 12px 0 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs .nav-item {
      width: auto;
      flex: none;
      padding: 8px 16px;
      gap: 8px;
      font-size: .85rem;
      background: var(--chip);
      border-radius: 999px;
    }

    .tabs .nav-item.active {
      background: #fff;
      color: #000;
    }

    /* Area konten utama: section, grid, hero, tile genre */

    .main {
      background: linear-gradient(180deg, #2a2a2a 0, var(--panel) 280px);
      border-radius: var(--r);
      overflow-y: auto;
      padding: 8px 24px 32px;
      scroll-behavior: smooth;
    }

    .main::-webkit-scrollbar,
    .side-list::-webkit-scrollbar {
      width: 10px;
    }

    .main::-webkit-scrollbar-thumb,
    .side-list::-webkit-scrollbar-thumb {
      background: #ffffff33;
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .section {
      margin-top: 24px;
    }

    .section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -.01em;
    }

    .guide {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .guide-card {
      background: var(--card);
      border-radius: 8px;
      padding: 16px 18px;
    }

    .guide-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .guide-card ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.55;
    }

    .guide-card li+li {
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .empty {
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
      display: none;
    }

    .back {
      color: var(--muted);
      font-weight: 600;
      font-size: .85rem;
      margin-top: 16px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .back:hover {
      color: #fff;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 16px 0 8px;
    }

    .hero>img,
    .hero>.gen {
      width: clamp(110px, 18vw, 200px);
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 8px 24px #00000080;
    }

    .hero.round>img {
      border-radius: 50%;
    }

    .hero .gen {
      display: grid;
      place-items: center;
      font-size: 3rem;
    }

    .hero small {
      text-transform: uppercase;
      font-size: .72rem;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 5vw, 3.4rem);
      line-height: 1.1;
      margin: 6px 0 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: .9rem;
    }

    .gtile {
      aspect-ratio: 1.6;
      border-radius: 10px;
      padding: 16px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s;
    }

    .gtile:hover {
      transform: scale(1.03);
    }

    .gtile small {
      font-size: .75rem;
      font-weight: 600;
      opacity: .85;
    }

    .sub {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .credit {
      margin-top: 40px;
      padding: 20px 0 4px;
      border-top: 1px solid #ffffff1a;
      text-align: center;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .credit-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .credit i {
      color: #e8115b;
      margin: 0 2px;
    }

    /* Komponen Card & Cover */

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
      position: relative;
      cursor: pointer;
      transition: background .25s;
      min-width: 0;
    }

    .card:hover,
    .card.playing {
      background: var(--card-h);
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #333;
      box-shadow: 0 8px 24px #00000080;
      margin-bottom: 14px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      box-shadow: 0 8px 8px #0000004d;
      opacity: 0;
      transform: translateY(8px);
      transition: .25s;
    }

    .card:hover .card-play,
    .card.playing .card-play,
    .card-play:focus-visible {
      opacity: 1;
      transform: none;
    }

    .card-play:hover {
      background: var(--accent-h);
      transform: scale(1.06);
    }

    .card-title {
      font-weight: 700;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card.playing .card-title {
      color: var(--accent);
    }

    .card-desc {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.round .cover {
      border-radius: 50%;
    }

    .card.round .card-title,
    .card.round .card-desc {
      text-align: center;
    }

    /* Komponen daftar lagu (track list) */

    .row {
      display: grid;
      grid-template-columns: 40px minmax(0, 3fr) minmax(0, 2fr) 56px;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: .88rem;
    }

    .row.head {
      border-bottom: 1px solid #ffffff1a;
      border-radius: 0;
      cursor: default;
      font-size: .72rem;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .row:not(.head):hover {
      background: #ffffff1a;
    }

    .n {
      text-align: center;
    }

    .n i {
      display: none;
      color: #fff;
    }

    .row:hover .n b,
    .row.playing .n b {
      display: none;
    }

    .row:hover .n i,
    .row.playing .n i {
      display: inline;
    }

    .t {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .t img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex: none;
      object-fit: cover;
    }

    .t>span {
      min-width: 0;
    }

    .t em {
      display: block;
      font-style: normal;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row.playing .t em {
      color: var(--accent);
    }

    .t small {
      display: block;
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-al[data-go]:hover {
      text-decoration: underline;
      color: #fff;
    }

    .c-al {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-t {
      text-align: right;
    }

    .nosrc {
      opacity: .5;
    }

    /* Komponen Player Bar */

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      background: #000;
    }

    .now {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .now img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: #333;
    }

    .now-text {
      min-width: 0;
    }

    .now-title {
      font-weight: 600;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-desc {
      font-size: .75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 640px;
      width: 100%;
      justify-self: center;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctl {
      color: var(--muted);
      font-size: 1rem;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      position: relative;
      transition: .15s;
    }

    .ctl:hover {
      color: #fff;
      transform: scale(1.08);
    }

    .ctl.active {
      color: var(--accent);
    }

    .ctl.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    #play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 1rem;
    }

    #play:hover {
      transform: scale(1.07);
    }

    .seek {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time {
      font-size: .72rem;
      color: var(--muted);
      min-width: 38px;
      font-variant-numeric: tabular-nums;
    }

    .time:first-child {
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      outline: 0;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      background: linear-gradient(to right, #fff var(--p, 0%), #4d4d4d var(--p, 0%));
    }

    input[type=range]:hover {
      background: linear-gradient(to right, var(--accent) var(--p, 0%), #4d4d4d var(--p, 0%));
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: .15s;
    }

    input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
    }

    input[type=range]:hover::-webkit-slider-thumb,
    input[type=range]:focus-visible::-webkit-slider-thumb {
      opacity: 1;
    }

    .extra {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
    }

    .extra input {
      max-width: 110px;
    }

    .sc-credit {
      font-size: .7rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    .sc-credit:hover {
      color: #ff5500;
    }

    /* Komponen Toast */

    /* Kotak pemutar YouTube: tetap ada di halaman (tidak display:none) agar iklan YouTube terlihat dan bisa dilewati. */
    .yt-box {
      position: fixed;
      right: 16px;
      bottom: calc(var(--player-h) + 16px);
      width: 356px;
      max-width: calc(100vw - 32px);
      background: #000;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .2s, transform .2s, visibility .2s;
    }
    .yt-box.show {
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
    }
    .yt-box-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #b3b3b3;
    }
    .yt-box-head i { color: #f00; }
    .yt-box-frame { width: 100%; aspect-ratio: 16 / 9; min-height: 200px; }
    .yt-box-frame iframe { width: 100%; height: 100%; display: block; border: 0; }
    @media (max-width: 720px) {
      .yt-box { right: 8px; left: 8px; width: auto; max-width: none; bottom: calc(var(--player-h) + 8px); }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--player-h) + 24px);
      transform: translateX(-50%) translateY(10px);
      background: #fff;
      color: #000;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .85rem;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 20;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* Komponen Pagination & filter huruf artis */

    .pager-info {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      margin-top: 24px;
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 10px 0 8px;
    }

    .pager button,
    .letters button {
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-weight: 700;
      font-size: .82rem;
      transition: .15s;
    }

    .pager button:hover:not(:disabled):not(.active),
    .letters button:hover:not(:disabled):not(.active) {
      background: #2a2a2a;
      color: #fff;
    }

    .pager button.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .letters button.active {
      background: var(--accent);

     * Fisher-Yates shuffle, O(n), menghasilkan salinan baru (array asli tidak berubah).
     * Distribusi acak seragam, tidak seperti `sort(() => Math.random() - .5)`.
     */
    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Membangun Map key -> item untuk pencarian O(1). */
    function indexBy(items, keyOf) {
      const index = new Map();
      for (const item of items) index.set(keyOf(item), item);
      return index;
    }

    /** Mengelompokkan item per key dalam satu kali lintasan O(n); urutan asli tiap grup dipertahankan. */
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    /** Warna cover album milik halaman yang sedang aktif (diganti oleh App saat pindah LOCAL/PRO). */
    let COLORS = MUSIC_DATA[DEFAULT_MODE].colors;

    /* ################ MODELS       ################ */

    /* ---- models/Artist.js ---- */
    class Artist {
      constructor({ id, name, bio, img }) {
        this.id = id;
        this.name = name;
        this.bio = bio;
        this.img = safeImg(img);
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.albums = [];
        this.songs = [];
      }
    }

    /* ---- models/Album.js ---- */
    class Album {
      constructor({ id, name, artistId, year, colorId, img }) {
        this.id = id;
        this.name = name;
        this.artistId = artistId;
        this.colorId = colorId;
        this.year = year;
        /* Cover berwarna sesuai colorId dari data JSON (album tidak punya gambar). */
        this.img = safeImg(img, colorId);
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.artist = null;
        this.songs = [];
      }

      /** Tahun untuk tampilan; album tanpa tahun (null) tampil sebagai "-". */
      get yearLabel() {
        return this.year ?? '-';
      }
    }

    /* ---- models/Genre.js ---- */
    class Genre {
      constructor({ id, name, color }) {
        this.id = id;
        this.name = name;
        this.color = color;
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.songs = [];
      }
    }

    /* ---- models/Song.js ---- */
    /** Menerima ID video YouTube polos, atau URL (watch / youtu.be / embed / shorts); hasilnya selalu ID 11 karakter atau null. */
    function youTubeIdFrom(value) {
      if (!value) return null;
      const text = String(value).trim();
      if (/^[\w-]{11}$/.test(text)) return text;
      const match = text.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|shorts\/|live\/|watch\?(?:.*&)?v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    class Song {
      constructor({ id, name, albumId, genreId, dur, sc, yt = null }) {
        this.id = id;
        this.name = name;
        this.albumId = albumId;
        this.genreId = genreId;
        /** Durasi dalam detik; diperbarui dengan durasi asli dari SoundCloud saat lagu diputar. */
        this.duration = dur;
        /** ID track/playlist SoundCloud. null = belum bisa diputar. */
        this.soundCloudId = sc;
        /** ID video YouTube (cadangan bila SoundCloud kosong). SoundCloud selalu diutamakan. */
        this.youTubeId = youTubeIdFrom(yt);
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.album = null;
        this.genre = null;
        this.searchText = '';
      }

      get artist() {
        return this.album.artist;
      }

      get artistId() {
        return this.album.artistId;
      }

      get cover() {
        return this.album.img;
      }

      get isPlayable() {
        return Boolean(this.soundCloudId || this.youTubeId);
      }

      /** Kunci cache durasi: ID SoundCloud, atau "yt:<id>" untuk lagu YouTube. */
      get cacheKey() {
        return this.soundCloudId || (this.youTubeId ? `yt:${this.youTubeId}` : null);
      }

      /** Menyiapkan teks pencarian sekali saja, setelah relasi tersedia. */
      buildSearchText() {
        this.searchText = `${this.name} ${this.artist.name} ${this.album.name}`.toLowerCase();
      }

      matches(query) {
        return this.searchText.includes(query);
      }
    }

    /* ---- models/Playlist.js ---- */
    class Playlist {
      constructor({ id, name, desc, img, songIds, artistId = null, albumId = null, sc = null, dur = null }) {
        this.id = id;
        this.name = name;
        this.desc = desc;
        /* Cover playlist tidak dipakai: selalu placeholder abu-abu bertema musik (sama seperti artis). */
        this.img = PLACEHOLDER_IMG;
        this.songIds = songIds ?? [];
        /** Playlist SoundCloud utuh (mis. full album): artis/album terkait, ID SoundCloud, dan durasi (detik). */
        this.artistId = artistId;
        this.albumId = albumId;
        this.soundCloudId = sc;
        this.duration = dur ?? 0;
        /** Diisi oleh MusicLibrary: objek Song sesuai urutan songIds. */
        this.songs = [];
      }
    }

    /* ################ CORE         ################ */

    /* ---- core/EventBus.js ---- */
    /** Pola Observer: komponen dan service saling berkomunikasi tanpa saling mengenal. */
    class EventBus {
      #listeners = new Map();

      /** Mendaftarkan handler. Mengembalikan fungsi untuk berhenti berlangganan. */
      on(event, handler) {
        if (!this.#listeners.has(event)) this.#listeners.set(event, new Set());
        this.#listeners.get(event).add(handler);
        return () => this.off(event, handler);
      }

      off(event, handler) {
        this.#listeners.get(event)?.delete(handler);
      }

      emit(event, payload) {
        this.#listeners.get(event)?.forEach((handler) => handler(payload));
      }
    }

    /* ---- core/Component.js ---- */
    /**
     * Kelas dasar komponen UI.
     *
     * Siklus hidup:  constructor(root) -> mount() -> [render() -> bind()] -> unmount()
     *  - render(): mengembalikan markup HTML (string). Kembalikan null jika markup sudah ada di halaman.
     *  - bind():   menautkan event DOM dan langganan EventBus. Gunakan listen()/subscribe()
     *              agar semuanya otomatis dibersihkan saat unmount().
     */
    class Component {
      #cleanups = [];

      constructor(root) {
        if (!root) throw new Error(`${this.constructor.name}: elemen root tidak ditemukan`);
        this.root = root;
      }

      render() {
        return null;
      }

      bind() {}

      mount() {
        const markup = this.render();
        if (markup !== null) this.root.innerHTML = markup;
        this.bind();
        return this;
      }

      unmount() {
        this.#cleanups.forEach((cleanup) => cleanup());
        this.#cleanups = [];
      }

      /** Mencari elemen di dalam root komponen. */
      $(selector) {
        return this.root.querySelector(selector);
      }

      $$(selector) {
        return this.root.querySelectorAll(selector);
      }

      listen(target, type, handler, options) {
        target.addEventListener(type, handler, options);
        this.#cleanups.push(() => target.removeEventListener(type, handler, options));
      }

      subscribe(bus, event, handler) {
        this.#cleanups.push(bus.on(event, handler));
      }
    }

    /* ---- core/Router.js ---- */
    /** Value object: halaman mana yang sedang ditampilkan. Token berbentuk "view" atau "view:id". */
    class Route {
      constructor(view, id = null, query = '', page = 1, letter = '') {
        this.view = view;
        this.id = id;
        this.query = query;
        /** Nomor halaman pagination (mulai dari 1). */
        this.page = page;
        /** Filter huruf artis ('' = semua). */
        this.letter = letter;
      }

      static parse(token) {
        const [view, id] = token.split(':');
        return new Route(view, id ? Number(id) : null);
      }

      static search(query) {
        return new Route('search', null, query);
      }

      /** Halaman utama (daftar) yang valid, dan halaman detail yang wajib punya ID. */
      static #LISTS = new Set(NAV_ITEMS.map((item) => item.view));
      static #DETAILS = new Set(['artist', 'album', 'genre', 'playlist']);

      /**
       * URL hash -> Route. Bentuk: #/home, #/artists?huruf=A, #/artist/5, #/search/kata.
       * Hash tidak dikenal / rusak menghasilkan null (pemanggil memilih halaman cadangan).
       */
      static fromHash(hash) {
        try {
          const raw = String(hash ?? '').replace(/^#\/?/, '');
          if (!raw) return null;
          const [path, qs = ''] = raw.split('?');
          const [view, ...rest] = path.split('/');
          if (view === 'search') {
            const query = decodeURIComponent(rest.join('/')).trim();
            return query ? Route.search(query) : null;
          }
          if (Route.#DETAILS.has(view)) {
            const id = Number(rest[0]);
            return Number.isInteger(id) && id > 0 ? new Route(view, id) : null;
          }
          if (Route.#LISTS.has(view)) {
            const letter = (new URLSearchParams(qs).get('huruf') || '').toUpperCase();
            return new Route(view, null, '', 1, /^([A-Z]|#)$/.test(letter) ? letter : '');
          }
        } catch { /* hash rusak: abaikan */ }
        return null;
      }

      /** Route -> URL hash (kebalikan dari fromHash). */
      toHash() {
        if (this.view === 'search') return `#/search/${encodeURIComponent(this.query)}`;
        if (this.id !== null) return `#/${this.view}/${this.id}`;
        return `#/${this.view}${this.letter ? `?huruf=${encodeURIComponent(this.letter)}` : ''}`;
      }

      /** Halaman daftar tingkat atas (punya filter huruf), bukan detail atau pencarian. */
      get isList() {
        return this.id === null && this.view !== 'search';
      }

      /** Menu utama yang harus tampil aktif untuk halaman ini. */
      get section() {
        return SECTION_OF_VIEW[this.view] ?? this.view;
      }
    }

    /**
     * Router berbasis URL hash (#/songs, #/artist/5, #/search/kata) sehingga bekerja juga saat file dibuka
     * langsung (file://). Tombol back/forward browser, refresh, dan link yang dibagikan membuka halaman yang sama.
     * Halaman PRO memakai awalan: #/pro/songs, #/pro/artist/12. Tanpa awalan = LOCAL (link lama tetap berlaku).
     * Halaman terakhir (selain pencarian) diingat di localStorage untuk kunjungan tanpa hash.
     * Mengingat halaman terakhir yang dibuka lewat navigasi supaya mengosongkan kolom pencarian
     * bisa kembali ke halaman tersebut.
     * Status per halaman (huruf, detail, pencarian, halaman terakhir) dipisah antara LOCAL dan PRO.
     */
    class Router {
      #current = new Route('home');
      #lastPage = this.#current;
      #hash = '';
      /** Halaman aktif: 'local' atau 'pro'. */
      #mode = AppStorage.mode;
      /** Kata pencarian aktif; bertahan saat pindah halaman sampai pengguna menghapusnya. */
      #query = '';
      /** Huruf pagination terakhir per halaman daftar, mis. { artists: 'G' }; dipulihkan saat halaman dibuka lagi. */
      #letters = {};
      /** Halaman detail terakhir per menu, mis. { artists: 'artist:2' }; dipulihkan saat menu itu dibuka lagi dari navigasi. */
      #details = {};

      constructor(bus) {
        this.bus = bus;
        window.addEventListener('popstate', () => this.#onPopState());
      }

      get current() {
        return this.#current;
      }

      get query() {
        return this.#query;
      }

      get mode() {
        return this.#mode;
      }

      /** Halaman awal: dari URL (#/pro/...), lalu pilihan terakhir di localStorage, lalu LOCAL. */
      static initialMode() {
        return Router.#parseHash(location.hash)?.mode ?? AppStorage.savedMode();
      }

      /** URL hash -> { mode, route }. Hash kosong atau rusak (tanpa awalan PRO) -> null. */
      static #parseHash(hash) {
        const raw = String(hash ?? '').replace(/^#\/?/, '');
        if (!raw) return null;
        if (/^pro(?:[/?]|$)/.test(raw)) {
          const rest = raw.slice(3).replace(/^\//, '');
          return { mode: 'pro', route: rest ? Route.fromHash(`#/${rest}`) : null };
        }
        const route = Route.fromHash(hash);
        return route ? { mode: 'local', route } : null;
      }

      #hashOf(route) {
        const hash = route.toHash();
        return this.#mode === 'pro' ? `#/pro/${hash.slice(2)}` : hash;
      }

      /**
       * @param {string} token  "view" atau "view:id"
       * @param {{restore?: boolean}} [options]  restore=true (klik menu utama): bila menu itu punya detail
       *        yang terakhir dibuka (mis. artist Avenged Sevenfold), buka lagi detail tersebut, bukan daftarnya.
       */
      navigate(token, { restore = false } = {}) {
        let target = Route.parse(token);
        if (target.isList) {
          const saved = restore ? this.#details[target.view] : null;
          /* Tombol "kembali" ke daftar (restore=false) menghapus ingatan detail. */
          if (saved) target = Route.parse(saved);
          else {
            delete this.#details[target.view];
            AppStorage.update({ details: this.#details });
            target = this.#withSavedLetter(target);
          }
        }
        this.#rememberDetail(target);
        this.#lastPage = target;
        /* Kembali ke Songs saat masih ada kata pencarian: tampilkan lagi hasil pencariannya. */
        this.#current = target.view === 'songs' && this.#query ? Route.search(this.#query) : target;
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'navigate' });
      }

      /** Pindah antara LOCAL dan PRO tanpa memuat ulang aplikasi; membuka halaman terakhir milik halaman tujuan. */
      switchMode(mode) {
        if (!MODES[mode] || mode === this.#mode) return;
        this.#applyMode(mode);
        this.#enter(null, 'mode', false);
      }

      #applyMode(mode) {
        this.#mode = mode;
        AppStorage.mode = mode;
        AppStorage.saveMode(mode);
        this.bus.emit(Events.MODE_CHANGE, { mode });
      }

      /** Query kosong = kembali ke halaman terakhir. */
      search(query) {
        const wasSearch = this.#current.view === 'search';
        this.#query = query;
        AppStorage.update({ query });
        /* Kolom dikosongkan saat berada di halaman lain (bukan hasil pencarian): halaman tidak perlu dimuat ulang. */
        if (!query && !wasSearch) return;
        this.#current = query ? Route.search(query) : this.#lastPage;
        /* Mengetik terus tidak menambah riwayat: entri pencarian diganti, bukan ditumpuk. */
        this.#writeUrl(wasSearch);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'search' });
      }

      /** Pindah ke halaman huruf (A, B, C, ...) pada tampilan daftar yang sedang dibuka. */
      setLetter(letter) {
        const r = this.#current;
        this.#current = new Route(r.view, r.id, r.query, 1, letter);
        this.#lastPage = this.#current;
        this.#rememberLetter(r.view, letter);
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'page' });
      }

      /** Memicu render awal: dari URL, lalu halaman terakhir di localStorage, lalu Home. */
      start() {
        this.#mode = AppStorage.mode;
        const parsed = Router.#parseHash(location.hash);
        this.#enter(parsed?.mode === this.#mode ? parsed.route : null, 'start', true);
      }

      /** Memuat status tersimpan milik halaman aktif (huruf & detail terakhir), menyiapkan route, lalu menampilkannya. */
      #enter(hashRoute, source, replace) {
        const saved = AppStorage.read();
        this.#loadSaved(saved);
        let route = this.#withSavedLetter(hashRoute
          ?? Route.fromHash(saved.route)
          ?? new Route('home'));
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        this.#query = route.view === 'search' ? route.query : (typeof saved.query === 'string' ? saved.query : '');
        this.#lastPage = route.view === 'search' ? new Route('home') : route;
        if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#writeUrl(replace);
        document.title = this.#mode === 'pro' ? 'PlayList Music · PRO' : 'PlayList Music';
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source });
      }

      #loadSaved(saved) {
        this.#letters = {};
        this.#details = {};
        if (saved.letters && typeof saved.letters === 'object') {
          for (const [view, letter] of Object.entries(saved.letters)) {
            if (/^([A-Z]|#)$/.test(letter)) this.#letters[view] = letter;
          }
        }
        if (saved.details && typeof saved.details === 'object') {
          for (const [view, token] of Object.entries(saved.details)) {
            const r = typeof token === 'string' ? Route.parse(token) : null;
            if (r && r.id > 0 && Number.isInteger(r.id) && r.section === view) this.#details[view] = token;
          }
        }
      }

      #rememberLetter(view, letter) {
        if (view === 'search') return;
        if (letter) this.#letters[view] = letter;
        else delete this.#letters[view];
        AppStorage.update({ letters: this.#letters });
      }

      /** Mengingat detail yang sedang dibuka (artist/album/genre/playlist) untuk menu induknya. */
      #rememberDetail(route) {
        if (route.id === null || route.view === 'search') return;
        this.#details[route.section] = `${route.view}:${route.id}`;
        AppStorage.update({ details: this.#details });
      }

      /** Halaman daftar tanpa huruf dibuka lagi: pakai huruf terakhir yang dipilih di halaman itu. */
      #withSavedLetter(route) {
        const letter = this.#letters[route.view];
        return route.isList && !route.letter && letter ? new Route(route.view, null, '', 1, letter) : route;
      }

      /** Back/forward browser atau hash diubah manual di address bar (termasuk berpindah LOCAL <-> PRO). */
      #onPopState() {
        const hash = location.hash;
        if (hash === this.#hash) return;
        const parsed = Router.#parseHash(hash);
        const mode = parsed?.mode ?? this.#mode;
        let hashRoute = parsed?.route ?? null;
        if (mode !== this.#mode) {
          this.#applyMode(mode);
          const saved = AppStorage.read();
          this.#loadSaved(saved);
          this.#query = typeof saved.query === 'string' ? saved.query : '';
          hashRoute ??= Route.fromHash(saved.route);
          document.title = mode === 'pro' ? 'PlayList Music · PRO' : 'PlayList Music';
        }
        let route = hashRoute ?? new Route('home');
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        if (route.view === 'search') this.#query = route.query;
        else {
          this.#lastPage = route;
          if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        }
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#hash = this.#hashOf(route);
        AppStorage.update({ route: this.#lastPage.toHash() });
        this.bus.emit(Events.ROUTE_CHANGE, { route, source: 'popstate' });
      }

      #writeUrl(replace) {
        const hash = this.#hashOf(this.#current);
        AppStorage.update({ route: this.#lastPage.toHash() });
        if (hash === this.#hash && !replace) return;
        this.#hash = hash;
        try {
          history[replace ? 'replaceState' : 'pushState'](null, '', hash);
        } catch {
          location.hash = hash; /* cadangan bila History API ditolak */
        }
      }
    }

    /* ################ SERVICES     ################ */

    /* ---- services/MusicLibrary.js ---- */
    /**
     * Repository katalog musik.
     *
     * Struktur data:
     *  - Map<id, entity>        -> pencarian entitas O(1) (menggantikan Array.find yang O(n))
     *  - Map<key, entity[]>     -> indeks relasi (lagu per album/artis/genre, album per artis),
     *                              dibangun sekali O(n) lalu dibaca O(1)
     *  - cache hasil sort       -> daftar terurut dihitung sekali, dipakai ulang
     */
    class MusicLibrary {
      #artistById;
      #albumById;
      #genreById;
      #songById;
      #playlistById;
      #songsByAlbum;
      #songsByGenre;
      #songsByArtist;
      #albumsByArtist;
      #sorted = new Map();

      constructor({ artists, genres, albums, songs, playlists }) {
        this.artists = artists.map((row) => new Artist(row));
        this.genres = genres.map((row) => new Genre(row));
        this.albums = albums.map((row) => new Album(row));
        this.songs = songs.map((row) => new Song(row));
        this.playlists = playlists.map((row) => new Playlist(row));

        this.#artistById = indexBy(this.artists, (a) => a.id);
        this.#albumById = indexBy(this.albums, (a) => a.id);
        this.#genreById = indexBy(this.genres, (g) => g.id);
        this.#songById = indexBy(this.songs, (s) => s.id);
        this.#playlistById = indexBy(this.playlists, (p) => p.id);

        this.#linkRelations();

        this.#songsByAlbum = groupBy(this.songs, (s) => s.albumId);
        this.#songsByGenre = groupBy(this.songs, (s) => s.genreId);
        this.#songsByArtist = groupBy(this.songs, (s) => s.artistId);
        this.#albumsByArtist = groupBy(this.albums, (a) => a.artistId);
      }

      /** Menghubungkan objek antar-entitas (song -> album -> artist, song -> genre, playlist -> songs). */
      #linkRelations() {
        for (const album of this.albums) {
          album.artist = this.#artistById.get(album.artistId);
          album.artist.albums.push(album);
        }
        for (const song of this.songs) {
          song.album = this.#albumById.get(song.albumId);
          song.genre = this.#genreById.get(song.genreId);
          song.album.songs.push(song);
          song.artist.songs.push(song);
          song.genre.songs.push(song);
          song.buildSearchText();
        }
        for (const playlist of this.playlists) {
          const listed = playlist.songIds.map((id) => this.#songById.get(id)).filter(Boolean);
          playlist.songs = listed.length ? listed : this.#playlistTrack(playlist);
        }
      }

      /**
       * Playlist tanpa daftar lagu (songIds kosong) tetapi punya ID SoundCloud sendiri diputar sebagai satu trek.
       * Bila lagu dengan ID SoundCloud yang sama sudah ada di pustaka, lagu itu dipakai; jika tidak, dibuat trek
       * khusus (tidak masuk daftar lagu/pencarian) dengan id negatif agar tidak bentrok dengan id lagu.
       */
      #playlistTrack(playlist) {
        if (!playlist.soundCloudId) return [];
        const existing = this.songs.find((s) => s.soundCloudId === playlist.soundCloudId);
        if (existing) return [existing];

        const track = new Song({
          id: -playlist.id, name: playlist.name, albumId: playlist.albumId,
          genreId: null, dur: playlist.duration, sc: playlist.soundCloudId,
        });
        const artist = this.#artistById.get(playlist.artistId)
          ?? new Artist({ id: null, name: 'Berbagai Artis', bio: '', img: null });
        track.album = this.#albumById.get(playlist.albumId)
          ?? Object.assign(new Album({ id: null, name: playlist.name, artistId: playlist.artistId, year: null, colorId: null }), { artist });
        return [track];
      }

      /* ---------- Lookup O(1) ---------- */
      getSong(id) { return this.#songById.get(id); }
      getArtist(id) { return this.#artistById.get(id); }
      getAlbum(id) { return this.#albumById.get(id); }
      getGenre(id) { return this.#genreById.get(id); }
      getPlaylist(id) { return this.#playlistById.get(id); }

      /* ---------- Relasi ---------- */
      songsOfAlbum(albumId) { return this.#songsByAlbum.get(albumId) ?? []; }
      songsOfGenre(genreId) { return this.#songsByGenre.get(genreId) ?? []; }

      /** Tahun tidak diketahui (null) diurutkan paling akhir, bukan paling awal. */
      static #yearKey(year) { return year ?? Number.MAX_SAFE_INTEGER; }

      albumsOfArtist(artistId) {
        const key = MusicLibrary.#yearKey;
        return [...(this.#albumsByArtist.get(artistId) ?? [])]
          .sort((a, b) => (key(a.year) < key(b.year) ? -1 : key(a.year) > key(b.year) ? 1 : 0));
      }

      /** Lagu artis, diurutkan menurut tahun album lalu urutan id. */
      songsOfArtist(artistId) {
        const key = MusicLibrary.#yearKey;
        return [...(this.#songsByArtist.get(artistId) ?? [])]
          .sort((a, b) => (key(a.album.year) < key(b.album.year) ? -1 : key(a.album.year) > key(b.album.year) ? 1 : 0) || a.id - b.id);
      }

      /* ---------- Daftar terurut (di-cache) ---------- */
      #memoSort(key, build) {
        if (!this.#sorted.has(key)) this.#sorted.set(key, build());
        return this.#sorted.get(key);
      }

      sortedSongs() {
        return this.#memoSort('songs', () => [...this.songs].sort(
          (a, b) => compareText(a.artist.name, b.artist.name) || compareText(a.name, b.name)));
      }

      sortedArtists() {
        return this.#memoSort('artists', () => [...this.artists].sort((a, b) => compareText(a.name, b.name)));
      }

      sortedAlbums() {
        return this.#memoSort('albums', () => [...this.albums].sort(
          (a, b) => compareText(a.name, b.name) || compareText(a.artist.name, b.artist.name) || a.year - b.year));
      }

      sortedGenres() {
        return this.#memoSort('genres', () => [...this.genres].sort((a, b) => compareText(a.name, b.name)));
      }
    }

    /* ---- services/SearchService.js ---- */
    /**
     * Pencarian lagu berdasarkan judul + artis + album.
     * Teks pencarian setiap lagu sudah dihitung sekali (Song.searchText),
     * sehingga tiap ketikan hanya satu lintasan O(n) tanpa membangun string ulang.
     */
    class SearchService {
      constructor(library) {
        this.library = library;
      }

      /** @param {string} rawQuery teks mentah dari input */
      search(rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        if (!query) return [];
        return this.library.songs.filter((song) => song.matches(query));
      }
    }

    /* ---- services/FavoritesStore.js ---- */
    /**
     * Daftar lagu favorit, disimpan di localStorage (kunci sendiri) dan dipakai bersama LOCAL dan PRO.
     * Identitas lagu = ID lagu, sehingga tidak ada duplikasi. Trek khusus playlist (ID negatif, bisa sama di
     * dua halaman) diberi awalan halaman, mis. "pro:-1", supaya tetap unik.
     * Menyimpan hanya kuncinya; objek lagu dicari lewat register() dari pustaka LOCAL dan PRO.
     */
    class FavoritesStore {
      static KEY = 'musik-favorit-v1';

      #keys;
      #keyOf = new WeakMap();
      #songByKey = new Map();

      constructor({ bus }) {
        this.bus = bus;
        this.#keys = this.#read();
      }

      /** Mendaftarkan semua lagu (termasuk trek playlist) milik satu halaman agar bisa dicari lewat kuncinya. */
      register(library, mode) {
        const songs = [...library.songs, ...library.playlists.flatMap((playlist) => playlist.songs)];
        for (const song of songs) {
          const key = song.id > 0 ? song.id : `${mode}:${song.id}`;
          this.#keyOf.set(song, key);
          this.#songByKey.set(key, song);
        }
      }

      keyOf(song) {
        return this.#keyOf.get(song) ?? song.id;
      }

      has(song) {
        return Boolean(song) && this.#keys.includes(this.keyOf(song));
      }

      /** Menambah atau menghapus lagu dari Favorites. Mengembalikan true bila kini menjadi favorit. */
      toggle(song) {
        const key = this.keyOf(song);
        const favorite = !this.#keys.includes(key);
        this.#keys = favorite ? [...this.#keys, key] : this.#keys.filter((k) => k !== key);
        this.#write();
        this.bus.emit(Events.FAVORITES_CHANGE, { song, favorite });
        return favorite;
      }

      /** Lagu favorit dari semua halaman, yang terbaru ditambahkan di paling atas. */
      get songs() {
        return [...this.#keys].reverse().map((key) => this.#songByKey.get(key)).filter(Boolean);
      }

      #read() {
        try {
          const value = JSON.parse(localStorage.getItem(FavoritesStore.KEY));
          return Array.isArray(value)
            ? [...new Set(value.filter((k) => typeof k === 'number' || typeof k === 'string'))]
            : [];
        } catch { return []; }
      }

      #write() {
        try { localStorage.setItem(FavoritesStore.KEY, JSON.stringify(this.#keys)); } catch { /* abaikan */ }
      }
    }

    /* ---- services/PlayQueue.js ---- */
    /**
     * Antrean putar.
     *
     *  - #source   : daftar asal (urutan tampilan di halaman)
     *  - #order    : urutan putar aktual (sama dengan source, atau hasil Fisher-Yates jika shuffle)
     *  - #cursor   : indeks lagu yang sedang aktif di #order
     *  - #position : Map<songId, indeks> untuk mencari posisi lagu O(1)
     *
     * Navigasi next/previous bersifat melingkar (circular buffer) dan melewati lagu yang belum
     * punya sumber SoundCloud.
     */
    class PlayQueue {
      #source = [];
      #order = [];
      #position = new Map();
      #cursor = 0;
      #shuffled = false;

      constructor(songs) {
        this.load(songs);
      }

      get current() {
        return this.#order[this.#cursor];
      }

      get cursor() {
        return this.#cursor;
      }

      get size() {
        return this.#order.length;
      }

      get isShuffled() {
        return this.#shuffled;
      }

      /** Mengganti antrean dengan `songs`. Jika startId diberikan, kursor diarahkan ke lagu itu. */
      load(songs, startId = null) {
        this.#source = songs;
        this.#rebuildOrder();
        if (startId !== null) this.#cursor = this.indexOf(startId);
        return this;
      }

      setShuffle(enabled) {
        const currentId = this.current?.id;
        this.#shuffled = enabled;
        this.#rebuildOrder();
        if (currentId !== undefined) this.#cursor = this.indexOf(currentId);
      }

      indexOf(songId) {
        return this.#position.get(songId) ?? -1;
      }

      isCurrent(songId) {
        return this.current?.id === songId;
      }

      jumpTo(index) {
        this.#cursor = index;
        return this.current;
      }

      /**
       * Indeks lagu berikutnya (direction = 1) atau sebelumnya (-1) yang bisa diputar,
       * dengan wrap-around. Mengembalikan -1 bila tidak ada satu pun yang bisa diputar.
       */
      findPlayable(direction) {
        const n = this.#order.length;
        for (let step = 1; step <= n; step++) {
          const index = (((this.#cursor + direction * step) % n) + n) % n;
          if (this.#order[index].isPlayable) return index;
        }
        return -1;
      }

      #rebuildOrder() {
        this.#order = this.#shuffled ? shuffle(this.#source) : [...this.#source];
        this.#position = new Map(this.#order.map((song, index) => [song.id, index]));
        this.#cursor = Math.min(this.#cursor, Math.max(this.#order.length - 1, 0));
      }
    }

    /* ---- services/SoundCloudPlayer.js ---- */
    /**
     * Adapter untuk SoundCloud Widget API (satu-satunya sumber audio aplikasi).
     * Seluruh pengetahuan tentang `SC.Widget` dikurung di kelas ini; bagian lain aplikasi
     * hanya berbicara lewat method sederhana (play, pause, load, ...).
     */
    class SoundCloudPlayer {
      #widget;
      #events;

      /**
       * @param {HTMLIFrameElement} iframe iframe tersembunyi berisi widget SoundCloud
       * @param {object} sc objek global `SC` dari https://w.soundcloud.com/player/api.js
       */
      constructor(iframe, sc = window.SC) {
        /* API gagal dimuat (offline/diblokir): aplikasi tetap tampil, pemutaran dinonaktifkan. */
        this.available = Boolean(sc);
        if (sc) {
          this.#widget = sc.Widget(iframe);
          this.#events = sc.Widget.Events;
        } else {
          this.#widget = {
            load() {}, play() {}, pause() {}, seekTo() {}, setVolume() {}, bind() {},
            getDuration: (cb) => cb(0), getCurrentSound: (cb) => cb(null),
          };
          this.#events = {};
        }
      }

      /** Track biasa diberi ID angka; ID berawalan "p" menandakan playlist SoundCloud. */
      static urlFor(id) {
        const value = String(id);
        return value.startsWith('p')
          ? `https://api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A${value.slice(1)}`
          : `https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A${value}`;
      }

      load(id, onReady, autoPlay = true) {
        this.#widget.load(SoundCloudPlayer.urlFor(id), {
          auto_play: autoPlay,
          show_teaser: false,
          callback: onReady,
        });
      }

      play() { this.#widget.play(); }
      pause() { this.#widget.pause(); }
      seekTo(milliseconds) { this.#widget.seekTo(milliseconds); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) { this.#widget.setVolume(fraction * 100); }

      /** @returns {Promise<number>} durasi track dalam milidetik */
      getDuration() {
        return new Promise((resolve) => this.#widget.getDuration(resolve));
      }

      onReady(handler) { this.#widget.bind(this.#events.READY, handler); }

      /** @returns {Promise<object|null>} data track yang sedang dimuat widget (id, duration dalam ms, ...) */
      getCurrentSound() {
        return new Promise((resolve) => this.#widget.getCurrentSound((sound) => resolve(sound)));
      }

      onPlay(handler) { this.#widget.bind(this.#events.PLAY, handler); }
      onPause(handler) { this.#widget.bind(this.#events.PAUSE, handler); }
      onFinish(handler) { this.#widget.bind(this.#events.FINISH, handler); }

      /** handler menerima { percent: 0..100, seconds } */
      onProgress(handler) {
        this.#widget.bind(this.#events.PLAY_PROGRESS, (e) =>
          handler({ percent: e.relativePosition * 100, seconds: e.currentPosition / 1000 }));
      }
    }

    /* ---- services/YouTubePlayer.js ---- */
    /**
     * Adapter YouTube IFrame API: antarmukanya dibuat sama dengan SoundCloudPlayer
     * (load, play, pause, seekTo, setVolume, getDuration, onPlay, ...), jadi PlayerController tidak perlu tahu bedanya.
     * Skrip YouTube baru dimuat saat lagu YouTube pertama kali diputar.
     */
    class YouTubePlayer {
      static #apiPromise = null;
      #host;
      #player = null;
      #ready = null;
      #pending = null;
      #volume = 100;
      #timer = null;
      #handlers = { play: [], pause: [], finish: [], progress: [], error: [] };

      /** @param {HTMLElement} host elemen kosong tempat YouTube membuat iframe-nya */
      constructor(host) {
        this.#host = host;
        this.available = true;
      }

      static #loadApi() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (!YouTubePlayer.#apiPromise) {
          YouTubePlayer.#apiPromise = new Promise((resolve, reject) => {
            const previous = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => { if (previous) previous(); resolve(window.YT); };
            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            script.onerror = () => { YouTubePlayer.#apiPromise = null; reject(new Error('YouTube API gagal dimuat')); };
            document.head.appendChild(script);
          });
        }
        return YouTubePlayer.#apiPromise;
      }

      #emit(name, payload) { this.#handlers[name].forEach((fn) => fn(payload)); }

      #ensure() {
        if (this.#ready) return this.#ready;
        this.#ready = YouTubePlayer.#loadApi().then((YT) => new Promise((resolve) => {
          const vars = { playsinline: 1, controls: 0, rel: 0, disablekb: 1, fs: 0, iv_load_policy: 3 };
          if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
          this.#player = new YT.Player(this.#host, {
            width: '100%', height: '100%', playerVars: vars,
            events: {
              onReady: () => resolve(this.#player),
              onStateChange: (event) => this.#onState(event.data, YT.PlayerState),
              onError: () => { this.#stopTimer(); this.#emit('error'); },
            },
          });
        }));
        this.#ready.catch(() => { this.#ready = null; this.available = false; this.#emit('error'); });
        return this.#ready;
      }

      #onState(state, S) {
        if (state === S.PLAYING) { this.#startTimer(); this.#emit('play'); }
        else if (state === S.PAUSED) { this.#stopTimer(); this.#emit('pause'); }
        else if (state === S.ENDED) { this.#stopTimer(); this.#emit('finish'); }
      }

      #startTimer() {
        this.#stopTimer();
        this.#timer = setInterval(() => {
          const p = this.#player;
          if (!p || !p.getDuration) return;
          const total = p.getDuration() || 0;
          const seconds = p.getCurrentTime() || 0;
          if (total > 0) this.#emit('progress', { percent: (seconds / total) * 100, seconds });
        }, 250);
      }

      #stopTimer() { clearInterval(this.#timer); this.#timer = null; }

      load(id, onReady, autoPlay = true) {
        const token = Symbol('load');
        this.#pending = token;
        this.#ensure().then((player) => {
          if (this.#pending !== token) return; /* sudah ada permintaan load yang lebih baru */
          player.setVolume(this.#volume);
          if (autoPlay) player.loadVideoById(id); else player.cueVideoById(id);
          if (onReady) onReady();
        }).catch(() => {});
      }

      play() { this.#player?.playVideo?.(); }
      pause() { this.#player?.pauseVideo?.(); }
      seekTo(milliseconds) { this.#player?.seekTo?.(milliseconds / 1000, true); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) {
        this.#volume = Math.round(fraction * 100);
        this.#player?.setVolume?.(this.#volume);
      }

      /** @returns {Promise<number>} durasi dalam milidetik (0 bila belum diketahui) */
      getDuration() {
        const seconds = this.#player?.getDuration?.() || 0;
        return Promise.resolve(seconds * 1000);
      }

      onPlay(handler) { this.#handlers.play.push(handler); }
      onPause(handler) { this.#handlers.pause.push(handler); }
      onFinish(handler) { this.#handlers.finish.push(handler); }
      onProgress(handler) { this.#handlers.progress.push(handler); }
      onError(handler) { this.#handlers.error.push(handler); }
    }

    /* ---- services/HybridPlayer.js ---- */
    /**
     * Memilih mesin audio per lagu: SoundCloud bila lagu punya ID SoundCloud, selain itu YouTube.
     * Antarmukanya sama dengan SoundCloudPlayer, hanya `load()` menerima objek Song (bukan ID).
     * Event dari mesin yang tidak sedang aktif diabaikan, supaya jeda otomatis saat berganti mesin tidak mengganggu status.
     */
    class HybridPlayer {
      #soundCloud;
      #youTube;
      #active;

      constructor(soundCloud, youTube) {
        this.#soundCloud = soundCloud;
        this.#youTube = youTube;
        this.#active = soundCloud;
      }

      get available() { return this.#soundCloud.available || this.#youTube.available; }

      /** Kotak video YouTube hanya tampil saat lagu YouTube aktif (iklan YouTube butuh ruang tampil). */
      showVideo(visible) { document.getElementById('ytwrap')?.classList.toggle('show', visible); }

      load(song, onReady, autoPlay = true) {
        const useSoundCloud = Boolean(song.soundCloudId);
        const next = useSoundCloud ? this.#soundCloud : this.#youTube;
        const other = useSoundCloud ? this.#youTube : this.#soundCloud;
        this.#active = next; /* ganti dulu, baru jeda mesin lain: event jeda-nya jadi diabaikan */
        this.showVideo(!useSoundCloud);
        if (other !== next) other.pause();
        next.load(useSoundCloud ? song.soundCloudId : song.youTubeId, onReady, autoPlay);
      }

      play() { this.#active.play(); }
      pause() { this.#active.pause(); }
      seekTo(milliseconds) { this.#active.seekTo(milliseconds); }
      setVolume(fraction) { this.#soundCloud.setVolume(fraction); this.#youTube.setVolume(fraction); }
      getDuration() { return this.#active.getDuration(); }
      getCurrentSound() { return this.#active.getCurrentSound ? this.#active.getCurrentSound() : Promise.resolve(null); }
      onReady(handler) { this.#soundCloud.onReady(handler); }

      #bind(method, handler) {
        [this.#soundCloud, this.#youTube].forEach((engine) => {
          engine[method]((payload) => { if (engine === this.#active) handler(payload); });
        });
      }

      onPlay(handler) { this.#bind('onPlay', handler); }
      onPause(handler) { this.#bind('onPause', handler); }
      onFinish(handler) { this.#bind('onFinish', handler); }
      onProgress(handler) { this.#bind('onProgress', handler); }
      onError(handler) { this.#youTube.onError(handler); }
    }

    /* ---- services/PlayerController.js ---- */
    /**
     * Pengendali pemutaran: menggabungkan PlayQueue (apa yang diputar) dengan SoundCloudPlayer
     * (bagaimana diputar), lalu mengabarkan perubahan lewat EventBus.
     * Kelas ini tidak menyentuh DOM sama sekali.
     */
    class PlayerController {
      #started = false;
      #playing = false;
      #repeat = false;
      #volume = DEFAULT_VOLUME;
      #loadedSongId = null;
      /** Asal antrean aktif: 'favorites' bila diputar dari halaman Favorites, selain itu null. */
      #queueTag = null;
      #nudgeTimer = null;
      #warningTimer = null;

      /**
       * @param {object} deps
       * @param {import('./SoundCloudPlayer.js').SoundCloudPlayer} deps.soundCloud
       * @param {import('../core/EventBus.js').EventBus} deps.bus
       * @param {import('../models/Song.js').Song[]} deps.songs antrean awal
       */
      constructor({ soundCloud, bus, songs }) {
        this.sc = soundCloud;
        this.bus = bus;
        this.queue = new PlayQueue(songs);
        this.#restoreSaved();
        this.#listenToSoundCloud();
      }

      /** Memulihkan volume, shuffle/repeat, dan lagu terakhir dari localStorage (belum diputar otomatis). */
      #restoreSaved() {
        const saved = AppStorage.read();
        if (typeof saved.volume === 'number' && saved.volume >= 0 && saved.volume <= 1) this.#volume = saved.volume;
        if (saved.shuffle === true) this.queue.setShuffle(true);
        else if (saved.repeat === true) this.#repeat = true;
        const index = this.queue.indexOf(saved.songId);
        if (index !== -1) this.queue.jumpTo(index);
      }

      #persist() {
        AppStorage.update({
          volume: this.#volume,
          songId: this.queue.current?.id,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        });
      }

      get currentSong() { return this.queue.current; }
      get volume() { return this.#volume; }

      /** True jika lagu ini sudah dimulai dan sedang menjadi lagu aktif. */
      isCurrent(songId) {
        return this.#started && this.queue.isCurrent(songId);
      }

      get state() {
        return {
          activeId: this.#started && this.queue.current ? this.queue.current.id : null,
          playing: this.#playing,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        };
      }

      /**
       * Pindah LOCAL <-> PRO: pemutaran dihentikan, antrean diganti dengan lagu halaman baru, dan lagu terakhir
       * milik halaman itu dipulihkan (belum diputar otomatis). Widget SoundCloud dan pengaturan volume tetap dipakai bersama.
       */
      switchLibrary(songs) {
        clearTimeout(this.#nudgeTimer);
        clearTimeout(this.#warningTimer);
        this.sc.pause();
        this.sc.showVideo(false);
        this.#started = false;
        this.#playing = false;
        this.#loadedSongId = null;
        this.#queueTag = null;
        this.queue.load(songs);
        this.queue.jumpTo(0);
        const index = this.queue.indexOf(AppStorage.read().songId);
        if (index !== -1) this.queue.jumpTo(index);
        this.#emitState();
        this.bus.emit(Events.PLAYER_RESET, { song: this.queue.current, state: this.state });
      }

      /* ---------- Perintah dari UI ---------- */

      playFrom(songs, songId, tag = null) {
        this.#queueTag = tag;
        this.queue.load(songs, songId);
        this.#playAt(this.queue.indexOf(songId));
      }

      /**
       * Jika antrean berasal dari Favorites, ikuti perubahan daftar favorit (tambah/hapus) tanpa menghentikan lagu.
       * Lagu yang sedang diputar tetap ada di antrean walau baru dihapus dari favorit.
       */
      syncFavoritesQueue(favoriteSongs) {
        if (this.#queueTag !== 'favorites') return;
        const current = this.queue.current;
        const list = current && !favoriteSongs.includes(current) ? [current, ...favoriteSongs] : favoriteSongs;
        this.queue.load(list, current ? current.id : null);
        this.#persist();
      }

      toggle() {
        const song = this.queue.current;
        if (!song) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#started = true;
        if (!song.isPlayable) {
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }
        // Lagu yang tampil di player belum pernah dimuat -> muat dulu, jangan hanya menekan play.
        if (this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
        if (this.#playing) {
          /* Jeda manual: batalkan percobaan "dorong play" otomatis agar lagu tidak menyala lagi sendiri. */
          clearTimeout(this.#nudgeTimer);
          clearTimeout(this.#warningTimer);
          this.sc.pause();
        } else this.sc.play();
      }

      /** direction: 1 = berikutnya, -1 = sebelumnya. Repeat hanya berlaku saat maju. */
      step(direction) {
        if (this.#repeat && direction > 0) {
          const song = this.queue.current;
          /* Lagu aktif belum pernah dimuat (mis. baru dipulihkan): muat dulu, jangan memutar trek bawaan widget. */
          if (!song || this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
          this.sc.seekTo(0);
          this.sc.play();
          return;
        }
        const index = this.queue.findPlayable(direction);
        if (index === -1) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#playAt(index);
      }

      toggleShuffle() {
        this.queue.setShuffle(!this.queue.isShuffled);
        if (this.queue.isShuffled) this.#repeat = false;
        this.#persist();
        this.#emitState();
      }

      toggleRepeat() {
        this.#repeat = !this.#repeat;
        if (this.#repeat) this.queue.setShuffle(false);
        this.#persist();
        this.#emitState();
      }

      async seekToPercent(percent) {
        if (this.#loadedSongId === null || this.#loadedSongId !== this.queue.current?.id) return;
        const duration = await this.sc.getDuration();
        this.sc.seekTo((percent / 100) * duration);
      }

      setVolume(fraction) {
        this.#volume = fraction;
        this.sc.setVolume(fraction);
        this.#persist();
      }

      /* ---------- Internal ---------- */

      #playAt(index) {
        const song = this.queue.jumpTo(index);
        this.#started = true;
        this.#persist();
        this.bus.emit(Events.PLAYER_TRACK, song);
        this.bus.emit(Events.PLAYER_PROGRESS, { percent: 0, seconds: 0 });

        if (!song.isPlayable) {
          this.#playing = false;
          this.sc.pause();
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }

        if (!this.sc.available) {
          this.#playing = false;
          this.#emitState();
          return this.#toast(MESSAGES.NO_PLAYER);
        }

        this.#playing = true;
        this.#loadedSongId = song.id;
        this.#emitState();
        this.sc.load(song, () => {
          this.sc.setVolume(this.#volume);
          this.sc.play();
        });
        this.#watchStart(song);
      }

      /** Beberapa browser menolak autoplay: coba sekali lagi, lalu beri petunjuk ke pengguna. */
      #watchStart(song) {
        const stalled = () => this.queue.current === song && !this.#playing;
        clearTimeout(this.#nudgeTimer);
        this.#nudgeTimer = setTimeout(() => stalled() && this.sc.play(), TIMING.PLAY_NUDGE_MS);
        clearTimeout(this.#warningTimer);
        this.#warningTimer = setTimeout(() => {
          if (!stalled()) return;
          this.#emitState();
          this.#toast(MESSAGES.NOT_STARTED);
        }, TIMING.PLAY_WARNING_MS);
      }

      #listenToSoundCloud() {
        this.sc.onPlay(() => {
          this.#playing = true;
          this.#emitState();
          this.sc.setVolume(this.#volume);
          this.#syncDuration();
        });
        this.sc.onPause(() => {
          this.#playing = false;
          this.#emitState();
        });
        this.sc.onFinish(() => {
          this.#playing = false;
          this.step(1);
        });
        this.sc.onProgress((progress) => this.bus.emit(Events.PLAYER_PROGRESS, progress));
        /* Video YouTube tidak bisa diputar (embed dibatasi / dihapus): tampilkan info dan hentikan status "playing". */
        this.sc.onError(() => {
          clearTimeout(this.#nudgeTimer);
          clearTimeout(this.#warningTimer);
          this.#playing = false;
          this.#emitState();
          this.#toast(MESSAGES.YT_ERROR);
        });
      }

      /**
       * Memperbarui durasi lagu aktif dengan durasi asli dari SoundCloud.
       * Data track diverifikasi (id harus cocok) agar event dari lagu sebelumnya tidak menimpa durasi lagu baru.
       */
      async #syncDuration() {
        const song = this.queue.current;
        if (song && !song.soundCloudId && song.youTubeId) {
          /* Lagu YouTube: durasi diambil dari pemutar YouTube. */
          const ms = await this.sc.getDuration();
          if (this.queue.current !== song || !(ms > 0)) return;
          song.duration = ms / 1000;
          DurationCache.save(song.cacheKey, song.duration);
          this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
          return;
        }
        const sound = await this.sc.getCurrentSound();
        if (!sound || !song || this.queue.current !== song) return;
        const isPlaylist = String(song.soundCloudId).startsWith('p');
        if (!isPlaylist && sound.id !== undefined && String(sound.id) !== String(song.soundCloudId)) return;
        if (!(sound.duration > 0)) return;
        song.duration = sound.duration / 1000;
        DurationCache.save(song.soundCloudId, song.duration);
        this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
      }

      #emitState() {
        this.bus.emit(Events.PLAYER_STATE, this.state);
      }

      #toast(message) {
        this.bus.emit(Events.TOAST, message);
      }
    }

    /* ---- services/AppStorage.js ---- */
    /**
     * Pengaturan pengguna di localStorage: halaman terakhir, volume, lagu terakhir, shuffle, repeat.
     * Halaman LOCAL memakai kunci lama (data pengguna lama tetap terbaca); halaman PRO menyimpan
     * pengaturan per-halaman (route, query, letters, details, songId) di bagian `modes.pro`.
     * Volume, shuffle, dan repeat dipakai bersama oleh kedua halaman.
     */
    const AppStorage = {
      KEY: 'musik-pengaturan-v1',
      SCOPED: ['route', 'query', 'letters', 'details', 'songId'],
      /** Halaman aktif; diatur oleh App/Router sebelum membaca atau menulis pengaturan. */
      mode: DEFAULT_MODE,
      readAll() {
        try {
          const value = JSON.parse(localStorage.getItem(this.KEY));
          return value && typeof value === 'object' ? value : {};
        } catch { return {}; }
      },
      read() {
        const all = this.readAll();
        if (this.mode === DEFAULT_MODE) return all;
        const shared = Object.fromEntries(Object.entries(all).filter(([key]) => !this.SCOPED.includes(key)));
        return { ...shared, ...(all.modes?.[this.mode] ?? {}) };
      },
      update(patch) {
        try {
          const all = this.readAll();
          if (this.mode === DEFAULT_MODE) {
            localStorage.setItem(this.KEY, JSON.stringify({ ...all, ...patch }));
            return;
          }
          const scoped = {};
          const shared = {};
          for (const [key, value] of Object.entries(patch)) (this.SCOPED.includes(key) ? scoped : shared)[key] = value;
          const modes = { ...(all.modes ?? {}), [this.mode]: { ...(all.modes?.[this.mode] ?? {}), ...scoped } };
          localStorage.setItem(this.KEY, JSON.stringify({ ...all, ...shared, modes }));
        } catch { /* storage tidak tersedia: abaikan */ }
      },
      /** Halaman (LOCAL/PRO) terakhir yang dibuka. */
      savedMode() {
        const mode = this.readAll().mode;
        return MODES[mode] ? mode : DEFAULT_MODE;
      },
      saveMode(mode) {
        try { localStorage.setItem(this.KEY, JSON.stringify({ ...this.readAll(), mode })); } catch { /* abaikan */ }
      },
    };

    /* ---- services/DurationCache.js ---- */
    /** Menyimpan durasi asli dari SoundCloud di browser (localStorage), per ID track SoundCloud, supaya kunjungan berikutnya langsung tepat. */
    const DurationCache = {
      KEY: 'musik-durasi-soundcloud-v4',
      read() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch { return {}; }
      },
      save(soundCloudId, seconds) {
        try {
          const all = this.read();
          all[soundCloudId] = seconds;
          localStorage.setItem(this.KEY, JSON.stringify(all));
        } catch { /* storage tidak tersedia: abaikan */ }
      },
      apply(songs) {
        const all = this.read();
        songs.forEach((song) => { const key = song.cacheKey; if (key && all[key] > 0) song.duration = all[key]; });
      },
    };

    /* ---- services/RecentlyPlayed.js ---- */
    /**
     * Riwayat lagu yang terakhir diputar (terbaru di depan, tanpa duplikat, maksimal HOME_RECENT_COUNT).
     * Disimpan di localStorage agar tetap ada setelah refresh.
     */
    class RecentlyPlayed {
      /** LOCAL memakai kunci lama; PRO punya riwayat sendiri. */
      static KEYS = { local: 'musik-terakhir-diputar-v1', pro: 'musik-terakhir-diputar-pro-v1' };

      #library;
      #ids;
      #key;

      constructor({ library, bus, mode = DEFAULT_MODE }) {
        this.#library = library;
        this.#key = RecentlyPlayed.KEYS[mode] ?? RecentlyPlayed.KEYS[DEFAULT_MODE];
        this.#ids = this.#read();
        bus.on(Events.PLAYER_TRACK, (song) => this.add(song));
      }

      /** Lagu yang bisa diputar dan terdaftar di pustaka dimasukkan ke posisi paling depan. */
      add(song) {
        if (!song || !song.isPlayable || this.#library.getSong(song.id) !== song) return;
        this.#ids = [song.id, ...this.#ids.filter((id) => id !== song.id)].slice(0, HOME_RECENT_COUNT);
        try { localStorage.setItem(this.#key, JSON.stringify(this.#ids)); } catch { /* storage tidak tersedia: abaikan */ }
      }

      get songs() {
        return this.#ids.map((id) => this.#library.getSong(id)).filter(Boolean);
      }

      #read() {
        try {
          const saved = JSON.parse(localStorage.getItem(this.#key));
          return Array.isArray(saved) ? saved.filter((id) => this.#library.getSong(id)).slice(0, HOME_RECENT_COUNT) : [];
        } catch { return []; }
      }
    }

    /* ---- services/DurationPrefetcher.js ---- */
    /**
     * Mengambil durasi asli semua lagu dari SoundCloud di latar belakang (tanpa memutar),
     * memakai widget tersembunyi kedua, satu lagu per giliran. Hasilnya memperbaiki durasi di daftar lagu
     * tanpa harus memutar tiap lagu lebih dulu.
     */
    class DurationPrefetcher {
      constructor({ soundCloud, songs, bus }) {
        this.sc = soundCloud;
        this.songs = songs;
        this.bus = bus;
        // READY harus didengarkan sejak widget dibuat; jika baru didengarkan nanti, event-nya sudah terlewat.
        this.ready = new Promise((resolve) => this.sc.onReady(resolve));
      }

      async start() {
        await Promise.race([this.ready, new Promise((resolve) => setTimeout(resolve, TIMING.PREFETCH_READY_MS))]);
        // ID berawalan "p" = playlist SoundCloud; durasinya baru jelas saat lagu diputar.
        // Lagu yang durasinya belum diketahui (0) diukur lebih dulu, lalu sisanya.
        /* Durasi yang sudah tersimpan di cache tidak diukur ulang di setiap kunjungan. */
        const cached = DurationCache.read();
        const queue = this.songs
          .filter((song) => song.soundCloudId && !String(song.soundCloudId).startsWith('p') && !(cached[song.soundCloudId] > 0))
          .sort((a, b) => (a.duration > 0) - (b.duration > 0));
        for (const song of queue) {
          const seconds = await this.#measure(song);
          if (seconds > 0) {
            DurationCache.save(song.soundCloudId, seconds);
            if (Math.abs(seconds - song.duration) >= 0.5) {
              song.duration = seconds;
              this.bus.emit(Events.PLAYER_DURATION, { song, seconds });
            }
          }
        }
      }

      /** Dua kali percobaan; hasil hanya dipakai jika track yang terbaca memang lagu yang diminta. */
      async #measure(song) {
        for (let attempt = 0; attempt < 2; attempt += 1) {
          const seconds = await this.#measureOnce(song);
          if (seconds > 0) return seconds;
        }
        return 0;
      }

      #measureOnce(song) {
        return new Promise((resolve) => {
          const timeout = setTimeout(() => resolve(0), TIMING.PREFETCH_TIMEOUT_MS);
          this.sc.load(song.soundCloudId, async () => {
            const sound = await this.sc.getCurrentSound();
            clearTimeout(timeout);
            const matches = sound && String(sound.id) === String(song.soundCloudId);
            resolve(matches && sound.duration > 0 ? sound.duration / 1000 : 0);
          }, false);
        });
      }
    }

    const FavoriteRow = (song, index, albumLinkable, key) =>

    const TrackList = (songs) =>
      '<div role="list"><div class="row head"><span>#</span><span>Title</span>' +

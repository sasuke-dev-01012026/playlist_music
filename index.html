      `<span class="c-al"${song.albumId != null ? ` data-go="album:${song.albumId}"` : ''}>${e(song.album.name)}</span>` +
      `<span class="c-t">${formatDuration(song.duration)}</span></div>`;

    /**
     * Baris lagu di halaman Favorites. Kolom album hanya menjadi tautan bila album itu milik halaman yang sedang
     * aktif (lagu favorit dari halaman lain tidak punya halaman album di sini). Ikon love menghapus dari Favorites.
     */
    const FavoriteRow = (song, index, albumLinkable, key) =>
      `<div class="row fav ${song.isPlayable ? '' : 'nosrc'}" role="listitem" data-play="${song.id}">` +
      `<span class="n"><b>${index + 1}</b><i class="fa-solid fa-play"></i></span>` +
      `<span class="t">${Thumb(song.cover)}<span><em>${e(song.name)}</em>` +
      `<small>${e(song.artist.name)}</small></span></span>` +
      `<span class="c-al"${albumLinkable ? ` data-go="album:${song.albumId}"` : ''}>${e(song.album.name)}</span>` +
      `<span class="c-t">${formatDuration(song.duration)}</span>` +
      `<button class="fav-btn on" data-fav="${e(String(key))}" aria-label="Hapus ${e(song.name)} dari Favorites" title="Hapus dari Favorites">` +
      `<i class="fa-solid fa-heart"></i></button></div>`;

    const TrackHead = '<div class="row head"><span>#</span><span>Title</span>' +
      '<span class="c-al">Album</span><span class="c-t"><i class="fa-regular fa-clock"></i></span></div>';

    const AudioTrackList = (songs, offset = 0) =>
      '<div role="list">' + TrackHead + songs.map((song, i) => TrackRow(song, i + offset)).join('') + '</div>';

    /** Daftar lagu di halaman Songs/Artist/Album/Genre/Search: grid video di versi Videos, tabel di versi Songs. */
    const TrackList = (songs, offset = 0) => (isVideoMode() ? VideoGrid(songs) : AudioTrackList(songs, offset));

    /** Pembungkus chip/segmen yang menempel di atas saat daftar digulir. */
    const SubBar = (html) => `<div class="subbar">${html}</div>`;

    /** Chip filter (Songs): satu pilihan aktif. */
    const Chips = (items, current, label = 'Filter lagu') =>
      `<div class="chips" role="group" aria-label="${e(label)}">` +
      items.map(({ key, label }) =>
        `<button type="button" class="chip ${key === current ? 'active' : ''}" aria-pressed="${key === current}" data-sub="${e(key)}">${e(label)}</button>`).join('') +
      '</div>';

    /**
     * Scroll tanpa batas. Template hanya merender tahap pertama (LAZY_CHUNK item) di dalam elemen [data-lazy];
     * ViewOutlet menambahkan sisanya lewat `lazy.render(potongan, indeksAwal)` saat daftar digulir.
     * `lazy.letterOf(item)` = huruf indeks A-Z untuk item itu.
     */
    function lazyTracks(songs) {
      const video = isVideoMode();
      const render = (slice, offset) => (video
        ? slice.map((song) => VideoCard(song)).join('')
        : slice.map((song, i) => TrackRow(song, offset + i)).join(''));
      const first = songs.slice(0, LAZY_CHUNK);
      const html = video
        ? `<div class="vgrid" role="list" data-lazy>${render(first, 0)}</div>`
        : `<div role="list" data-songs-list data-lazy>${TrackHead}${render(first, 0)}</div>`;
      return { html, lazy: { items: songs, render, shown: first.length, letterOf: artistLetter } };
    }

    /** Sama seperti lazyTracks, untuk grid kartu (artis, album). `nameOf(item)` menentukan huruf indeksnya. */
    function lazyCards(items, cardOf, nameOf) {
      const render = (slice) => slice.map((item) => cardOf(item)).join('');
      const first = items.slice(0, LAZY_CHUNK);
      return {
        html: `<div class="grid" data-lazy>${render(first)}</div>`,
        lazy: { items, render, shown: first.length, letterOf: (item) => initialOf(nameOf(item)) },
      };
    }

    /**
     * Rotasi alfabet (versi Videos, halaman Indonesian/International Songs): kelompok lagu menurut huruf awal nama artis
     * digeser melingkar sehingga huruf ke-`step` (A, B, C, ... lalu kembali ke A) berada di paling atas.
     * Hanya posisi kelompok yang berubah: urutan di dalam kelompok tetap, tidak ada lagu yang hilang atau ganda.
     * Artis berawalan angka/simbol ('#') berada di antara Z dan A. Huruf yang tidak punya lagu dilewati.
     */
    const AlphaRotation = { step: 0 };
    /** Huruf awal untuk indeks A-Z (aksen dibuang); selain A-Z dikelompokkan ke "#". */
    const initialOf = (name) => {
      const first = String(name).trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').charAt(0).toUpperCase();
      return first >= 'A' && first <= 'Z' ? first : '#';
    };
    const artistLetter = (song) => initialOf(song.artist.name);
    function rotateByArtistLetter(songs, step) {
      const groups = new Map();
      for (const song of songs) {
        const key = artistLetter(song);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(song);
      }
      const letters = [...groups.keys()].filter((key) => key !== '#').sort();
      if (letters.length < 2) return songs;
      const at = step % letters.length;
      const order = [...letters.slice(at), ...(groups.has('#') ? ['#'] : []), ...letters.slice(0, at)];
      return order.flatMap((key) => groups.get(key));
    }

    const EmptyResult = () => `<p class="empty">${MESSAGES.NO_RESULTS}</p>`;

    /* ################ VIEWS        ################ */

    /* ---- views/BaseView.js ---- */
    /**
     * Kelas dasar halaman. Subclass mengimplementasikan render(route) dan mengembalikan:
     *   { html: string, songs: Song[] }
     * `songs` adalah daftar lagu yang tampil di halaman; ia menjadi antrean saat pengguna menekan play.
     */
    class BaseView {
      constructor(library) {
        this.library = library;
      }

      render() {
        throw new Error(`${this.constructor.name} harus mengimplementasikan render()`);
      }

      /** Hasil standar untuk halaman tanpa daftar lagu yang bisa diputar. */
      static page(html, songs = [], extra = {}) {
        return { html, songs, ...extra };
      }
    }

    /* ---- views/ListViews.js ---- */
    /** Halaman daftar (tingkat atas): Home, Songs, Artists, Albums, Genres. */

    class HomeView extends BaseView {
      /** Rekomendasi dari seluruh koleksi. */
      #recommended = null;

      constructor(library, recent) {
        super(library);
        this.recent = recent;
      }

      /* Diacak sekali per kategori saat web dimuat: tetap sama selama berpindah halaman, berganti saat refresh. */
      #recommendedSongs() {
        if (!this.#recommended) {
          const playable = this.library.songs.filter((song) => song.isPlayable);
          this.#recommended = shuffle(playable).slice(0, HOME_RECOMMENDED_COUNT);
        }
        return this.#recommended;
      }

      render() {
        const recommended = this.#recommendedSongs();
        const recent = this.recent.songs;
        const recommendedHtml = recommended.length
          ? SongGrid(recommended)
          : `<p class="empty">${MESSAGES.NO_SONGS}</p>`;
        const recentHtml = recent.length
          ? SongGrid(recent)
          : `<p class="empty">${MESSAGES.NO_RECENT}</p>`;
        const html = Section('Recommended songs', recommendedHtml)
          + Section('Recently played', recentHtml);
        /* Antrean Home = seluruh lagu versi ini, karena Recently played bisa berisi lagu dari kedua kategori. */
        return BaseView.page(html, this.library.allSongs);
      }
    }

    /** Menu Songs: semua lagu, disaring dengan chip (Semua / Indonesia / Internasional). Daftar dirender bertahap (scroll tanpa batas). */
    class SongsView extends BaseView {
      render({ sub }) {
        const filter = SONG_FILTERS.some((item) => item.key === sub) ? sub : Route.DEFAULT_SUB.songs;
        /* Urut nama artis lalu judul; antrean putar = seluruh lagu hasil filter. */
        const sorted = filter === 'all' ? this.library.sortedSongs() : this.library.songsOfCategory(filter);
        const songs = isVideoMode() ? rotateByArtistLetter(sorted, AlphaRotation.step) : sorted;
        const head = SectionTitle('Songs') + SubBar(Chips(SONG_FILTERS, filter));
        if (!songs.length) return BaseView.page(head + `<p class="empty">${MESSAGES.NO_SONGS}</p>`, songs);
        const { html, lazy } = lazyTracks(songs);
        return BaseView.page(head + html, songs, { lazy });
      }
    }

    class ArtistsView extends BaseView {
      render() {
        const artists = this.library.sortedArtists();
        if (!artists.length) return BaseView.page(`<p class="empty">${MESSAGES.NO_ARTISTS}</p>`);
        const { html, lazy } = lazyCards(artists,
          (a) => Card({ go: `artist:${a.id}`, img: a.img, mediaHtml: ArtistCover(a), title: a.name, desc: a.bio, round: true }),
          (a) => a.name);
        return BaseView.page(html, [], { lazy });
      }
    }

    class AlbumsView extends BaseView {
      render() {
        const { html, lazy } = lazyCards(this.library.sortedAlbums(),
          (a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: `${a.yearLabel} · ${a.artist.name}` }),
          (a) => a.name);
        return BaseView.page(html, [], { lazy });
      }
    }

    class GenresView extends BaseView {
      render() {
        const tiles = this.library.sortedGenres().map((genre) => GenreTile(genre, this.library.songsOfGenre(genre.id).length));
        return BaseView.page(CardGrid(tiles.join('')));
      }
    }

    /** Menu Library: Artists / Albums / Genres dalam satu halaman, dipilih lewat segmen di atas. */
    class LibraryView extends BaseView {
      constructor(library) {
        super(library);
        this.bodies = {
          artists: new ArtistsView(library),
          albums: new AlbumsView(library),
          genres: new GenresView(library),
        };
      }

      render(route) {
        const sub = this.bodies[route.sub] ? route.sub : Route.DEFAULT_SUB.library;
        const body = this.bodies[sub].render(route);
        const head = SectionTitle('Library') + SubBar(Chips(LIBRARY_SEGMENTS, sub, 'Kategori Library'));
        return BaseView.page(head + body.html, body.songs, body.lazy ? { lazy: body.lazy } : {});
      }
    }

    /* ---- views/DetailViews.js ---- */
    /** Halaman detail: Artist, Album, Genre. Entitas tidak ditemukan -> halaman kosong. */

    class ArtistView extends BaseView {
      render({ id }) {
        const artist = this.library.getArtist(id);
        if (!artist) return BaseView.page('');
        const albums = this.library.albumsOfArtist(id);
        const songs = this.library.songsOfArtist(id);
        const albumCards = albums.map((a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: a.yearLabel }));

        const html = BackButton('artists', 'Artists')
          + Hero({
            mediaHtml: ArtistCover(artist),
            type: 'Artist',
            title: artist.name,
            metaHtml: `${e(artist.bio)} · ${albums.length} album · ${songs.length} lagu`,
            round: true,
          })
          + SectionTitle('Albums') + CardGrid(albumCards.join(''))
          + SectionTitle('Songs') + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    class AlbumView extends BaseView {
      render({ id }) {
        const album = this.library.getAlbum(id);
        if (!album) return BaseView.page('');
        const songs = this.library.songsOfAlbum(id);
        const artistLink =
          `<a data-go="artist:${album.artist.id}" style="cursor:pointer;color:#fff;font-weight:700">${e(album.artist.name)}</a>`;

        const html = BackButton('albums', 'Albums')
          + Hero({
            mediaHtml: Image(album.img),
            type: 'Album',
            title: album.name,
            metaHtml: `${artistLink} · ${album.yearLabel} · ${formatTotal(songs)}`,
          })
          + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    class GenreView extends BaseView {
      render({ id }) {
        const genre = this.library.getGenre(id);
        if (!genre) return BaseView.page('');
        const songs = this.library.songsOfGenre(id);

        const html = BackButton('genres', 'Genres')
          + Hero({ mediaHtml: GenreCover(genre), type: 'Genre', title: genre.name, metaHtml: formatTotal(songs) })
          + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    /* ---- views/SearchView.js ---- */
    class SearchView extends BaseView {
      constructor(library, searchService) {
        super(library);
        this.searchService = searchService;
      }

      render({ query }) {
        /* Pencarian hanya di versi dan kategori yang sedang dibuka. */
        const songs = this.searchService.search(query);
        const title = `Hasil untuk “${stripHtmlChars(query)}”`;
        const body = songs.length ? TrackList(songs) : EmptyResult();
        return BaseView.page(SectionTitle(title) + body, songs);
      }
    }

    /* ---- views/index.js ---- */
    /**
     * Registry halaman: nama view (Route.view) -> instance View.
     * Menambah halaman baru = membuat kelas View + mendaftarkannya di sini.
     */
    /** Halaman Favorites: lagu favorit versi aktif (kedua kategori). Antrean putar = daftar favorit ini. */
    class FavoritesView extends BaseView {
      constructor(library, favorites) {
        super(library);
        this.favorites = favorites;
      }

      render() {
        const songs = this.favorites.songs;
        if (!songs.length) {
          return BaseView.page(SectionTitle('Favorites') + `<p class="empty">${MESSAGES.NO_FAVORITES}</p>`, songs);
        }
        if (isVideoMode()) {
          return BaseView.page(SectionTitle('Favorites') + VideoGrid(songs, (song) => this.favorites.keyOf(song)), songs);
        }
        const rows = songs.map((song, i) => {
          const linkable = this.library.getAlbum(song.albumId) === song.album;
          return FavoriteRow(song, i, linkable, this.favorites.keyOf(song));
        }).join('');
        const html = SectionTitle('Favorites') +
          '<div role="list"><div class="row fav head"><span>#</span><span>Title</span>' +
          '<span class="c-al">Album</span><span class="c-t"><i class="fa-regular fa-clock"></i></span><span></span></div>' +
          rows + '</div>';
        return BaseView.page(html, songs);
      }
    }

    /** Halaman tontonan (versi Videos): pemutar ada di komponen Theater; di sini daftar "Video lainnya" di bawahnya. */
    class WatchView extends BaseView {
      render({ id }) {
        const song = this.library.getSong(id);
        if (!song || !isVideoMode()) return BaseView.page('');
        const pool = this.library.songs.filter((item) => item.isPlayable && item.id !== song.id);
        const sameArtist = pool.filter((item) => item.artistId === song.artistId);
        const sameGenre = pool.filter((item) => item.artistId !== song.artistId && item.genreId === song.genreId);
        const rest = pool.filter((item) => !sameArtist.includes(item) && !sameGenre.includes(item));
        const related = [...sameArtist, ...sameGenre, ...rest].slice(0, 12);
        const body = related.length ? VideoGrid(related) : `<p class="empty">${MESSAGES.NO_SONGS}</p>`;
        return BaseView.page(SectionTitle('Video lainnya') + body, related);
      }
    }

    function createViews(library, searchService, recent, favorites) {
      return new Map([
        ['home', new HomeView(library, recent)],
        ['songs', new SongsView(library)],
        ['library', new LibraryView(library)],
        ['favorites', new FavoritesView(library, favorites)],
        ['watch', new WatchView(library)],
        ['artist', new ArtistView(library)],
        ['album', new AlbumView(library)],
        ['genre', new GenreView(library)],
        ['search', new SearchView(library, searchService)],
      ]);
    }

    /* ################ COMPONENTS   ################ */

    /* ---- components/NavMenu.js ---- */
    /**
     * Basis menu navigasi. Dipakai oleh Sidebar (desktop/tablet) dan MobileTabs (ponsel);
     * keduanya berbagi item, klik, dan penanda menu aktif, hanya berbeda pembungkus markup.
     */
    class NavMenu extends Component {
      constructor(root, { router, bus }) {
        super(root);
        this.router = router;
        this.bus = bus;
      }

      renderItems() {
        return NAV_ITEMS.map(({ view, label, icon }) =>
          `<button class="nav-item" data-go="${view}"><i class="fa-solid ${icon}"></i><span>${label}</span></button>`
        ).join('');
      }

      bind() {
        this.listen(this.root, 'click', (event) => {
          const target = event.target.closest('[data-go]');
          if (!target) return;
          const view = target.dataset.go;
          /* Pindah dari menu lain: buka lagi detail terakhir menu ini. Klik menu yang sedang aktif: kembali ke daftarnya. */
          this.router.navigate(view, { restore: this.router.current.section !== view });
        });
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => this.highlight(route.section));
        this.highlight(this.router.current.section);
      }

      highlight(section) {
        this.$$('.nav-item').forEach((item) => item.classList.toggle('active', item.dataset.go === section));
      }
    }

    /* ---- components/Sidebar.js ---- */
    /** Menu samping (desktop & tablet). */
    class Sidebar extends NavMenu {
      render() {
        return `<nav class="side-nav" id="sideNav" aria-label="Library">${this.renderItems()}</nav>`;
      }
    }

    /* ---- components/MobileTabs.js ---- */
    /** Tab navigasi horizontal (hanya tampil di layar ponsel lewat CSS). */
    class MobileTabs extends NavMenu {
      render() {
        return this.renderItems();
      }
    }

    /* ---- components/SearchBar.js ---- */
    /** Kolom pencarian. Mengetik -> router.search(); berpindah halaman -> kolom dikosongkan. */
    class SearchBar extends Component {
      constructor(root, { router, bus }) {
        super(root);
        this.router = router;
        this.bus = bus;
      }

      render() {
        return '<i class="fa-solid fa-magnifying-glass"></i>' +
          '<input id="q" type="search" placeholder="What do you want to play?" autocomplete="off" aria-label="Cari lagu, artis, atau album">';
      }

      #timer = null;

      bind() {
        const input = this.$('#q');
        const run = () => {
          this.#timer = null;
          this.router.search(input.value.trim());
        };
        /* Ketikan digabung: hasil dirender setelah jeda singkat, bukan di setiap huruf. Mengosongkan kolom langsung berlaku. */
        this.listen(input, 'input', () => {
          clearTimeout(this.#timer);
          if (!input.value.trim()) return run();
          this.#timer = setTimeout(run, TIMING.SEARCH_DEBOUNCE_MS);
        });
        this.listen(input, 'keydown', (event) => {
          if (event.key === 'Enter' && this.#timer !== null) { clearTimeout(this.#timer); run(); }
        });
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ source }) => {
          /* Kata pencarian tidak dihapus saat pindah halaman; hanya mengikuti state router (URL, back/forward). */
          if (source !== 'search' && input.value !== this.router.query) {
            clearTimeout(this.#timer);
            this.#timer = null;
            input.value = this.router.query;
          }
        });
      }

      unmount() {
        clearTimeout(this.#timer);
        super.unmount();
      }
    }

    /* ---- components/Navbar.js ---- */
    /** Bilah atas: logo bulat (klik = pindah Songs / Videos; di halaman tontonan ponsel = kembali) dan pencarian. Komponen induk dari SearchBar. */
    class Navbar extends Component {
      constructor(root, { router, bus }) {
        super(root);
        this.router = router;
        this.bus = bus;
      }

      render() {
        return '<div class="nav-left"><button class="logo logo-toggle" id="modeToggle" type="button">' +
          '<span class="logo-icon"><i class="fa-solid"></i></span></button></div>' +
          '<label class="search" id="search"></label>' +
          '<div class="nav-right"></div>';
      }

      #backMode = false;

      /** Ikon dan keterangan logo menunjukkan versi aktif, dan versi tujuan bila diklik. Di halaman tontonan (ponsel) logo menjadi tombol kembali. */
      #syncLogo() {
        const button = this.$('#modeToggle');
        if (this.#backMode) {
          button.querySelector('i').className = 'fa-solid fa-arrow-left';
          button.title = 'Kembali';
          button.setAttribute('aria-label', 'Kembali');
          return;
        }
        const current = MODES[this.router.mode];
        const target = MODES[this.router.mode === 'music' ? 'lyric' : 'music'];
        button.querySelector('i').className = `fa-solid ${current.icon}`;
        button.title = `${current.short} (klik untuk pindah ke ${target.short})`;
        button.setAttribute('aria-label', `Versi ${current.short} aktif. Klik untuk pindah ke ${target.short}`);
      }

      bind() {
        this.search = new SearchBar(this.$('#search'), { router: this.router, bus: this.bus }).mount();
        const button = this.$('#modeToggle');
        const icon = button.querySelector('.logo-icon');
        this.listen(button, 'click', () => {
          if (this.#backMode) return this.router.back();
          icon.classList.remove('spin');
          void icon.offsetWidth; /* mulai ulang animasi */
          icon.classList.add('spin');
          this.router.switchMode(this.router.mode === 'music' ? 'lyric' : 'music');
        });
        this.subscribe(this.bus, Events.MODE_CHANGE, () => this.#syncLogo());
        this.#syncLogo();
        this.#phone = matchMedia('(max-width: 899px)');
        this.listen(this.#phone, 'change', () => this.#place(this.router.current));
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => this.#place(route));
      }

      #phone = null;

      /**
       * Di ponsel, halaman Songs memindahkan navbar ke dalam area gulir (<main>) sehingga ikut naik saat digulir,
       * sedangkan chip filter menempel di atas. Halaman lain dan desktop: navbar tetap di kerangka (tidak ikut tergulir).
       * Hasil pencarian tidak memindahkan apa pun, supaya kolom pencarian tidak kehilangan fokus saat mengetik.
       */
      #place(route) {
        const backMode = this.#phone.matches && isVideoMode() && route.view === 'watch';
        if (backMode !== this.#backMode) {
          this.#backMode = backMode;
          this.#syncLogo();
        }
        if (route.isSearch) return;
        const main = byId('main');
        const app = this.root.closest('.app') ?? main.parentElement;
        const inMain = this.#phone.matches && (route.view === 'songs' || route.view === 'library');
        if (inMain && this.root.parentElement !== main) main.prepend(this.root);
        else if (!inMain && this.root.parentElement === main) app.prepend(this.root);
        app.classList.toggle('nav-in-main', inMain);
        app.classList.toggle('sticky-lib', !this.#phone.matches && route.view === 'library');
      }

      unmount() {
        this.search?.unmount();
        super.unmount();
      }
    }

    /* ---- components/Theater.js ---- */
    /**
     * Pemutar video versi Videos. Elemen pemutar (#yt) ada di index.html dan tidak pernah dipindahkan,
     * supaya video terus berjalan saat pindah halaman:
     *  - route "watch": halaman tontonan (pemutar besar, judul, love, Up next, poster bila belum diputar);
     *  - halaman lain: pemutar mini di pojok kanan bawah (buka kembali / tutup lewat tombol di kotaknya);
     *  - di halaman tontonan, pemutar yang tergulir keluar layar juga menjadi mini.
     * Perubahan lagu (Up next, otomatis lanjut) mengganti route tontonan tanpa menambah riwayat.
     */
    class Theater extends Component {
      #watchId = null;
      #stageVisible = true;
      #signature = '';
      #posterFor = null;
      /** Urutan Up next sebelum video diputar (dari geser pegangan di mode poster): id video, dan video halaman tontonan pemiliknya. */
      #posterOrder = [];
      #posterOrderFor = null;
      #observer = null;

      constructor(root, { player, bus, router, catalog, favorites, scroller }) {
        super(root);
        this.player = player;
        this.bus = bus;
        this.router = router;
        this.catalog = catalog;
        this.favorites = favorites;
        this.scroller = scroller;
      }

      bind() {
        this.el = {
          title: this.$('#thTitle'), artist: this.$('#thArtist'), meta: this.$('#thMeta'), cover: this.$('#thCover'), side: this.$('#thSide'), dur: this.$('#thDur'), fav: this.$('#thFav'), share: this.$('#thShare'), next: this.$('#thNext'),
          stage: this.$('.theater-stage'), poster: this.$('#thPoster'), posterImg: this.$('#thPoster img'),
          back: this.$('#thBack'), open: this.$('#thOpen'), close: this.$('#thClose'),
        };
        this.listen(this.el.back, 'click', () => this.router.back());
        this.listen(this.el.fav, 'click', () => {
          const song = this.#infoSong();
          if (song) this.favorites.toggle(song);
        });
        this.listen(this.el.share, 'click', () => {
          const song = this.#infoSong();
          if (song) this.#shareLink(song);
        });
        this.listen(this.el.poster, 'click', () => {
          if (this.#watchId === null) return;
          if (this.player.queue.isCurrent(this.#watchId)) { this.player.playQueued(this.#watchId); return; }
          const all = this.catalog.library.allSongs;
          if (this.#posterOrderFor === this.#watchId && this.#posterOrder.length) {
            const byId = new Map(all.map((item) => [item.id, item]));
            const first = byId.get(this.#watchId);
            const rest = this.#posterOrder.map((id) => byId.get(id)).filter(Boolean);
            if (first) { this.player.playFrom([first, ...rest], this.#watchId); return; }
          }
          this.player.playFrom(all, this.#watchId);
        });
        this.listen(this.el.open, 'click', () => {
          const song = this.player.currentSong;
          if (song) this.router.navigate(`watch:${song.id}`);
        });
        this.listen(this.el.close, 'click', () => {
          if (this.player.state.playing) this.player.toggle();
          this.root.classList.remove('show', 'mini');
        });
        this.listen(this.el.next, 'pointerdown', (event) => {
          const handle = event.target.closest('[data-next-drag]');
          if (handle) this.#startDrag(event, handle);
        });
        this.listen(this.el.next, 'keydown', (event) => {
          const handle = event.target.closest('[data-next-drag]');
          if (!handle || (event.key !== 'ArrowUp' && event.key !== 'ArrowDown')) return;
          event.preventDefault();
          const ids = [...this.el.next.querySelectorAll('.next-item[data-next]')].map((el) => Number(el.dataset.next));
          const id = Number(handle.dataset.nextDrag);
          const from = ids.indexOf(id);
          const to = from + (event.key === 'ArrowUp' ? -1 : 1);
          if (from === -1 || to < 0 || to >= ids.length) return;
          ids.splice(to, 0, ids.splice(from, 1)[0]);
          if (this.#reorderNext(ids)) this.#refresh();
          this.el.next.querySelector(`[data-next-drag="${id}"]`)?.focus();
        });
        this.listen(this.el.next, 'click', (event) => {
          if (event.target.closest('[data-next-drag]')) return;
          const item = event.target.closest('[data-next]');
          if (item) this.#playItem(Number(item.dataset.next));
        });
        if ('IntersectionObserver' in window) {
          this.#observer = new IntersectionObserver(([entry]) => {
            this.#stageVisible = entry.isIntersecting;
            this.#applyMini();
          }, { root: this.scroller, threshold: 0 });
          this.#observer.observe(this.el.stage);
        }

        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => {
          const song = isVideoMode() && route.view === 'watch' ? this.catalog.library.getSong(route.id) : null;
          this.#watchId = song ? song.id : null;
          this.#stageVisible = true;
          this.root.classList.toggle('watching', Boolean(song));
          if (song) this.root.scrollTop = 0;
          this.#refresh();
        });
        this.subscribe(this.bus, Events.PLAYER_TRACK, (song) => {
          /* Lagu berganti saat di halaman tontonan (Up next / lanjut otomatis): halaman ikut berganti. */
          if (this.#watchId !== null && song.youTubeId && song.id !== this.#watchId) {
            this.router.navigate(`watch:${song.id}`, { replace: true });
          } else this.#refresh();
        });
        this.subscribe(this.bus, Events.PLAYER_STATE, ({ playing }) => {
          if (playing && isVideoMode() && this.player.currentSong?.youTubeId) this.root.classList.add('show');
          this.#refresh();
        });
        this.subscribe(this.bus, Events.PLAYER_RESET, () => {
          this.#watchId = null;
          this.root.classList.remove('watching');
          this.#refresh();
        });
        this.subscribe(this.bus, Events.FAVORITES_CHANGE, () => this.#refresh());
        this.subscribe(this.bus, Events.PLAYER_DURATION, ({ song, seconds }) => {
          if (this.#infoSong()?.id === song.id) this.el.dur.textContent = formatClock(seconds);
          this.el.next.querySelectorAll(`[data-dur="${song.id}"]`).forEach((cell) => { cell.textContent = formatClock(seconds); });
        });
        this.#refresh();
      }

      unmount() {
        this.#observer?.disconnect();
        super.unmount();
      }

      #watchSong() {
        return this.#watchId !== null ? this.catalog.library.getSong(this.#watchId) : null;
      }

      /** Lagu yang infonya ditampilkan: lagu halaman tontonan, atau lagu yang sedang aktif. */
      #infoSong() {
        return this.#watchSong() ?? this.player.currentSong;
      }

      #hasVideo() {
        return isVideoMode() && this.player.state.activeId !== null && Boolean(this.player.currentSong?.youTubeId);
      }

      #applyMini() {
        this.root.classList.toggle('mini', this.#hasVideo() && (this.#watchId === null || !this.#stageVisible));
      }

      #refresh() {
        const watchSong = this.#watchSong();
        const song = this.#infoSong();
        this.el.title.textContent = song ? song.name : '';
        this.el.title.title = song ? song.name : '';
        this.el.artist.textContent = song ? song.artist.name : '';
        this.el.meta.textContent = song ? song.album.name : '';
        this.#showCover(song);
        this.#showSide(song);

        const poster = Boolean(watchSong) && this.player.state.activeId !== watchSong.id;
        this.root.classList.toggle('poster', poster);
        if (poster) this.#showPoster(watchSong);
        this.#applyMini();
        this.#showNext(watchSong, poster);
      }

      /** Kolom kanan info musik: durasi dari data lagu, status Love, dan ikon Play/Pause. */
      #showSide(song) {
        this.el.side.hidden = !song;
        if (!song) return;
        this.el.dur.textContent = formatClock(song.duration);
        const fav = this.favorites.has(song);
        const favLabel = fav ? 'Hapus dari Favorites' : 'Tambah ke Favorites';
        this.el.fav.classList.toggle('on', fav);
        this.el.fav.setAttribute('aria-pressed', String(fav));
        this.el.fav.setAttribute('aria-label', favLabel);
        this.el.fav.title = favLabel;
        this.el.fav.querySelector('i').className = `fa-${fav ? 'solid' : 'regular'} fa-heart`;
      }

      /** Foto profil artis (bulat) dari lagu yang sedang ditampilkan; bila artis belum punya gambar (atau gagal dimuat): inisial nama. */
      #showCover(song) {
        const box = this.el.cover;
        box.hidden = !song;
        if (!song) return;
        const artist = song.artist;
        const key = `${artist.id}|${artist.hasImg ? artist.img : ''}`;
        if (box.dataset.artistKey === key) return;
        box.dataset.artistKey = key;
        if (!artist.hasImg) { box.innerHTML = ArtistAvatar(artist); return; }
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.alt = artist.name;
        img.onerror = () => { img.onerror = null; box.innerHTML = ArtistAvatar(artist); };
        img.src = artist.img;
        box.replaceChildren(img);
      }

      #showPoster(song) {
        if (this.#posterFor === song.id) return;
        this.#posterFor = song.id;
        const img = this.el.posterImg;
        const fallback = song.thumb ?? colorfulPlaceholder(song.album.colorId);
        img.onerror = () => { img.onerror = null; img.src = fallback; };
        img.src = song.youTubeId ? `https://i.ytimg.com/vi/${song.youTubeId}/maxresdefault.jpg` : fallback;
      }

      /** Geser (mouse / sentuh) pegangan di sebuah item Up next untuk mengubah urutan lagu berikutnya. */
      #startDrag(event, handle) {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        const items = [...this.el.next.querySelectorAll('.next-item[data-next]')];
        const dragged = handle.closest('.next-item');
        const from = items.indexOf(dragged);
        if (from === -1) return;
        event.preventDefault();
        handle.setPointerCapture?.(event.pointerId);
        const rects = items.map((el) => el.getBoundingClientRect());
        const height = rects[from].height;
        const startY = event.clientY;
        let target = from;
        dragged.classList.add('dragging');
        this.el.next.classList.add('is-dragging');

        const move = (e) => {
          const dy = e.clientY - startY;
          dragged.style.transform = `translateY(${dy}px)`;
          const center = rects[from].top + height / 2 + dy;
          target = from;
          for (let i = 0; i < items.length; i++) {
            const mid = rects[i].top + rects[i].height / 2;
            if (i < from && center < mid) { target = i; break; }
            if (i > from && center > mid) target = i;
          }
          items.forEach((el, i) => {
            if (i === from) return;
            const shift = from < target && i > from && i <= target ? -height : from > target && i >= target && i < from ? height : 0;
            el.style.transform = shift ? `translateY(${shift}px)` : '';
          });
        };
        const finish = (e) => {
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', finish);
          handle.removeEventListener('pointercancel', finish);
          handle.releasePointerCapture?.(e.pointerId);
          items.forEach((el) => { el.style.transform = ''; el.classList.remove('dragging'); });
          this.el.next.classList.remove('is-dragging');
          if (e.type === 'pointercancel' || target === from) return;
          const ids = items.map((el) => Number(el.dataset.next));
          ids.splice(target, 0, ids.splice(from, 1)[0]);
          if (this.#reorderNext(ids)) this.#refresh();
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', finish);
        handle.addEventListener('pointercancel', finish);
      }

      /** Memutar video dari daftar Up next (logika sama seperti klik pada barisnya). */
      #playItem(id) {
        const library = this.catalog.library;
        if (this.#watchId !== null && this.player.isCurrent(this.#watchId) && this.player.queue.indexOf(id) !== -1) this.player.playQueued(id);
        else this.player.playFrom(library.allSongs, id);
      }

      /** Tautan halaman tontonan sebuah video (format sama dengan URL router versi Videos). */
      #linkOf(song) {
        const hash = Route.parse(`watch:${song.id}`).toHash();
        return `${location.origin}${location.pathname}${location.search}#/lyric/${hash.slice(2)}`;
      }

      /** Membagikan link video: lembar bagikan bawaan perangkat bila ada, kalau tidak link disalin ke clipboard. */
      async #shareLink(song) {
        const url = this.#linkOf(song);
        const title = `${song.name} - ${song.artist.name}`;
        if (navigator.share) {
          try { await navigator.share({ title, url }); return; } catch (error) { if (error?.name === 'AbortError') return; }
        }
        let copied = false;
        try { await navigator.clipboard.writeText(url); copied = true; } catch {
          const box = document.createElement('textarea');
          box.value = url;
          box.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
          document.body.appendChild(box);
          box.select();
          try { copied = document.execCommand('copy'); } catch { /* abaikan */ }
          box.remove();
        }
        this.bus.emit(Events.TOAST, copied ? 'Link video disalin' : url);
      }

      /** Antrean yang dipulihkan dari penyimpanan berisi video halaman ini (belum diputar), jadi Up next ikut antrean itu. */
      #restoredQueueFor(id) {
        return id !== null && this.player.queue.isCurrent(id);
      }

      /** Menerapkan urutan baru Up next: ke antrean aktif, atau ke urutan sementara bila video belum diputar (poster). */
      #reorderNext(ids) {
        if (this.root.classList.contains('poster') && !this.#restoredQueueFor(this.#watchId)) {
          const moved = new Set(ids);
          this.#posterOrder = [...ids, ...this.#posterOrder.filter((id) => !moved.has(id))];
          return true;
        }
        return this.player.reorderUpNext(ids);
      }

      /** Up next: antrean aktif; bila video halaman ini belum diputar, urutan koleksi setelah video ini. */
      #showNext(watchSong, poster) {
        if (!watchSong) return;
        let songs;
        if (poster && this.#restoredQueueFor(watchSong.id)) songs = this.player.upNext;
        else if (poster) {
          const playable = this.catalog.library.allSongs.filter((item) => item.isPlayable);
          const at = playable.findIndex((item) => item.id === watchSong.id);
          const full = at === -1 ? playable : [...playable.slice(at + 1), ...playable.slice(0, at)];
          const byId = new Map(full.map((item) => [item.id, item]));
          const ids = this.#posterOrderFor === watchSong.id ? this.#posterOrder.filter((id) => byId.has(id)) : [];
          const seen = new Set(ids);
          for (const item of full) if (!seen.has(item.id)) ids.push(item.id);
          this.#posterOrderFor = watchSong.id;
          this.#posterOrder = ids;
          songs = ids.slice(0, 100).map((id) => byId.get(id));
        } else songs = this.player.upNext;
        const signature = `${poster ? 'p' : 'q'}:${songs.map((item) => item.id).join(',')}`;
        if (signature === this.#signature) return;
        this.#signature = signature;

        /* Pegangan selalu tampil. Sebelum video diputar (mode poster, mis. setelah browser memuat ulang halaman) urutan disimpan dulu dan dipakai saat video diputar. */
        const dragBtn = (item) =>
          `<button class="next-drag" type="button" data-next-drag="${item.id}" ` +
          `aria-label="Geser untuk mengubah urutan: ${e(item.name)}" title="Geser untuk mengubah urutan (atau tombol panah atas/bawah)"><svg class="next-drag-lines" viewBox="0 0 12 10" aria-hidden="true" focusable="false"><line x1="1" y1="2" x2="11" y2="2"/><line x1="1" y1="8" x2="11" y2="8"/></svg></button>`;
        const row = (item) => {
          const fallback = colorfulPlaceholder(item.album.colorId);
          const year = item.album.year;
          const album = `${item.album.name}${year ? ` · ${year}` : ''}`;
          return `<div class="next-item" data-next="${item.id}">` + dragBtn(item) +
            `<div class="next-thumb-box"><img class="next-thumb" ${IMG_ATTRS} loading="lazy" src="${e(item.thumb ?? fallback)}" alt="">` +
            '<span class="next-play" aria-hidden="true"><i class="fa-solid fa-play"></i></span>' +
            `<span class="next-dur" data-dur="${item.id}">${formatClock(item.duration)}</span></div>` +
            `<div class="next-text"><div class="next-title" title="${e(item.name)}">${e(item.name)}</div>` +
            `<div class="next-sub">${e(item.artist.name)}</div>` +
            `<div class="next-album" title="${e(album)}">${e(album)}</div></div></div>`;
        };
        this.el.next.innerHTML = songs.length
          ? songs.map(row).join('')
          : '<p class="next-empty">Belum ada video berikutnya.</p>';
      }
    }

    /* ---- components/Toast.js ---- */
    /** Notifikasi singkat. Tampil setiap ada event TOAST. */
    class Toast extends Component {
      #timer = null;

      constructor(root, { bus }) {
        super(root);
        this.bus = bus;
      }

      bind() {
        this.subscribe(this.bus, Events.TOAST, (message) => this.show(message));
      }

      show(message) {
        this.root.textContent = message;
        this.root.classList.add('show');
        clearTimeout(this.#timer);
        this.#timer = setTimeout(() => this.root.classList.remove('show'), TIMING.TOAST_MS);
      }
    }

    /* ---- components/ViewOutlet.js ---- */
    /**
     * Area konten utama. Memilih View berdasarkan route, menampilkan hasilnya,
     * menangani klik di dalam konten (navigasi / putar lagu), dan menyelaraskan
     * penanda "sedang diputar" dengan state player.
     *
     * root = elemen <main> (berisi tab, #view, dan footer statis dari index.html).
     */
    class ViewOutlet extends Component {
      #songs = [];
      #route = null;
      #refreshTimer = null;
      #activeEls = [];
      #syncKey = null;
      #syncRoot = null;
      #rotateTimer = null;
      #ptr = null;
      /** Daftar bertahap aktif (scroll tanpa batas): { items, render, shown, letterOf, host, first, sentinel }. */
      #lazy = null;
      #lazyObserver = null;
      #updateStuck = null;

      constructor(root, { catalog, router, player, bus, favorites }) {
        super(root);
        this.favorites = favorites;
        /** Katalog versi aktif (Playlist Music / Lyric Video); isinya diganti App saat pindah versi. */
        this.catalog = catalog;
        this.router = router;
        this.player = player;
        this.bus = bus;
        this.container = root.querySelector('#view');
        this.az = document.getElementById('az');
      }

      get views() {
        return this.catalog.views;
      }

      bind() {
        this.listen(this.container, 'click', (event) => this.#onClick(event));
        this.#bindSwipe();
        this.#rotateTimer = setInterval(() => this.#rotateAlphabet(), TIMING.ALPHA_ROTATE_MS);
        this.#bindPullToRefresh();
        this.#bindAlphaIndex();
        this.#bindStickyBar();
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => this.show(route));
        this.subscribe(this.bus, Events.PLAYER_STATE, (state) => this.#syncPlayback(state));
        this.subscribe(this.bus, Events.FAVORITES_CHANGE, () => {
          this.player.syncFavoritesQueue(this.favorites.songs);
          this.#refreshFavorites();
        });
        this.subscribe(this.bus, Events.PLAYER_DURATION, ({ song, seconds }) => {
          this.#updateDuration(song.id, seconds);
          this.#scheduleTotalsRefresh(song);
        });
      }

      /** Geser kiri/kanan untuk pindah antar halaman utama (Home, Songs, Artists, Albums, Genres). */
      #bindSwipe() {
        const MIN_DISTANCE = 60;
        const MAX_MS = 800;
        let start = null;

        /** True jika sentuhan dimulai di elemen yang bisa digulir mendatar (mis. bar tab), agar gesturnya tidak bentrok. */
        const inHorizontalScroller = (el) => {
          for (let node = el; node && node !== this.root; node = node.parentElement) {
            if (node.scrollWidth > node.clientWidth && /(auto|scroll)/.test(getComputedStyle(node).overflowX)) return true;
          }
          return false;
        };

        this.listen(this.root, 'touchstart', (event) => {
          const touch = event.touches[0];
          start = event.touches.length === 1 && !inHorizontalScroller(event.target)
            ? { x: touch.clientX, y: touch.clientY, time: Date.now() }
            : null;
        }, { passive: true });

        this.listen(this.root, 'touchend', (event) => {
          if (!start) return;
          const touch = event.changedTouches[0];
          const dx = touch.clientX - start.x;
          const dy = touch.clientY - start.y;
          const fast = Date.now() - start.time <= MAX_MS;
          start = null;
          if (!fast || Math.abs(dx) < MIN_DISTANCE || Math.abs(dx) < Math.abs(dy) * 1.5) return;

          /* Hasil pencarian dianggap berada di menu Songs, jadi tetap bisa digeser ke halaman sebelah. */
          const currentView = this.#route?.view === 'search' ? 'songs' : this.#route?.view;
          const index = NAV_ITEMS.findIndex((item) => item.view === currentView);
          if (index === -1) return; // hanya halaman utama dan hasil pencarian, bukan halaman detail
          const target = NAV_ITEMS[index + (dx < 0 ? 1 : -1)];
          if (target) this.router.navigate(target.view);
        }, { passive: true });

        this.listen(this.root, 'touchcancel', () => { start = null; }, { passive: true });
      }

      show(route) {
        const view = this.views.get(route.view);
        const rendered = view.render(route);
        /* Detail yang tidak ditemukan (id salah / milik versi lain): tampilkan pesan, bukan halaman kosong. */
        const html = rendered.html
          || BackButton('home', 'Home') + '<p class="empty">Halaman tidak ditemukan.</p>';
        this.#route = route;
        this.#draw({ ...rendered, html }, 0);
      }

      /** Menggambar hasil render ke halaman, menyiapkan scroll tanpa batas + indeks A-Z, lalu memulihkan posisi gulir. */
      #draw({ html, songs, lazy }, top) {
        this.container.innerHTML = html;
        this.#songs = songs;
        this.#setupLazy(lazy);
        this.root.scrollTo({ top, behavior: 'instant' });
        this.#syncPlayback(this.player.state);
        this.#updateStuck?.();
      }

      /**
       * Menandai (kelas bar-stuck di .app) saat chip filter Songs sedang menempel di atas layar, supaya CSS memberinya
       * background kaca hanya saat itu. Dicek tiap frame gulir; ambang 2px agar kaca sudah aktif sebelum konten lewat di bawahnya.
       */
      #bindStickyBar() {
        const app = this.root.closest('.app');
        if (!app) return;
        let queued = false;
        const update = () => {
          queued = false;
          const bar = this.container.querySelector('.subbar');
          let stuck = false;
          if (bar && (app.classList.contains('nav-in-main') || app.classList.contains('sticky-lib'))) {
            const offset = parseFloat(getComputedStyle(bar).top) || 0;
            stuck = bar.getBoundingClientRect().top <= this.root.getBoundingClientRect().top + offset + 2;
          }
          app.classList.toggle('bar-stuck', stuck);
        };
        this.#updateStuck = update;
        this.listen(this.root, 'scroll', () => {
          if (!queued) { queued = true; requestAnimationFrame(update); }
        }, { passive: true });
      }

      unmount() {
        clearInterval(this.#rotateTimer);
        this.#lazyObserver?.disconnect();
        this.#ptr?.remove();
        super.unmount();
      }

      /**
       * Tarik dari paling atas halaman (layar sentuh) lalu lepas: indikator berputar dan web dimuat ulang.
       * Dibuat sendiri karena area gulir ada di dalam <main> (body overflow: hidden), sehingga tarik-untuk-muat-ulang
       * bawaan browser tidak berjalan. Tidak aktif di halaman tontonan, daftar yang bisa digulir, dan pegangan geser.
       */
      #bindPullToRefresh() {
        const THRESHOLD = 64;
        const indicator = document.createElement('div');
        indicator.className = 'ptr';
        indicator.setAttribute('aria-hidden', 'true');
        indicator.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
        document.body.appendChild(indicator);
        this.#ptr = indicator;
        const icon = indicator.firstElementChild;

        let startX = null;
        let startY = null;
        let pull = 0;
        let busy = false;

        const show = (px) => {
          indicator.style.transform = `translate(-50%, ${px - 52}px)`;
          indicator.style.opacity = String(Math.min(1, px / THRESHOLD));
          icon.style.transform = `rotate(${px * 4}deg)`;
        };
        const hide = () => {
          indicator.classList.remove('pulling');
          indicator.style.transform = '';
          indicator.style.opacity = '';
          icon.style.transform = '';
        };

        this.listen(this.root, 'touchstart', (event) => {
          startY = null;
          if (busy || event.touches.length !== 1 || this.root.scrollTop > 0) return;
          if (event.target.closest('.theater.watching, .next-drag, .pager, input, textarea')) return;
          startX = event.touches[0].clientX;
          startY = event.touches[0].clientY;
          pull = 0;
        }, { passive: true });

        this.listen(this.root, 'touchmove', (event) => {
          if (startY === null) return;
          const touch = event.touches[0];
          const dy = touch.clientY - startY;
          if (this.root.scrollTop > 0 || dy <= 0 || Math.abs(touch.clientX - startX) > dy) {
            pull = 0;
            hide();
            return;
          }
          pull = Math.min(dy * 0.5, 90);
          indicator.classList.add('pulling');
          show(pull);
        }, { passive: true });

        const release = () => {
          if (startY === null) return;
          startY = null;
          if (pull >= THRESHOLD) {
            busy = true;
            hide();
            indicator.classList.add('loading');
            setTimeout(() => location.reload(), 400);
          } else hide();
          pull = 0;
        };
        this.listen(this.root, 'touchend', release, { passive: true });
        this.listen(this.root, 'touchcancel', release, { passive: true });
      }

      /**
       * Versi Videos: tiap interval, urutan kelompok artis di Songs bergeser satu huruf.
       * Daftar digambar ulang hanya bila sedang berada di paling atas, supaya tidak mengganggu pengguna yang sedang menggulir
       * atau memakai indeks A-Z; indeks tetap melompat ke kelompok huruf yang diminta.
       */
      #rotateAlphabet() {
        if (document.hidden || !isVideoMode()) return;
        AlphaRotation.step += 1;
        if (this.#route?.view !== 'songs' || this.root.scrollTop > 40) return;
        this.#draw(this.views.get('songs').render(this.#route), 0);
      }

      /** Daftar Favorites digambar ulang di tempat (tanpa lompat ke atas) saat ada lagu ditambah/dihapus. */
      #refreshFavorites() {
        if (this.#route?.view !== 'favorites') return;
        this.#draw(this.views.get('favorites').render(this.#route), this.root.scrollTop);
      }

      #onClick(event) {
        const favTarget = event.target.closest('[data-fav]');
        if (favTarget) {
          const song = this.#songs.find((item) => String(this.favorites.keyOf(item)) === favTarget.dataset.fav);
          if (song) this.favorites.toggle(song);
          return;
        }

        const subTarget = event.target.closest('[data-sub]');
        if (subTarget) return this.router.setSub(subTarget.dataset.sub);

        const goTarget = event.target.closest('[data-go]');
        if (goTarget) return this.router.navigate(goTarget.dataset.go);

        const playTarget = event.target.closest('[data-play]');
        if (!playTarget) return;
        const songId = Number(playTarget.dataset.play);
        if (isVideoMode()) return this.#openVideo(songId);
        if (this.player.isCurrent(songId)) {
          if (this.#route?.isSearch) this.player.rebindQueue(this.#songs);
          this.player.toggle();
        } else this.player.playFrom(this.#songs, songId, this.#route?.view === 'favorites' ? 'favorites' : null);
      }

      /**
       * Versi Videos: klik kartu video memutar videonya dan membuka halaman tontonannya.
       * Bila sudah berada di halaman tontonan, Theater yang memindahkan halamannya (ganti, bukan menumpuk riwayat).
       */
      #openVideo(songId) {
        const song = this.catalog.library.getSong(songId);
        if (!this.player.isCurrent(songId)) {
          this.player.playFrom(this.#songs, songId, this.#route?.view === 'favorites' ? 'favorites' : null);
        } else if (this.#route?.isSearch) this.player.rebindQueue(this.#songs);
        if (song?.isPlayable && this.#route?.view !== 'watch') this.router.navigate(`watch:${songId}`);
      }

      /* ---------- Scroll tanpa batas + indeks A-Z ---------- */

      /** Menyiapkan daftar bertahap bila view menyediakan `lazy`; selain itu indeks huruf disembunyikan. */
      #setupLazy(lazy) {
        this.#lazyObserver?.disconnect();
        this.#lazyObserver = null;
        this.#lazy = null;
        const host = lazy ? this.container.querySelector('[data-lazy]') : null;
        if (!lazy || !host) return this.#showIndex(null);
        const first = new Map();
        lazy.items.forEach((item, i) => {
          const letter = lazy.letterOf(item);
          if (!first.has(letter)) first.set(letter, i);
        });
        this.#lazy = { ...lazy, host, first, sentinel: null };
        if (lazy.shown < lazy.items.length) this.#addSentinel();
        this.#showIndex(first);
      }

      #addSentinel() {
        const lz = this.#lazy;
        const sentinel = document.createElement('div');
        sentinel.className = 'more';
        sentinel.setAttribute('aria-hidden', 'true');
        lz.host.after(sentinel);
        lz.sentinel = sentinel;
        if (!('IntersectionObserver' in window)) return this.#more(Infinity);
        this.#lazyObserver = new IntersectionObserver((entries) => {
          if (entries.some((entry) => entry.isIntersecting)) this.#more();
        }, { root: this.root, rootMargin: '0px 0px 800px 0px' });
        this.#lazyObserver.observe(sentinel);
      }

      /** Menambahkan `count` item berikutnya ke daftar; sentinel dihapus bila semua sudah tampil. */
      #more(count = LAZY_CHUNK) {
        const lz = this.#lazy;
        if (!lz) return;
        const start = lz.shown;
        const end = Math.min(lz.items.length, start + count);
        if (end <= start) return;
        lz.host.insertAdjacentHTML('beforeend', lz.render(lz.items.slice(start, end), start));
        lz.shown = end;
        this.#syncKey = null; /* paksa penanda "sedang diputar" dihitung ulang untuk item baru */
        this.#syncPlayback(this.player.state);
        if (end >= lz.items.length) {
          this.#lazyObserver?.disconnect();
          this.#lazyObserver = null;
          lz.sentinel?.remove();
          lz.sentinel = null;
        } else if (this.#lazyObserver && lz.sentinel) {
          /* Sentinel bergeser turun; amati ulang agar tahap berikutnya dimuat bila masih dekat layar. */
          this.#lazyObserver.unobserve(lz.sentinel);
          this.#lazyObserver.observe(lz.sentinel);
        }
      }

      /** Tampilkan indeks A-Z hanya untuk daftar dengan cukup banyak huruf. */
      #showIndex(first) {
        const show = Boolean(first) && first.size >= 3;
        this.root.classList.toggle('has-az', show);
        if (!this.az) return;
        this.az.hidden = !show;
        this.az.innerHTML = show
          ? LETTER_PAGES.map((letter) => `<span data-az="${letter}"${first.has(letter) ? '' : ' class="off"'}>${letter}</span>`).join('')
          : '';
      }

      /** Ketuk atau geser jari di indeks: lompat ke lagu/artis/album pertama dengan huruf itu. */
      #bindAlphaIndex() {
        const az = this.az;
        if (!az) return;
        let active = false;
        let last = null;
        const clear = () => az.querySelectorAll('.on').forEach((el) => el.classList.remove('on'));
        const pick = (event) => {
          const letters = az.children;
          if (!letters.length) return;
          const rect = az.getBoundingClientRect();
          const i = Math.min(letters.length - 1, Math.max(0, Math.floor(((event.clientY - rect.top) / rect.height) * letters.length)));
          const el = letters[i];
          if (el.dataset.az === last) return;
          last = el.dataset.az;
          clear();
          if (!this.#lazy?.first.has(last)) return;
          el.classList.add('on');
          this.#jumpTo(last);
        };
        const end = (event) => {
          if (!active) return;
          active = false;
          last = null;
          az.releasePointerCapture?.(event.pointerId);
          clear();
        };
        this.listen(az, 'pointerdown', (event) => {
          active = true;
          last = null;
          az.setPointerCapture?.(event.pointerId);
          event.preventDefault();
          pick(event);
        });
        this.listen(az, 'pointermove', (event) => { if (active) pick(event); });
        this.listen(az, 'pointerup', end);
        this.listen(az, 'pointercancel', end);
      }

      /** Merender daftar sampai item pertama berhuruf `letter`, lalu menggulir ke sana. */
      #jumpTo(letter) {
        const lz = this.#lazy;
        const index = lz?.first.get(letter);
        if (index === undefined) return;
        if (index >= lz.shown) this.#more(index - lz.shown + 1);
        const items = [...lz.host.children].filter((child) => !child.classList.contains('head'));
        items[index]?.scrollIntoView({ block: 'start', behavior: 'instant' });
      }

      /** Hanya elemen yang sebelumnya aktif dan yang kini aktif yang disentuh (bukan seluruh daftar). */
      #syncPlayback({ activeId, playing }) {
        const key = `${activeId}|${playing}`;
        if (key === this.#syncKey && this.#syncRoot === this.container.firstElementChild) return;
        this.#syncKey = key;
        this.#syncRoot = this.container.firstElementChild;
        const paint = (el, active) => {
          el.classList.toggle('playing', active);
          const icon = el.querySelector('i');
          if (icon) icon.className = `fa-solid ${active && playing ? 'fa-pause' : 'fa-play'}`;
        };
        for (const el of this.#activeEls) if (el.isConnected) paint(el, false);
        this.#activeEls = activeId === null ? [] : [...this.container.querySelectorAll(`[data-play="${activeId}"]`)];
        for (const el of this.#activeEls) paint(el, true);
      }

      /** Total durasi di header (album/genre) dihitung dari durasi lagu; segarkan setelah durasi baru masuk. */
      #scheduleTotalsRefresh(song) {
        const hero = this.container.querySelector('.hero p');
        if (!hero || !this.#route || !hero.textContent.includes(' dtk') || !this.#songs.includes(song)) return;
        clearTimeout(this.#refreshTimer);
        this.#refreshTimer = setTimeout(() => {
          const view = this.views.get(this.#route.view);
          const { html } = view.render(this.#route);
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const fresh = doc.querySelector('.hero p');
          const current = this.container.querySelector('.hero p');
          if (fresh && current) current.innerHTML = fresh.innerHTML;
        }, TIMING.REFRESH_DEBOUNCE_MS);
      }

      #updateDuration(songId, seconds) {
        this.container.querySelectorAll(`[data-play="${songId}"] .c-t, [data-play="${songId}"] .vdur`)
          .forEach((cell) => { cell.textContent = formatTime(seconds); cell.hidden = false; });
      }
    }

    /* ---- components/PlayerBar.js ---- */
    /** Bilah pemutar di bagian bawah: info lagu, kontrol, progres, dan volume. */
    class PlayerBar extends Component {
      constructor(root, { player, bus, favorites }) {
        super(root);
        this.player = player;
        this.bus = bus;
        this.favorites = favorites;
      }

      render() {
        return `
          <div class="now">
            <img referrerpolicy="no-referrer" id="nowImg" src="" alt="">
            <span class="now-ico" aria-hidden="true"><i class="fa-solid fa-music"></i></span>
            <div class="now-text">
              <div class="now-title" id="nowTitle"></div>
              <div class="now-desc" id="nowDesc"></div>
            </div>
            <button class="fav-btn" id="nowFav" aria-label="Tambah ke Favorites" title="Tambah ke Favorites"><i class="fa-regular fa-heart"></i></button>
          </div>
          <div class="controls">
            <div class="btns">
              <button class="ctl" id="shuffle" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
              <button class="ctl" id="backward" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
              <button class="ctl" id="play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
              <button class="ctl" id="forward" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
              <button class="ctl" id="repeat" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="seek">
              <span class="time" id="cur">0:00</span>
              <input type="range" id="progressBar" min="0" max="100" step="0.1" value="0" aria-label="Progress">
              <span class="time" id="dur">--:--</span>
            </div>
          </div>
          <div class="extra">
            <a class="sc-credit" href="https://soundcloud.com" target="_blank" rel="noopener">via SoundCloud / YouTube</a>
            <i class="fa-solid fa-volume-high" id="volIcon"></i>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          </div>`;
      }

      bind() {
        this.el = {
          img: this.$('#nowImg'), title: this.$('#nowTitle'), desc: this.$('#nowDesc'), fav: this.$('#nowFav'),
          play: this.$('#play'), shuffle: this.$('#shuffle'), repeat: this.$('#repeat'),
          progress: this.$('#progressBar'), cur: this.$('#cur'), dur: this.$('#dur'),
          vol: this.$('#vol'), volIcon: this.$('#volIcon'),
        };

        this.listen(this.el.play, 'click', () => this.player.toggle());
        this.listen(this.el.fav, 'click', () => {
          const song = this.player.currentSong;
          if (song) this.favorites.toggle(song);
        });
        this.subscribe(this.bus, Events.FAVORITES_CHANGE, () => this.#showFavorite(this.player.currentSong));
        this.listen(this.$('#forward'), 'click', () => this.player.step(1));
        this.listen(this.$('#backward'), 'click', () => this.player.step(-1));
        this.listen(this.el.shuffle, 'click', () => this.player.toggleShuffle());
        this.listen(this.el.repeat, 'click', () => this.player.toggleRepeat());
        this.listen(this.el.progress, 'input', () => {
          paintRange(this.el.progress, this.el.progress.value);
          this.player.seekToPercent(Number(this.el.progress.value));
        });
        this.listen(this.el.vol, 'input', () => this.#applyVolume(Number(this.el.vol.value)));
        this.listen(this.el.volIcon, 'click', () => {
          /* Bisukan lalu nyalakan lagi: kembali ke volume sebelumnya, bukan selalu 100%. */
          if (this.player.volume) this.lastVolume = this.player.volume;
          const next = this.player.volume ? 0 : (this.lastVolume || 1);
          this.el.vol.value = next;
          this.#applyVolume(next);
        });

        this.subscribe(this.bus, Events.PLAYER_TRACK, (song) => this.#showTrack(song));
        this.subscribe(this.bus, Events.PLAYER_STATE, (state) => this.#showState(state));
        this.subscribe(this.bus, Events.PLAYER_RESET, ({ song, state }) => {
          this.#showTrack(song);
          this.#showState(state);
          this.#showProgress({ percent: 0, seconds: 0 });
        });
        this.subscribe(this.bus, Events.PLAYER_PROGRESS, (p) => this.#showProgress(p));
        this.subscribe(this.bus, Events.PLAYER_DURATION, ({ song, seconds }) => {
          if (song.id === this.player.currentSong?.id) this.el.dur.textContent = formatTime(seconds);
        });

        this.#showTrack(this.player.currentSong);
        this.#showState(this.player.state);
        this.el.vol.value = this.player.volume;
        this.#applyVolume(this.player.volume);
      }

      /** Ikon love: default abu-abu; pink + terisi bila lagu yang tampil sudah difavoritkan. */
      #showFavorite(song) {
        const on = this.favorites.has(song);
        this.el.fav.classList.toggle('on', on);
        this.el.fav.disabled = !song;
        this.el.fav.querySelector('i').className = `fa-${on ? 'solid' : 'regular'} fa-heart`;
        const label = on ? 'Hapus dari Favorites' : 'Tambah ke Favorites';
        this.el.fav.setAttribute('aria-label', label);
        this.el.fav.setAttribute('aria-pressed', String(on));
        this.el.fav.title = label;
      }

      #showTrack(song) {
        this.#showFavorite(song);
        if (!song) {
          this.el.img.src = placeholderImg();
          this.el.title.textContent = '';
          this.el.desc.textContent = '';
          this.el.dur.textContent = '--:--';
          return;
        }
        this.el.img.src = song.cover;
        this.el.title.textContent = song.name;
        this.el.desc.textContent = `${song.artist.name} · ${song.album.name}`;
        this.el.dur.textContent = formatDuration(song.duration);
      }

      /* Ubah ke false bila bar ingin tetap tampil saat musik dijeda. */
      static HIDE_WHEN_STOPPED = true;
      #hideTimer = null;

      #toggleVisibility(playing) {
        clearTimeout(this.#hideTimer);
        if (!PlayerBar.HIDE_WHEN_STOPPED || playing) {
          this.root.hidden = false;
          return;
        }
        /* Tunda sebentar agar jeda singkat antar-lagu tidak membuat bar berkedip. */
        this.#hideTimer = setTimeout(() => {
          this.root.hidden = true;
          this.root.classList.remove('open');
        }, 500);
      }

      #showState({ playing, shuffle, repeat }) {
        this.#toggleVisibility(playing);
        this.el.play.firstElementChild.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'}`;
        this.el.shuffle.classList.toggle('active', shuffle);
        this.el.repeat.classList.toggle('active', repeat);
      }

      #curText = '';

      #showProgress({ percent, seconds }) {
        this.el.progress.value = percent;
        paintRange(this.el.progress, percent);
        const text = formatTime(seconds);
        if (text !== this.#curText) {
          this.#curText = text;
          this.el.cur.textContent = text;
        }
      }

      #applyVolume(volume) {
        this.player.setVolume(volume);
        paintRange(this.el.vol, volume * 100);
        const icon = volume === 0 ? 'fa-volume-xmark' : volume < 0.5 ? 'fa-volume-low' : 'fa-volume-high';
        this.el.volIcon.className = `fa-solid ${icon}`;
      }
    }

    /* ---- components/KeyboardShortcuts.js ---- */
    /** Spasi = play/pause, kecuali fokus sedang berada di input atau tombol. */
    class KeyboardShortcuts extends Component {
      constructor(root, { player }) {
        super(root);
        this.player = player;
      }

      bind() {
        this.listen(this.root, 'keydown', (event) => {
          if (event.code !== 'Space' || /INPUT|BUTTON/.test(document.activeElement.tagName)) return;
          event.preventDefault();
          this.player.toggle();
        });
      }
    }

    /* ################ APP          ################ */

    /* ---- App.js ---- */
    /**
     * Composition root: satu-satunya tempat yang membuat objek dan menyambungkan dependensinya
     * (dependency injection manual). Kelas lain hanya menerima apa yang mereka butuhkan lewat constructor.
     */
    class App {
      /** Katalog per versi ('music' / 'lyric'). Masing-masing punya pustaka, pencarian, riwayat, dan tampilan sendiri. */
      #catalogs = new Map();

      start() {
        const bus = new EventBus();
        AppStorage.mode = Router.initialMode();
        const router = new Router(bus);
        const favorites = new FavoritesStore({ bus });

        /* Katalog versi aktif: ViewOutlet membaca isinya, jadi cukup diganti isinya saat pindah versi. */
        const catalog = {};
        this.#bus = bus;
        this.#favorites = favorites;
        this.#ensure(AppStorage.mode);
        this.#activate(catalog, AppStorage.mode, favorites);

        const player = new PlayerController({
          soundCloud: new HybridPlayer(new SoundCloudPlayer(byId('sc')), new YouTubePlayer(byId('yt'))),
          bus,
          songs: catalog.library.allSongs,
        });

        /* Pindah versi: ganti katalog + antrean pemutar. Router lalu menampilkan halaman tujuan (ROUTE_CHANGE). */
        bus.on(Events.MODE_CHANGE, ({ mode }) => {
          this.#ensure(mode);
          this.#activate(catalog, mode, favorites);
          player.switchLibrary(catalog.library.allSongs);
        });
        const deps = { router, bus };
        this.components = [
          new Navbar(byId('navbar'), deps),
          new Sidebar(byId('sidebar'), deps),
          new MobileTabs(byId('tabs'), deps),
          new ViewOutlet(byId('main'), { catalog, router, player, bus, favorites }),
          new PlayerBar(byId('player'), { player, bus, favorites }),
          new Theater(byId('theater'), { player, bus, router, catalog, favorites, scroller: byId('theater') }),
          new Toast(byId('toast'), { bus }),
          new KeyboardShortcuts(document, { player }),
        ];
        this.components.forEach((component) => component.mount());

        router.start();

        /* Versi satunya dibangun setelah tampilan awal selesai, supaya tidak menunda render pertama. */
        const idle = window.requestIdleCallback ? (fn) => window.requestIdleCallback(fn, { timeout: 3000 }) : (fn) => setTimeout(fn, 200);
        idle(() => Object.keys(MODES).forEach((mode) => this.#ensure(mode)));
      }

      #bus = null;
      #favorites = null;

      /** Membangun katalog versi `mode` bila belum ada. Konstanta global (warna, glyph) dikembalikan ke versi aktif sesudahnya. */
      #ensure(mode) {
        if (this.#catalogs.has(mode)) return;
        this.#build(mode, this.#bus, this.#favorites, mode === DEFAULT_MODE ? 0 : 1);
        COLORS = MUSIC_DATA[AppStorage.mode].colors;
        placeholderMode = AppStorage.mode;
      }

      /** Membuat katalog satu versi (pustaka, pencarian, riwayat, tampilan) dan mendaftarkan lagunya ke Favorites. */
      #build(mode, bus, favorites, order) {
        COLORS = MUSIC_DATA[mode].colors;
        placeholderMode = mode;
        const library = new MusicLibrary(MUSIC_DATA[mode]);
        DurationCache.apply(library.allSongs);
        favorites.register(library, mode);
        const searchService = new SearchService(library);
        const recent = new RecentlyPlayed({ library, bus, mode });
        const views = createViews(library, searchService, recent, favorites);
        this.#catalogs.set(mode, { mode, library, searchService, recent, views });
        setTimeout(() => this.#prefetchDurations(library, bus), order * 2000);
      }

      /** Mengaktifkan versi `mode`: menyalin katalognya ke `catalog`, memulihkan kategori, dan memasang tema warna. */
      #activate(catalog, mode, favorites) {
        COLORS = MUSIC_DATA[mode].colors;
        placeholderMode = mode;
        Object.assign(catalog, this.#catalogs.get(mode));
        favorites.setMode(mode);
        document.documentElement.dataset.mode = mode;
      }

      /** Widget SoundCloud kedua (tersembunyi, tanpa suara) khusus untuk membaca durasi asli lagu. */
      #prefetchDurations(library, bus) {
        const songs = library.allSongs.filter((song) => song.soundCloudId);
        if (!songs.length) return; /* versi Lyric Video tidak memakai SoundCloud */
        const probe = document.createElement('iframe');
        probe.title = 'SoundCloud duration probe';
        probe.setAttribute('aria-hidden', 'true');
        probe.style.cssText = 'position:fixed;right:0;bottom:0;width:300px;height:166px;border:0;opacity:0;pointer-events:none;z-index:-1';
        probe.src = byId('sc').src;
        document.body.appendChild(probe);
        const probePlayer = new SoundCloudPlayer(probe);
        if (!probePlayer.available) return probe.remove();
        const prefetcher = new DurationPrefetcher({ soundCloud: probePlayer, songs, bus });
        setTimeout(() => prefetcher.start(), TIMING.PREFETCH_START_MS);
      }
    }

    /* ---- main.js ---- */
    new App().start();

  </script>
</body>

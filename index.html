<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlayList Music</title>

  <!-- Font & ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Design tokens, reset, dan gaya global */

    :root {
      --bg: #000;
      --panel: #121212;
      --card: #181818;
      --card-h: #262626;
      --chip: #1f1f1f;
      --text: #fff;
      --muted: #b3b3b3;
      --purple: #7C3AED;
      --purple-h: #9061F9;
      --gap: 8px;
      --nav-h: 64px;
      --player-h: 84px;
      --side-w: 300px;
      --r: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Montserrat", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
    }

    /* Layout grid aplikasi (app shell) */

    .app {
      height: 100dvh;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
      grid-template-areas: "nav nav" "side main" "player player";
    }

    .nav {
      grid-area: nav;
    }

    .side {
      grid-area: side;
    }

    .main {
      grid-area: main;
    }

    .player-bar {
      grid-area: player;
    }

    /* Komponen Navbar: logo + pencarian */

    .nav {
      display: grid;
      grid-template-columns: 1fr minmax(0, 1.2fr) 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 8px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--purple);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: .2s;
    }

    .logo-icon i {
      margin-left: 2px;
    }

    .logo:hover .logo-icon {
      background: var(--purple-h);
      transform: scale(1.06);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--chip);
      border: 2px solid transparent;
      color: var(--muted);
      transition: .2s;
    }

    .search:hover {
      background: #2a2a2a;
    }

    .search:focus-within {
      border-color: #fff;
      color: #fff;
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: #fff;
      font: 500 .95rem "Montserrat", sans-serif;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 12px;
      font-weight: 600;
      font-size: .9rem;
      color: var(--muted);
      white-space: nowrap;
      transition: .15s;
    }

    .nav-link:hover {
      color: #fff;
      transform: scale(1.04);
    }

    .divider {
      width: 1px;
      height: 28px;
      background: #555;
      margin: 0 12px;
    }

    /* Komponen Sidebar */

    .side {
      background: var(--panel);
      border-radius: var(--r);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px 20px;
      font-weight: 700;
      color: var(--muted);
    }

    .side-head .add {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .side-head .add:hover {
      background: #2a2a2a;
      color: #fff;
    }

    .side-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .promo {
      background: var(--chip);
      border-radius: var(--r);
      padding: 20px;
    }

    .promo h4 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .promo p {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .promo button {
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: .85rem;
      padding: 8px 18px;
      border-radius: 999px;
      transition: .2s;
    }

    .promo button:hover {
      transform: scale(1.04);
    }

    /* Item navigasi (sidebar & tabs mobile) */

    .side-nav {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 700;
      font-size: .95rem;
      text-align: left;
      transition: .15s;
    }

    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .nav-item:hover {
      color: #fff;
    }

    .nav-item.active {
      color: #fff;
      background: #2a2a2a;
    }

    .tabs {
      display: none;
      gap: 9px;
      overflow-x: auto;
      padding: 12px 0 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs .nav-item {
      width: auto;
      flex: none;
      padding: 8px 16px;
      gap: 8px;
      font-size: .85rem;
      background: var(--chip);
      border-radius: 999px;
    }

    .tabs .nav-item.active {
      background: #fff;
      color: #000;
    }

    /* Area konten utama: section, grid, hero, tile genre */

    .main {
      background: linear-gradient(180deg, #2a2a2a 0, var(--panel) 280px);
      border-radius: var(--r);
      overflow-y: auto;
      padding: 8px 24px 32px;
      scroll-behavior: smooth;
    }

    .main::-webkit-scrollbar,
    .side-list::-webkit-scrollbar {
      width: 10px;
    }

    .main::-webkit-scrollbar-thumb,
    .side-list::-webkit-scrollbar-thumb {
      background: #ffffff33;
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .section {
      margin-top: 24px;
    }

    .section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -.01em;
    }

    .guide {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .guide-card {
      background: var(--card);
      border-radius: 8px;
      padding: 16px 18px;
    }

    .guide-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .guide-card ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.55;
    }

    .guide-card li+li {
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .empty {
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
      display: none;
    }

    .back {
      color: var(--muted);
      font-weight: 600;
      font-size: .85rem;
      margin-top: 16px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .back:hover {
      color: #fff;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 16px 0 8px;
    }

    .hero>img,
    .hero>.gen {
      width: clamp(110px, 18vw, 200px);
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 8px 24px #00000080;
    }

    .hero.round>img {
      border-radius: 50%;
    }

    .hero .gen {
      display: grid;
      place-items: center;
      font-size: 3rem;
    }

    .hero small {
      text-transform: uppercase;
      font-size: .72rem;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 5vw, 3.4rem);
      line-height: 1.1;
      margin: 6px 0 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: .9rem;
    }

    .gtile {
      aspect-ratio: 1.6;
      border-radius: 10px;
      padding: 16px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s;
    }

    .gtile:hover {
      transform: scale(1.03);
    }

    .gtile small {
      font-size: .75rem;
      font-weight: 600;
      opacity: .85;
    }

    .sub {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .credit {
      margin-top: 40px;
      padding: 20px 0 4px;
      border-top: 1px solid #ffffff1a;
      text-align: center;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .credit i {
      color: #e8115b;
      margin: 0 2px;
    }

    /* Komponen Card & Cover */

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
      position: relative;
      cursor: pointer;
      transition: background .25s;
      min-width: 0;
    }

    .card:hover,
    .card.playing {
      background: var(--card-h);
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #333;
      box-shadow: 0 8px 24px #00000080;
      margin-bottom: 14px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--purple);
      color: #000;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      box-shadow: 0 8px 8px #0000004d;
      opacity: 0;
      transform: translateY(8px);
      transition: .25s;
    }

    .card:hover .card-play,
    .card.playing .card-play,
    .card-play:focus-visible {
      opacity: 1;
      transform: none;
    }

    .card-play:hover {
      background: var(--purple-h);
      transform: scale(1.06);
    }

    .card-title {
      font-weight: 700;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card.playing .card-title {
      color: var(--purple);
    }

    .card-desc {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.round .cover {
      border-radius: 50%;
    }

    .card.round .card-title,
    .card.round .card-desc {
      text-align: center;
    }

    /* Komponen daftar lagu (track list) */

    .row {
      display: grid;
      grid-template-columns: 40px minmax(0, 3fr) minmax(0, 2fr) 56px;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: .88rem;
    }

    .row.head {
      border-bottom: 1px solid #ffffff1a;
      border-radius: 0;
      cursor: default;
      font-size: .72rem;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .row:not(.head):hover {
      background: #ffffff1a;
    }

    .n {
      text-align: center;
    }

    .n i {
      display: none;
      color: #fff;
    }

    .row:hover .n b,
    .row.playing .n b {
      display: none;
    }

    .row:hover .n i,
    .row.playing .n i {
      display: inline;
    }

    .t {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .t img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex: none;
      object-fit: cover;
    }

    .t>span {
      min-width: 0;
    }

    .t em {
      display: block;
      font-style: normal;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row.playing .t em {
      color: var(--purple);
    }

    .t small {
      display: block;
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-al:hover {
      text-decoration: underline;
      color: #fff;
    }

    .c-al {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-t {
      text-align: right;
    }

    .nosrc {
      opacity: .5;
    }

    /* Komponen Player Bar */

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      background: #000;
    }

    .now {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .now img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: #333;
    }

    .now-text {
      min-width: 0;
    }

    .now-title {
      font-weight: 600;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-desc {
      font-size: .75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 640px;
      width: 100%;
      justify-self: center;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctl {
      color: var(--muted);
      font-size: 1rem;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      position: relative;
      transition: .15s;
    }

    .ctl:hover {
      color: #fff;
      transform: scale(1.08);
    }

    .ctl.active {
      color: var(--purple);
    }

    .ctl.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--purple);
    }

    #play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 1rem;
    }

    #play:hover {
      transform: scale(1.07);
    }

    .seek {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time {
      font-size: .72rem;
      color: var(--muted);
      min-width: 38px;
      font-variant-numeric: tabular-nums;
    }

    .time:first-child {
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      outline: 0;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      background: linear-gradient(to right, #fff var(--p, 0%), #4d4d4d var(--p, 0%));
    }

    input[type=range]:hover {
      background: linear-gradient(to right, var(--purple) var(--p, 0%), #4d4d4d var(--p, 0%));
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: .15s;
    }

    input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
    }

    input[type=range]:hover::-webkit-slider-thumb,
    input[type=range]:focus-visible::-webkit-slider-thumb {
      opacity: 1;
    }

    .extra {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
    }

    .extra input {
      max-width: 110px;
    }

    .sc-credit {
      font-size: .7rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    .sc-credit:hover {
      color: #ff5500;
    }

    /* Komponen Toast */

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--player-h) + 24px);
      transform: translateX(-50%) translateY(10px);
      background: #fff;
      color: #000;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .85rem;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 20;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* Komponen Pagination & filter huruf artis */

    .pager-info {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      margin-top: 24px;
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 10px 0 8px;
    }

    .pager button,
    .letters button {
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-weight: 700;
      font-size: .82rem;
      transition: .15s;
    }

    .pager button:hover:not(:disabled):not(.active),
    .letters button:hover:not(:disabled):not(.active) {
      background: #2a2a2a;
      color: #fff;
    }

    .pager button.active {
      background: var(--purple);
      color: #fff;
    }

    .letters button.active {
      background: var(--purple);
      color: #fff;
    }

    .pager button:disabled,
    .letters button:disabled {
      opacity: .3;
      cursor: default;
    }

    .pager .gap {
      color: var(--muted);
      padding: 0 2px;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 28px 0 8px;
    }

    /* Media queries (tablet, mobile, layar besar, reduced motion) */

    @media (max-width:720px) {
      .tabs {
        display: flex;
      }

      .row {
        grid-template-columns: 28px minmax(0, 1fr) 44px;
        gap: 8px;
        padding: 8px 4px;
      }

      .c-al {
        display: none;
      }

      .hero {
        gap: 14px;
      }
    }

    @media (max-width:1100px) {
      :root {
        --side-w: 84px;
      }

      .nav-item {
        justify-content: center;
        padding: 14px 0;
      }

      .nav-item span {
        display: none;
      }

      .nav {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .nav-link,
      .divider {
        display: none;
      }

      .extra input {
        display: none;
      }
    }

    @media (max-width:720px) {
      :root {
        --nav-h: 56px;
        --player-h: 132px;
      }

      body {
        font-size: 15px;
      }

      .app {
        padding: 0;
        gap: 0;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
        grid-template-areas: "nav" "main" "player";
        padding-top: env(safe-area-inset-top);
      }

      .side,
      .nav-right .nav-link,
      .nav-right .divider,
      .extra {
        display: none;
      }

      .nav {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 0 12px;
      }

      .logo {

    /**
     * Fisher-Yates shuffle, O(n), menghasilkan salinan baru (array asli tidak berubah).
     * Distribusi acak seragam, tidak seperti `sort(() => Math.random() - .5)`.
     */
    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Membangun Map key -> item untuk pencarian O(1). */
    function indexBy(items, keyOf) {
      const index = new Map();
      for (const item of items) index.set(keyOf(item), item);
      return index;
    }

    /** Mengelompokkan item per key dalam satu kali lintasan O(n); urutan asli tiap grup dipertahankan. */
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

        /** Durasi dalam detik; diperbarui dengan durasi asli dari SoundCloud saat lagu diputar. */
        this.duration = dur;

        this.soundCloudId = sc;
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.album = null;
        this.genre = null;
        this.searchText = '';

        return this.album.artistId;

        return Boolean(this.soundCloudId);

      buildSearchText() {
        this.searchText = (this.name + this.artist.name + this.album.name).toLowerCase();

        return this.searchText.includes(query);

    /* ---- core/EventBus.js ---- */
    /** Pola Observer: komponen dan service saling berkomunikasi tanpa saling mengenal. */
    class EventBus {
      #listeners = new Map();

      /** Mendaftarkan handler. Mengembalikan fungsi untuk berhenti berlangganan. */
      on(event, handler) {
        if (!this.#listeners.has(event)) this.#listeners.set(event, new Set());
        this.#listeners.get(event).add(handler);
        return () => this.off(event, handler);
      }

      off(event, handler) {
        this.#listeners.get(event)?.delete(handler);
      }

      emit(event, payload) {
        this.#listeners.get(event)?.forEach((handler) => handler(payload));
      }
    }

    /* ---- core/Component.js ---- */
    /**
     * Kelas dasar komponen UI.
     *
     * Siklus hidup:  constructor(root) -> mount() -> [render() -> bind()] -> unmount()
     *  - render(): mengembalikan markup HTML (string). Kembalikan null jika markup sudah ada di halaman.
     *  - bind():   menautkan event DOM dan langganan EventBus. Gunakan listen()/subscribe()
     *              agar semuanya otomatis dibersihkan saat unmount().
     */
    class Component {
      #cleanups = [];

      constructor(root) {
        if (!root) throw new Error(`${this.constructor.name}: elemen root tidak ditemukan`);
        this.root = root;
      }

      render() {
        return null;
      }

      bind() {}

      mount() {
        const markup = this.render();
        if (markup !== null) this.root.innerHTML = markup;
        this.bind();
        return this;
      }

      unmount() {
        this.#cleanups.forEach((cleanup) => cleanup());
        this.#cleanups = [];
      }

      /** Mencari elemen di dalam root komponen. */
      $(selector) {
        return this.root.querySelector(selector);
      }

      $$(selector) {
        return this.root.querySelectorAll(selector);
      }

      listen(target, type, handler, options) {
        target.addEventListener(type, handler, options);
        this.#cleanups.push(() => target.removeEventListener(type, handler, options));
      }

      subscribe(bus, event, handler) {
        this.#cleanups.push(bus.on(event, handler));
      }
    }

    /* ---- core/Router.js ---- */
    /** Value object: halaman mana yang sedang ditampilkan. Token berbentuk "view" atau "view:id". */
    class Route {
      constructor(view, id = null, query = '', page = 1, letter = '') {
        this.view = view;
        this.id = id;
        this.query = query;
        /** Nomor halaman pagination (mulai dari 1). */
        this.page = page;
        /** Filter huruf artis ('' = semua). */
        this.letter = letter;
      }

      static parse(token) {
        const [view, id] = token.split(':');
        return new Route(view, id ? Number(id) : null);
      }

      static search(query) {
        return new Route('search', null, query);
      }

      /** Halaman utama (daftar) yang valid, dan halaman detail yang wajib punya ID. */
      static #LISTS = new Set(NAV_ITEMS.map((item) => item.view));
      static #DETAILS = new Set(['artist', 'album', 'genre', 'playlist']);

      /**
       * URL hash -> Route. Bentuk: #/home, #/artists?huruf=A, #/artist/5, #/search/kata.
       * Hash tidak dikenal / rusak menghasilkan null (pemanggil memilih halaman cadangan).
       */
      static fromHash(hash) {
        try {
          const raw = String(hash ?? '').replace(/^#\/?/, '');
          if (!raw) return null;
          const [path, qs = ''] = raw.split('?');
          const [view, ...rest] = path.split('/');
          if (view === 'search') {
            const query = decodeURIComponent(rest.join('/')).trim();
            return query ? Route.search(query) : null;
          }
          if (Route.#DETAILS.has(view)) {
            const id = Number(rest[0]);
            return Number.isInteger(id) && id > 0 ? new Route(view, id) : null;
          }
          if (Route.#LISTS.has(view)) {
            const letter = (new URLSearchParams(qs).get('huruf') || '').toUpperCase();
            return new Route(view, null, '', 1, /^([A-Z]|#)$/.test(letter) ? letter : '');
          }
        } catch { /* hash rusak: abaikan */ }
        return null;
      }

      /** Route -> URL hash (kebalikan dari fromHash). */
      toHash() {
        if (this.view === 'search') return `#/search/${encodeURIComponent(this.query)}`;
        if (this.id !== null) return `#/${this.view}/${this.id}`;
        return `#/${this.view}${this.letter ? `?huruf=${encodeURIComponent(this.letter)}` : ''}`;
      }

      /** Halaman daftar tingkat atas (punya filter huruf), bukan detail atau pencarian. */
      get isList() {
        return this.id === null && this.view !== 'search';
      }

      /** Menu utama yang harus tampil aktif untuk halaman ini. */
      get section() {
        return SECTION_OF_VIEW[this.view] ?? this.view;
      }
    }

    /**
     * Router berbasis URL hash (#/songs, #/artist/5, #/search/kata) sehingga bekerja juga saat file dibuka
     * langsung (file://). Tombol back/forward browser, refresh, dan link yang dibagikan membuka halaman yang sama.
     * Halaman terakhir (selain pencarian) diingat di localStorage untuk kunjungan tanpa hash.
     * Mengingat halaman terakhir yang dibuka lewat navigasi supaya mengosongkan kolom pencarian
     * bisa kembali ke halaman tersebut.
     */
    class Router {
      #current = new Route('home');
      #lastPage = this.#current;
      #hash = '';
      /** Kata pencarian aktif; bertahan saat pindah halaman sampai pengguna menghapusnya. */
      #query = '';
      /** Huruf pagination terakhir per halaman daftar, mis. { artists: 'G' }; dipulihkan saat halaman dibuka lagi. */
      #letters = {};
      /** Halaman detail terakhir per menu, mis. { artists: 'artist:2' }; dipulihkan saat menu itu dibuka lagi dari navigasi. */
      #details = {};

      constructor(bus) {
        this.bus = bus;
        window.addEventListener('popstate', () => this.#onPopState());
      }

      get current() {
        return this.#current;
      }

      get query() {
        return this.#query;
      }

      /**
       * @param {string} token  "view" atau "view:id"
       * @param {{restore?: boolean}} [options]  restore=true (klik menu utama): bila menu itu punya detail
       *        yang terakhir dibuka (mis. artist Avenged Sevenfold), buka lagi detail tersebut, bukan daftarnya.
       */
      navigate(token, { restore = false } = {}) {
        let target = Route.parse(token);
        if (target.isList) {
          const saved = restore ? this.#details[target.view] : null;
          /* Tombol "kembali" ke daftar (restore=false) menghapus ingatan detail. */
          if (saved) target = Route.parse(saved);
          else {
            delete this.#details[target.view];
            AppStorage.update({ details: this.#details });
            target = this.#withSavedLetter(target);
          }
        }
        this.#rememberDetail(target);
        this.#lastPage = target;
        /* Kembali ke Songs saat masih ada kata pencarian: tampilkan lagi hasil pencariannya. */
        this.#current = target.view === 'songs' && this.#query ? Route.search(this.#query) : target;
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'navigate' });
      }

      /** Query kosong = kembali ke halaman terakhir. */
      search(query) {
        const wasSearch = this.#current.view === 'search';
        this.#query = query;
        AppStorage.update({ query });
        /* Kolom dikosongkan saat berada di halaman lain (bukan hasil pencarian): halaman tidak perlu dimuat ulang. */
        if (!query && !wasSearch) return;
        this.#current = query ? Route.search(query) : this.#lastPage;
        /* Mengetik terus tidak menambah riwayat: entri pencarian diganti, bukan ditumpuk. */
        this.#writeUrl(wasSearch);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'search' });
      }

      /** Pindah ke halaman huruf (A, B, C, ...) pada tampilan daftar yang sedang dibuka. */
      setLetter(letter) {
        const r = this.#current;
        this.#current = new Route(r.view, r.id, r.query, 1, letter);
        this.#lastPage = this.#current;
        this.#rememberLetter(r.view, letter);
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'page' });
      }

      /** Memicu render awal: dari URL, lalu halaman terakhir di localStorage, lalu Home. */
      start() {
        const saved = AppStorage.read();
        if (saved.letters && typeof saved.letters === 'object') {
          for (const [view, letter] of Object.entries(saved.letters)) {
            if (/^([A-Z]|#)$/.test(letter)) this.#letters[view] = letter;
          }
        }
        if (saved.details && typeof saved.details === 'object') {
          for (const [view, token] of Object.entries(saved.details)) {
            const r = typeof token === 'string' ? Route.parse(token) : null;
            if (r && r.id > 0 && Number.isInteger(r.id) && r.section === view) this.#details[view] = token;
          }
        }
        let route = this.#withSavedLetter(Route.fromHash(location.hash)
          ?? Route.fromHash(saved.route)
          ?? new Route('home'));
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        this.#query = route.view === 'search' ? route.query : (typeof saved.query === 'string' ? saved.query : '');
        this.#lastPage = route.view === 'search' ? new Route('home') : route;
        if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#writeUrl(true);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'start' });
      }

      #rememberLetter(view, letter) {
        if (view === 'search') return;
        if (letter) this.#letters[view] = letter;
        else delete this.#letters[view];
        AppStorage.update({ letters: this.#letters });
      }

      /** Mengingat detail yang sedang dibuka (artist/album/genre/playlist) untuk menu induknya. */
      #rememberDetail(route) {
        if (route.id === null || route.view === 'search') return;
        this.#details[route.section] = `${route.view}:${route.id}`;
        AppStorage.update({ details: this.#details });
      }

      /** Halaman daftar tanpa huruf dibuka lagi: pakai huruf terakhir yang dipilih di halaman itu. */
      #withSavedLetter(route) {
        const letter = this.#letters[route.view];
        return route.isList && !route.letter && letter ? new Route(route.view, null, '', 1, letter) : route;
      }

      /** Back/forward browser atau hash diubah manual di address bar. */
      #onPopState() {
        const hash = location.hash;
        if (hash === this.#hash) return;
        let route = Route.fromHash(hash) ?? new Route('home');
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        if (route.view === 'search') this.#query = route.query;
        else {
          this.#lastPage = route;
          if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        }
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#hash = route.toHash();
        AppStorage.update({ route: this.#lastPage.toHash() });
        this.bus.emit(Events.ROUTE_CHANGE, { route, source: 'popstate' });
      }

      #writeUrl(replace) {
        const hash = this.#current.toHash();
        AppStorage.update({ route: this.#lastPage.toHash() });
        if (hash === this.#hash && !replace) return;
        this.#hash = hash;
        try {
          history[replace ? 'replaceState' : 'pushState'](null, '', hash);
        } catch {
          location.hash = hash; /* cadangan bila History API ditolak */
        }
      }
    }

    /* ################ SERVICES     ################ */

    /* ---- services/MusicLibrary.js ---- */
    /**
     * Repository katalog musik.
     *
     * Struktur data:
     *  - Map<id, entity>        -> pencarian entitas O(1) (menggantikan Array.find yang O(n))
     *  - Map<key, entity[]>     -> indeks relasi (lagu per album/artis/genre, album per artis),
     *                              dibangun sekali O(n) lalu dibaca O(1)
     *  - cache hasil sort       -> daftar terurut dihitung sekali, dipakai ulang
     */
    class MusicLibrary {
      #artistById;
      #albumById;
      #genreById;
      #songById;
      #playlistById;
      #songsByAlbum;
      #songsByGenre;
      #songsByArtist;
      #albumsByArtist;
      #sorted = new Map();

      constructor({ artists, genres, albums, songs, playlists }) {
        this.artists = artists.map((row) => new Artist(row));
        this.genres = genres.map((row) => new Genre(row));
        this.albums = albums.map((row) => new Album(row));
        this.songs = songs.map((row) => new Song(row));
        this.playlists = playlists.map((row) => new Playlist(row));

        this.#artistById = indexBy(this.artists, (a) => a.id);
        this.#albumById = indexBy(this.albums, (a) => a.id);
        this.#genreById = indexBy(this.genres, (g) => g.id);
        this.#songById = indexBy(this.songs, (s) => s.id);
        this.#playlistById = indexBy(this.playlists, (p) => p.id);

        this.#linkRelations();

        this.#songsByAlbum = groupBy(this.songs, (s) => s.albumId);
        this.#songsByGenre = groupBy(this.songs, (s) => s.genreId);
        this.#songsByArtist = groupBy(this.songs, (s) => s.artistId);
        this.#albumsByArtist = groupBy(this.albums, (a) => a.artistId);
      }

      /** Menghubungkan objek antar-entitas (song -> album -> artist, song -> genre, playlist -> songs). */
      #linkRelations() {
        for (const album of this.albums) {
          album.artist = this.#artistById.get(album.artistId);
          album.artist.albums.push(album);
        }
        for (const song of this.songs) {
          song.album = this.#albumById.get(song.albumId);
          song.genre = this.#genreById.get(song.genreId);
          song.album.songs.push(song);
          song.artist.songs.push(song);
          song.genre.songs.push(song);
          song.buildSearchText();
        }
        for (const playlist of this.playlists) {
          const listed = playlist.songIds.map((id) => this.#songById.get(id)).filter(Boolean);
          playlist.songs = listed.length ? listed : this.#playlistTrack(playlist);
        }
      }

      /**
       * Playlist tanpa daftar lagu (songIds kosong) tetapi punya ID SoundCloud sendiri diputar sebagai satu trek.
       * Bila lagu dengan ID SoundCloud yang sama sudah ada di pustaka, lagu itu dipakai; jika tidak, dibuat trek
       * khusus (tidak masuk daftar lagu/pencarian) dengan id negatif agar tidak bentrok dengan id lagu.
       */
      #playlistTrack(playlist) {
        if (!playlist.soundCloudId) return [];
        const existing = this.songs.find((s) => s.soundCloudId === playlist.soundCloudId);
        if (existing) return [existing];

        const track = new Song({
          id: -playlist.id, name: playlist.name, albumId: playlist.albumId,
          genreId: null, dur: playlist.duration, sc: playlist.soundCloudId,
        });
        const artist = this.#artistById.get(playlist.artistId)
          ?? new Artist({ id: null, name: 'Berbagai Artis', bio: '', img: null });
        track.album = this.#albumById.get(playlist.albumId)
          ?? Object.assign(new Album({ id: null, name: playlist.name, artistId: playlist.artistId, year: null, colorId: null }), { artist });
        return [track];
      }

      /* ---------- Lookup O(1) ---------- */
      getSong(id) { return this.#songById.get(id); }
      getArtist(id) { return this.#artistById.get(id); }
      getAlbum(id) { return this.#albumById.get(id); }
      getGenre(id) { return this.#genreById.get(id); }
      getPlaylist(id) { return this.#playlistById.get(id); }

      /* ---------- Relasi ---------- */
      songsOfAlbum(albumId) { return this.#songsByAlbum.get(albumId) ?? []; }
      songsOfGenre(genreId) { return this.#songsByGenre.get(genreId) ?? []; }

      albumsOfArtist(artistId) {
        return [...(this.#albumsByArtist.get(artistId) ?? [])].sort((a, b) => a.year - b.year);
      }

      /** Lagu artis, diurutkan menurut tahun album lalu urutan id. */
      songsOfArtist(artistId) {
        return [...(this.#songsByArtist.get(artistId) ?? [])]
          .sort((a, b) => a.album.year - b.album.year || a.id - b.id);
      }

      /* ---------- Daftar terurut (di-cache) ---------- */
      #memoSort(key, build) {
        if (!this.#sorted.has(key)) this.#sorted.set(key, build());
        return this.#sorted.get(key);
      }

      sortedSongs() {
        return this.#memoSort('songs', () => [...this.songs].sort(
          (a, b) => compareText(a.artist.name, b.artist.name) || compareText(a.name, b.name)));
      }

      sortedArtists() {
        return this.#memoSort('artists', () => [...this.artists].sort((a, b) => compareText(a.name, b.name)));
      }

      sortedAlbums() {
        return this.#memoSort('albums', () => [...this.albums].sort(
          (a, b) => compareText(a.name, b.name) || compareText(a.artist.name, b.artist.name) || a.year - b.year));
      }

      sortedGenres() {
        return this.#memoSort('genres', () => [...this.genres].sort((a, b) => compareText(a.name, b.name)));
      }
    }

    /* ---- services/SearchService.js ---- */
    /**
     * Pencarian lagu berdasarkan judul + artis + album.
     * Teks pencarian setiap lagu sudah dihitung sekali (Song.searchText),
     * sehingga tiap ketikan hanya satu lintasan O(n) tanpa membangun string ulang.
     */
    class SearchService {
      constructor(library) {
        this.library = library;
      }

      /** @param {string} rawQuery teks mentah dari input */
      search(rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        if (!query) return [];
        return this.library.songs.filter((song) => song.matches(query));
      }
    }

    /* ---- services/PlayQueue.js ---- */
    /**
     * Antrean putar.
     *
     *  - #source   : daftar asal (urutan tampilan di halaman)
     *  - #order    : urutan putar aktual (sama dengan source, atau hasil Fisher-Yates jika shuffle)
     *  - #cursor   : indeks lagu yang sedang aktif di #order
     *  - #position : Map<songId, indeks> untuk mencari posisi lagu O(1)
     *
     * Navigasi next/previous bersifat melingkar (circular buffer) dan melewati lagu yang belum
     * punya sumber SoundCloud.
     */
    class PlayQueue {
      #source = [];
      #order = [];
      #position = new Map();
      #cursor = 0;
      #shuffled = false;

      constructor(songs) {
        this.load(songs);
      }

      get current() {
        return this.#order[this.#cursor];
      }

      get cursor() {
        return this.#cursor;
      }

      get size() {
        return this.#order.length;
      }

      get isShuffled() {
        return this.#shuffled;
      }

      /** Mengganti antrean dengan `songs`. Jika startId diberikan, kursor diarahkan ke lagu itu. */
      load(songs, startId = null) {
        this.#source = songs;
        this.#rebuildOrder();
        if (startId !== null) this.#cursor = this.indexOf(startId);
        return this;
      }

      setShuffle(enabled) {
        const currentId = this.current?.id;
        this.#shuffled = enabled;
        this.#rebuildOrder();
        if (currentId !== undefined) this.#cursor = this.indexOf(currentId);
      }

      indexOf(songId) {
        return this.#position.get(songId) ?? -1;
      }

      isCurrent(songId) {
        return this.current?.id === songId;
      }

      jumpTo(index) {
        this.#cursor = index;
        return this.current;
      }

      /**
       * Indeks lagu berikutnya (direction = 1) atau sebelumnya (-1) yang bisa diputar,
       * dengan wrap-around. Mengembalikan -1 bila tidak ada satu pun yang bisa diputar.
       */
      findPlayable(direction) {
        const n = this.#order.length;
        for (let step = 1; step <= n; step++) {
          const index = (((this.#cursor + direction * step) % n) + n) % n;
          if (this.#order[index].isPlayable) return index;
        }
        return -1;
      }

      #rebuildOrder() {
        this.#order = this.#shuffled ? shuffle(this.#source) : [...this.#source];
        this.#position = new Map(this.#order.map((song, index) => [song.id, index]));
        this.#cursor = Math.min(this.#cursor, Math.max(this.#order.length - 1, 0));
      }
    }

    /* ---- services/SoundCloudPlayer.js ---- */
    /**
     * Adapter untuk SoundCloud Widget API (satu-satunya sumber audio aplikasi).
     * Seluruh pengetahuan tentang `SC.Widget` dikurung di kelas ini; bagian lain aplikasi
     * hanya berbicara lewat method sederhana (play, pause, load, ...).
     */
    class SoundCloudPlayer {
      #widget;
      #events;

      /**
       * @param {HTMLIFrameElement} iframe iframe tersembunyi berisi widget SoundCloud
       * @param {object} sc objek global `SC` dari https://w.soundcloud.com/player/api.js
       */
      constructor(iframe, sc = window.SC) {
        if (!sc) throw new Error('SoundCloud Widget API belum dimuat');
        this.#widget = sc.Widget(iframe);
        this.#events = sc.Widget.Events;
      }

      /** Track biasa diberi ID angka; ID berawalan "p" menandakan playlist SoundCloud. */
      static urlFor(id) {
        const value = String(id);
        return value.startsWith('p')
          ? `https://api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A${value.slice(1)}`
          : `https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A${value}`;
      }

      load(id, onReady, autoPlay = true) {
        this.#widget.load(SoundCloudPlayer.urlFor(id), {
          auto_play: autoPlay,
          show_teaser: false,
          callback: onReady,
        });
      }

      play() { this.#widget.play(); }
      pause() { this.#widget.pause(); }
      seekTo(milliseconds) { this.#widget.seekTo(milliseconds); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) { this.#widget.setVolume(fraction * 100); }

      /** @returns {Promise<number>} durasi track dalam milidetik */
      getDuration() {
        return new Promise((resolve) => this.#widget.getDuration(resolve));
      }

      onReady(handler) { this.#widget.bind(this.#events.READY, handler); }

      /** @returns {Promise<object|null>} data track yang sedang dimuat widget (id, duration dalam ms, ...) */
      getCurrentSound() {
        return new Promise((resolve) => this.#widget.getCurrentSound((sound) => resolve(sound)));
      }

      onPlay(handler) { this.#widget.bind(this.#events.PLAY, handler); }
      onPause(handler) { this.#widget.bind(this.#events.PAUSE, handler); }
      onFinish(handler) { this.#widget.bind(this.#events.FINISH, handler); }

      /** handler menerima { percent: 0..100, seconds } */
      onProgress(handler) {
        this.#widget.bind(this.#events.PLAY_PROGRESS, (e) =>
          handler({ percent: e.relativePosition * 100, seconds: e.currentPosition / 1000 }));
      }
    }

    /* ---- services/PlayerController.js ---- */
    /**
     * Pengendali pemutaran: menggabungkan PlayQueue (apa yang diputar) dengan SoundCloudPlayer
     * (bagaimana diputar), lalu mengabarkan perubahan lewat EventBus.
     * Kelas ini tidak menyentuh DOM sama sekali.
     */
    class PlayerController {
      #started = false;
      #playing = false;
      #repeat = false;
      #volume = DEFAULT_VOLUME;
      #loadedSongId = null;
      #nudgeTimer = null;
      #warningTimer = null;

      /**
       * @param {object} deps
       * @param {import('./SoundCloudPlayer.js').SoundCloudPlayer} deps.soundCloud
       * @param {import('../core/EventBus.js').EventBus} deps.bus
       * @param {import('../models/Song.js').Song[]} deps.songs antrean awal
       */
      constructor({ soundCloud, bus, songs }) {
        this.sc = soundCloud;
        this.bus = bus;
        this.queue = new PlayQueue(songs);
        this.#restoreSaved();
        this.#listenToSoundCloud();
      }

      /** Memulihkan volume, shuffle/repeat, dan lagu terakhir dari localStorage (belum diputar otomatis). */
      #restoreSaved() {
        const saved = AppStorage.read();
        if (typeof saved.volume === 'number' && saved.volume >= 0 && saved.volume <= 1) this.#volume = saved.volume;
        if (saved.shuffle === true) this.queue.setShuffle(true);
        else if (saved.repeat === true) this.#repeat = true;
        const index = this.queue.indexOf(saved.songId);
        if (index !== -1) this.queue.jumpTo(index);
      }

      #persist() {
        AppStorage.update({
          volume: this.#volume,
          songId: this.queue.current?.id,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        });
      }

      get currentSong() { return this.queue.current; }
      get volume() { return this.#volume; }

      /** True jika lagu ini sudah dimulai dan sedang menjadi lagu aktif. */
      isCurrent(songId) {
        return this.#started && this.queue.isCurrent(songId);
      }

      get state() {
        return {
          activeId: this.#started ? this.queue.current.id : null,
          playing: this.#playing,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        };
      }

      /* ---------- Perintah dari UI ---------- */

      playFrom(songs, songId) {
        this.queue.load(songs, songId);
        this.#playAt(this.queue.indexOf(songId));
      }

      toggle() {
        this.#started = true;
        const song = this.queue.current;
        if (!song.isPlayable) {
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }
        // Lagu yang tampil di player belum pernah dimuat -> muat dulu, jangan hanya menekan play.
        if (this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
        if (this.#playing) this.sc.pause();
        else this.sc.play();
      }

      /** direction: 1 = berikutnya, -1 = sebelumnya. Repeat hanya berlaku saat maju. */
      step(direction) {
        if (this.#repeat && direction > 0) {
          this.sc.seekTo(0);
          this.sc.play();
          return;
        }
        const index = this.queue.findPlayable(direction);
        if (index === -1) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#playAt(index);
      }

      toggleShuffle() {
        this.queue.setShuffle(!this.queue.isShuffled);
        if (this.queue.isShuffled) this.#repeat = false;
        this.#persist();
        this.#emitState();
      }

      toggleRepeat() {
        this.#repeat = !this.#repeat;
        if (this.#repeat) this.queue.setShuffle(false);
        this.#persist();
        this.#emitState();
      }

      async seekToPercent(percent) {
        const duration = await this.sc.getDuration();
        this.sc.seekTo((percent / 100) * duration);
      }

      setVolume(fraction) {
        this.#volume = fraction;
        this.sc.setVolume(fraction);
        this.#persist();
      }

      /* ---------- Internal ---------- */

      #playAt(index) {
        const song = this.queue.jumpTo(index);
        this.#started = true;
        this.#persist();
        this.bus.emit(Events.PLAYER_TRACK, song);
        this.bus.emit(Events.PLAYER_PROGRESS, { percent: 0, seconds: 0 });

        if (!song.isPlayable) {
          this.#playing = false;
          this.sc.pause();
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }

        this.#playing = true;
        this.#loadedSongId = song.id;
        this.#emitState();
        this.sc.load(song.soundCloudId, () => {
          this.sc.setVolume(this.#volume);
          this.sc.play();
        });
        this.#watchStart(song);
      }

      /** Beberapa browser menolak autoplay: coba sekali lagi, lalu beri petunjuk ke pengguna. */
      #watchStart(song) {
        const stalled = () => this.queue.current === song && !this.#playing;
        clearTimeout(this.#nudgeTimer);
        this.#nudgeTimer = setTimeout(() => stalled() && this.sc.play(), TIMING.PLAY_NUDGE_MS);
        clearTimeout(this.#warningTimer);
        this.#warningTimer = setTimeout(() => {
          if (!stalled()) return;
          this.#emitState();
          this.#toast(MESSAGES.NOT_STARTED);
        }, TIMING.PLAY_WARNING_MS);
      }

      #listenToSoundCloud() {
        this.sc.onPlay(() => {
          this.#playing = true;
          this.#emitState();
          this.sc.setVolume(this.#volume);
          this.#syncDuration();
        });
        this.sc.onPause(() => {
          this.#playing = false;
          this.#emitState();
        });
        this.sc.onFinish(() => {
          this.#playing = false;
          this.step(1);
        });
        this.sc.onProgress((progress) => this.bus.emit(Events.PLAYER_PROGRESS, progress));
      }

      /**
       * Memperbarui durasi lagu aktif dengan durasi asli dari SoundCloud.
       * Data track diverifikasi (id harus cocok) agar event dari lagu sebelumnya tidak menimpa durasi lagu baru.
       */
      async #syncDuration() {
        const song = this.queue.current;
        const sound = await this.sc.getCurrentSound();
        if (!sound || !song || this.queue.current !== song) return;
        const isPlaylist = String(song.soundCloudId).startsWith('p');
        if (!isPlaylist && sound.id !== undefined && String(sound.id) !== String(song.soundCloudId)) return;
        if (!(sound.duration > 0)) return;
        song.duration = sound.duration / 1000;
        DurationCache.save(song.soundCloudId, song.duration);
        this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
      }

      #emitState() {
        this.bus.emit(Events.PLAYER_STATE, this.state);
      }

      #toast(message) {
        this.bus.emit(Events.TOAST, message);
      }
    }

    /* ---- services/AppStorage.js ---- */
    /** Pengaturan pengguna di localStorage: halaman terakhir, volume, lagu terakhir, shuffle, repeat. */
    const AppStorage = {
      KEY: 'musik-pengaturan-v1',
      read() {
        try {
          const value = JSON.parse(localStorage.getItem(this.KEY));
          return value && typeof value === 'object' ? value : {};
        } catch { return {}; }
      },
      update(patch) {
        try { localStorage.setItem(this.KEY, JSON.stringify({ ...this.read(), ...patch })); } catch { /* storage tidak tersedia: abaikan */ }
      },
    };

    /* ---- services/DurationCache.js ---- */
    /** Menyimpan durasi asli dari SoundCloud di browser (localStorage), per ID track SoundCloud, supaya kunjungan berikutnya langsung tepat. */
    const DurationCache = {
      KEY: 'musik-durasi-soundcloud-v4',
      read() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch { return {}; }
      },
      save(soundCloudId, seconds) {
        try {
          const all = this.read();
          all[soundCloudId] = seconds;
          localStorage.setItem(this.KEY, JSON.stringify(all));
        } catch { /* storage tidak tersedia: abaikan */ }
      },
      apply(songs) {
        const all = this.read();
        songs.forEach((song) => { if (all[song.soundCloudId] > 0) song.duration = all[song.soundCloudId]; });
      },
    };

    /* ---- services/RecentlyPlayed.js ---- */
    /**
     * Riwayat lagu yang terakhir diputar (terbaru di depan, tanpa duplikat, maksimal HOME_RECENT_COUNT).
     * Disimpan di localStorage agar tetap ada setelah refresh.
     */
    class RecentlyPlayed {
      static KEY = 'musik-terakhir-diputar-v1';

      #library;
      #ids;

      constructor({ library, bus }) {
        this.#library = library;
        this.#ids = this.#read();
        bus.on(Events.PLAYER_TRACK, (song) => this.add(song));
      }

      /** Lagu yang bisa diputar dan terdaftar di pustaka dimasukkan ke posisi paling depan. */
      add(song) {
        if (!song || !song.isPlayable || !this.#library.getSong(song.id)) return;
        this.#ids = [song.id, ...this.#ids.filter((id) => id !== song.id)].slice(0, HOME_RECENT_COUNT);
        try { localStorage.setItem(RecentlyPlayed.KEY, JSON.stringify(this.#ids)); } catch { /* storage tidak tersedia: abaikan */ }
      }

      get songs() {
        return this.#ids.map((id) => this.#library.getSong(id)).filter(Boolean);
      }

      #read() {
        try {
          const saved = JSON.parse(localStorage.getItem(RecentlyPlayed.KEY));
          return Array.isArray(saved) ? saved.filter((id) => this.#library.getSong(id)).slice(0, HOME_RECENT_COUNT) : [];
        } catch { return []; }
      }
    }

    /* ---- services/DurationPrefetcher.js ---- */
    /**
     * Mengambil durasi asli semua lagu dari SoundCloud di latar belakang (tanpa memutar),
     * memakai widget tersembunyi kedua, satu lagu per giliran. Hasilnya memperbaiki durasi di daftar lagu
     * tanpa harus memutar tiap lagu lebih dulu.
     */
    class DurationPrefetcher {
      constructor({ soundCloud, songs, bus }) {
        this.sc = soundCloud;
        this.songs = songs;
        this.bus = bus;
        // READY harus didengarkan sejak widget dibuat; jika baru didengarkan nanti, event-nya sudah terlewat.
        this.ready = new Promise((resolve) => this.sc.onReady(resolve));
      }

      async start() {
        await Promise.race([this.ready, new Promise((resolve) => setTimeout(resolve, TIMING.PREFETCH_READY_MS))]);
        // ID berawalan "p" = playlist SoundCloud; durasinya baru jelas saat lagu diputar.
        // Lagu yang durasinya belum diketahui (0) diukur lebih dulu, lalu sisanya.
        const queue = this.songs
          .filter((song) => song.isPlayable && !String(song.soundCloudId).startsWith('p'))
          .sort((a, b) => (a.duration > 0) - (b.duration > 0));
        for (const song of queue) {
          const seconds = await this.#measure(song);
          if (seconds > 0) {
            DurationCache.save(song.soundCloudId, seconds);
            if (Math.abs(seconds - song.duration) >= 0.5) {
              song.duration = seconds;
              this.bus.emit(Events.PLAYER_DURATION, { song, seconds });
            }
          }
        }
      }

      /** Dua kali percobaan; hasil hanya dipakai jika track yang terbaca memang lagu yang diminta. */
      async #measure(song) {
        for (let attempt = 0; attempt < 2; attempt += 1) {
          const seconds = await this.#measureOnce(song);
          if (seconds > 0) return seconds;
        }
        return 0;
      }

      #measureOnce(song) {
        return new Promise((resolve) => {
          const timeout = setTimeout(() => resolve(0), TIMING.PREFETCH_TIMEOUT_MS);
          this.sc.load(song.soundCloudId, async () => {
            const sound = await this.sc.getCurrentSound();
            clearTimeout(timeout);
            const matches = sound && String(sound.id) === String(song.soundCloudId);
            resolve(matches && sound.duration > 0 ? sound.duration / 1000 : 0);
          }, false);
        });
      }
    }

    /* ################ UI TEMPLATES ################ */

    /* ---- components/ui/templates.js ---- */
    /**
     * Komponen presentasional (stateless): menerima props, mengembalikan string HTML.
     * Dipakai ulang oleh banyak view; tidak tahu apa pun tentang router atau player.
     */

    const IMG_ATTRS = 'referrerpolicy="no-referrer"';

    const Image = (src, alt = '') => `<img ${IMG_ATTRS} src="${e(src)}" alt="${e(alt)}">`;

    const CardGrid = (cardsHtml) => `<div class="grid">${cardsHtml}</div>`;

    const SectionTitle = (text) => `<h2 class="sub">${e(text)}</h2>`;

    /** Kartu navigasi (artis, album, playlist). `round` untuk cover bulat. */
    const Card = ({ go, img, title, desc, round = false }) =>
      `<article class="card ${round ? 'round' : ''}" data-go="${e(go)}"><div class="cover">` +
      `<img ${IMG_ATTRS} loading="lazy" src="${e(img)}" alt="${e(title)}"></div>` +
      `<div class="card-title">${e(title)}</div><div class="card-desc">${e(desc)}</div></article>`;

    /** Kartu lagu di Home: klik untuk memutar. Cover berupa warna sesuai warna lagu (album), bukan gambar. */
    const SongCard = (song) =>
      `<article class="card ${song.isPlayable ? '' : 'nosrc'}" data-play="${song.id}"><div class="cover">` +
      `<img ${IMG_ATTRS} loading="lazy" src="${e(colorfulPlaceholder(song.album.colorId))}" alt="${e(song.name)}">` +
      `<button class="card-play" aria-label="Play ${e(song.name)}"><i class="fa-solid fa-play"></i></button></div>` +
      `<div class="card-title">${e(song.name)}</div><div class="card-desc">${e(song.artist.name)}</div></article>`;

    const GenreTile = (genre) =>
      `<div class="gtile" style="background:${e(genre.color)}" data-go="genre:${genre.id}">` +
      `${e(genre.name)}<small>${genre.songs.length} lagu</small></div>`;

    /** `mediaHtml` dan `metaHtml` dipercaya (disusun oleh view dengan data yang sudah di-escape). */
    const Hero = ({ mediaHtml, type, title, metaHtml, round = false }) =>
      `<div class="hero ${round ? 'round' : ''}">${mediaHtml}<div><small>${e(type)}</small>` +
      `<h1>${e(title)}</h1><p>${metaHtml}</p></div></div>`;

    const GenreCover = (genre) =>
      `<div class="gen" style="background:${e(genre.color)}"><i class="fa-solid fa-icons"></i></div>`;

    const TrackRow = (song, index) =>
      `<div class="row ${song.isPlayable ? '' : 'nosrc'}" role="listitem" data-play="${song.id}">` +
      `<span class="n"><b>${index + 1}</b><i class="fa-solid fa-play"></i></span>` +
      `<span class="t">${Image(song.cover)}<span><em>${e(song.name)}</em>` +
      `<small>${e(song.artist.name)}</small></span></span>` +
      `<span class="c-al" data-go="album:${song.albumId}">${e(song.album.name)}</span>` +
      `<span class="c-t">${formatDuration(song.duration)}</span></div>`;

    /** Panduan penggunaan di halaman Home (isi dari HOME_GUIDE). */
    const HomeGuide = () => Section('Cara menggunakan website',
      '<div class="guide">' + HOME_GUIDE.map(({ icon, title, steps }) =>
        `<article class="guide-card"><h3><i class="fa-solid ${e(icon)}"></i>${e(title)}</h3>` +
        `<ul>${steps.map((step) => `<li>${e(step)}</li>`).join('')}</ul></article>`).join('') + '</div>');

    const TrackList = (songs) =>
      '<div role="list"><div class="row head"><span>#</span><span>Title</span>' +
      '<span class="c-al">Album</span><span class="c-t"><i class="fa-regular fa-clock"></i></span></div>' +
      songs.map((song, i) => TrackRow(song, i)).join('') + '</div>';


    /** Pagination huruf (A, B, C, ...) dengan tombol sebelumnya/berikutnya. Huruf tanpa isi dinonaktifkan. */
    const LetterBar = (active, available) => {
      const usable = LETTER_PAGES.filter((l) => available.has(l));
      const at = usable.indexOf(active);
      /* Hanya huruf yang punya isi; tampilkan huruf pertama, terakhir, dan sekitar huruf aktif (aturan sama di semua halaman). */
      const keep = new Set([usable[0], usable[usable.length - 1], usable[at - 1], active, usable[at + 1]]);
      const shown = usable.reduce((out, l, i) => {
        if (!keep.has(l)) return out;
        if (out.length && usable.indexOf(out[out.length - 1]) !== -1 && i - usable.indexOf(out[out.length - 1]) > 1) out.push('…');
        out.push(l);
        return out;
      }, []);
      const prev = at > 0 ? usable[at - 1] : null;
      const next = at < usable.length - 1 ? usable[at + 1] : null;
      const arrow = (target, icon, label) =>
        `<button data-letter="${target ?? ''}" aria-label="${label}" ${target ? '' : 'disabled'}><i class="fa-solid ${icon}"></i></button>`;
      return '<nav class="letters" aria-label="Pagination huruf">' +
        arrow(prev, 'fa-chevron-left', 'Huruf sebelumnya') +
        shown.map((l) => l === '…' ? '<span class="gap">…</span>' :
          `<button data-letter="${l}" class="${active === l ? 'active' : ''}"` +
          `${active === l ? ' aria-current="page"' : ''}>${l}</button>`).join('') +
        arrow(next, 'fa-chevron-right', 'Huruf berikutnya') + '</nav>';
    };

    /** Membagi daftar menjadi halaman per huruf awal. Tanpa pilihan, dipakai huruf pertama yang punya isi. */
    function letterPage(items, nameOf, letter) {
      const available = new Set(items.map((item) => letterOf(nameOf(item))));
      const active = available.has(letter) ? letter : LETTER_PAGES.find((l) => available.has(l));
      return { list: items.filter((item) => letterOf(nameOf(item)) === active), bar: LetterBar(active, available) };
    }

    const EmptyResult = () => `<p style="color:var(--muted)">${MESSAGES.NO_RESULTS}</p>`;

    /* ################ VIEWS        ################ */

    /* ---- views/BaseView.js ---- */
    /**
     * Kelas dasar halaman. Subclass mengimplementasikan render(route) dan mengembalikan:
     *   { html: string, songs: Song[] }
     * `songs` adalah daftar lagu yang tampil di halaman; ia menjadi antrean saat pengguna menekan play.
     */
    class BaseView {
      constructor(library) {
        this.library = library;
      }

      render() {
        throw new Error(`${this.constructor.name} harus mengimplementasikan render()`);
      }

      /** Hasil standar untuk halaman tanpa daftar lagu yang bisa diputar. */
      static page(html, songs = []) {
        return { html, songs };
      }
    }

    /* ---- views/ListViews.js ---- */
    /** Halaman daftar (tingkat atas): Home, Songs, Artists, Albums, Genres, Playlists. */

    class HomeView extends BaseView {
      #recommended;

      constructor(library, recent) {
        super(library);
        this.recent = recent;
        /* Diacak sekali saat web dimuat: tetap sama selama berpindah halaman, berganti saat refresh. */
        this.#recommended = shuffle(library.songs.filter((song) => song.isPlayable)).slice(0, HOME_RECOMMENDED_COUNT);
      }

      render() {
        const { songs } = this.library;
        const recent = this.recent.songs;
        const recentHtml = recent.length
          ? CardGrid(recent.map(SongCard).join(''))
          : `<p style="color:var(--muted)">${MESSAGES.NO_RECENT}</p>`;
        const html = Section('Recommended songs', CardGrid(this.#recommended.map(SongCard).join('')))
          + Section('Recently played', recentHtml)
          + HomeGuide();
        return BaseView.page(html, songs);
      }
    }

    class SongsView extends BaseView {
      render({ letter }) {
        /* Halaman per huruf awal nama artis; urut nama artis lalu judul. Antrean putar tetap seluruh lagu. */
        const songs = this.library.sortedSongs();
        const { list, bar } = letterPage(songs, (song) => song.artist.name, letter);
        return BaseView.page(SectionTitle('Songs') + TrackList(list) + bar, songs);
      }
    }

    class ArtistsView extends BaseView {
      render({ letter }) {
        const { list, bar } = letterPage(this.library.sortedArtists(), (a) => a.name, letter);
        const cards = list

        const body = cards.length ? CardGrid(cards.join('')) : `<p style="color:var(--muted)">${MESSAGES.NO_ARTISTS}</p>`;
        return BaseView.page(SectionTitle('Artists') + body + bar);
      }

    class AlbumsView extends BaseView {
      render({ letter }) {
        /* Halaman per huruf awal nama album; urut nama album. */
        const { list, bar } = letterPage(this.library.sortedAlbums(), (a) => a.name, letter);
        const cards = list
          .map((a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: `${a.yearLabel} · ${a.artist.name}` }));
        return BaseView.page(SectionTitle('Albums') + CardGrid(cards.join('')) + bar);
      }

    class GenresView extends BaseView {
      render() {

        return BaseView.page(SectionTitle('Genres') + CardGrid(tiles.join('')));

      render() {
        const cards = this.library.playlists
          .map((p) => Card({ go: `playlist:${p.id}`, img: p.img, title: p.name, desc: p.desc }));
        return BaseView.page(SectionTitle('Playlists') + CardGrid(cards.join('')));

    /* ---- views/DetailViews.js ---- */

      render({ id }) {
        const artist = this.library.getArtist(id);
        if (!artist) return BaseView.page('');
        const albums = this.library.albumsOfArtist(id);
        const songs = this.library.songsOfArtist(id);
        const albumCards = albums.map((a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: a.yearLabel }));

        const html = BackButton('artists', 'Artists')
          + Hero({
            mediaHtml: Image(artist.img),
            type: 'Artist',
            title: artist.name,
            metaHtml: `${e(artist.bio)} · ${albums.length} album · ${songs.length} lagu`,
            round: true,
          })

          + SectionTitle('Songs') + TrackList(songs);

    class AlbumView extends BaseView {
      render({ id }) {
        const album = this.library.getAlbum(id);
        if (!album) return BaseView.page('');
        const songs = this.library.songsOfAlbum(id);
        const artistLink =
          `<a data-go="artist:${album.artist.id}" style="cursor:pointer;color:#fff;font-weight:700">${e(album.artist.name)}</a>`;

        const html = BackButton('albums', 'Albums')

        const songs = this.library.songsOfGenre(id);

        const html = BackButton('genres', 'Genres')

    class PlaylistView extends BaseView {

    /* ---- views/SearchView.js ---- */
    class SearchView extends BaseView {

      render({ query }) {

    /* ---- views/index.js ---- */
    /**
     * Registry halaman: nama view (Route.view) -> instance View.
     * Menambah halaman baru = membuat kelas View + mendaftarkannya di sini.
     */
    function createViews(library, searchService, recent) {
      return new Map([
        ['home', new HomeView(library, recent)],
        ['songs', new SongsView(library)],
        ['artists', new ArtistsView(library)],
        ['albums', new AlbumsView(library)],
        ['genres', new GenresView(library)],
        ['playlists', new PlaylistsView(library)],
        ['artist', new ArtistView(library)],
        ['album', new AlbumView(library)],
        ['genre', new GenreView(library)],
        ['playlist', new PlaylistView(library)],
        ['search', new SearchView(library, searchService)],

    /* ################ COMPONENTS   ################ */

    /* ---- components/NavMenu.js ---- */
    /**
     * Basis menu navigasi. Dipakai oleh Sidebar (desktop/tablet) dan MobileTabs (ponsel);
     * keduanya berbagi item, klik, dan penanda menu aktif, hanya berbeda pembungkus markup.
     */
    class NavMenu extends Component {
      constructor(root, { router, bus }) {
        super(root);
        this.router = router;
        this.bus = bus;
      }

      renderItems() {
        return NAV_ITEMS.map(({ view, label, icon }) =>
          `<button class="nav-item" data-go="${view}"><i class="fa-solid ${icon}"></i><span>${label}</span></button>`
        ).join('');
      }

      bind() {
        this.listen(this.root, 'click', (event) => {
          const target = event.target.closest('[data-go]');
          if (!target) return;
          const view = target.dataset.go;
          /* Pindah dari menu lain: buka lagi detail terakhir menu ini. Klik menu yang sedang aktif: kembali ke daftarnya. */
          this.router.navigate(view, { restore: this.router.current.section !== view });
        });
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => this.highlight(route.section));
        this.highlight(this.router.current.section);
      }

      highlight(section) {
        this.$$('.nav-item').forEach((item) => item.classList.toggle('active', item.dataset.go === section));
      }
    }

    /* ---- components/Sidebar.js ---- */
    /** Menu samping (desktop & tablet). */

    /* ---- components/SearchBar.js ---- */
    /** Kolom pencarian. Mengetik -> router.search(); berpindah halaman -> kolom dikosongkan. */
    class SearchBar extends Component {
      constructor(root, { router, bus }) {

      render() {

          '<input id="q" type="search" placeholder="What do you want to play?" autocomplete="off">';

    /* ---- components/Navbar.js ---- */

    /* ---- components/Toast.js ---- */
    /** Notifikasi singkat. Tampil setiap ada event TOAST. */
    class Toast extends Component {
      #timer = null;

      constructor(root, { bus }) {
        super(root);
        this.bus = bus;
      }

      bind() {
        this.subscribe(this.bus, Events.TOAST, (message) => this.show(message));
      }

      show(message) {

        this.root.classList.add('show');
        clearTimeout(this.#timer);

    /* ---- core/EventBus.js ---- */
    /** Pola Observer: komponen dan service saling berkomunikasi tanpa saling mengenal. */
    class EventBus {
      #listeners = new Map();

      /** Mendaftarkan handler. Mengembalikan fungsi untuk berhenti berlangganan. */
      on(event, handler) {
        if (!this.#listeners.has(event)) this.#listeners.set(event, new Set());
        this.#listeners.get(event).add(handler);
        return () => this.off(event, handler);
      }

      off(event, handler) {
        this.#listeners.get(event)?.delete(handler);
      }

      emit(event, payload) {
        this.#listeners.get(event)?.forEach((handler) => handler(payload));
      }
    }

    /* ---- core/Component.js ---- */
    /**
     * Kelas dasar komponen UI.
     *
     * Siklus hidup:  constructor(root) -> mount() -> [render() -> bind()] -> unmount()
     *  - render(): mengembalikan markup HTML (string). Kembalikan null jika markup sudah ada di halaman.
     *  - bind():   menautkan event DOM dan langganan EventBus. Gunakan listen()/subscribe()
     *              agar semuanya otomatis dibersihkan saat unmount().
     */
    class Component {
      #cleanups = [];

      constructor(root) {
        if (!root) throw new Error(`${this.constructor.name}: elemen root tidak ditemukan`);
        this.root = root;
      }

      render() {
        return null;
      }

      bind() {}

      mount() {
        const markup = this.render();
        if (markup !== null) this.root.innerHTML = markup;
        this.bind();
        return this;
      }

      unmount() {
        this.#cleanups.forEach((cleanup) => cleanup());
        this.#cleanups = [];
      }

      /** Mencari elemen di dalam root komponen. */
      $(selector) {
        return this.root.querySelector(selector);
      }

      $$(selector) {
        return this.root.querySelectorAll(selector);
      }

      listen(target, type, handler, options) {
        target.addEventListener(type, handler, options);
        this.#cleanups.push(() => target.removeEventListener(type, handler, options));
      }

      subscribe(bus, event, handler) {
        this.#cleanups.push(bus.on(event, handler));
      }
    }

    /* ---- core/Router.js ---- */
    /** Value object: halaman mana yang sedang ditampilkan. Token berbentuk "view" atau "view:id". */
    class Route {
      constructor(view, id = null, query = '', page = 1, letter = '') {
        this.view = view;
        this.id = id;
        this.query = query;
        /** Nomor halaman pagination (mulai dari 1). */
        this.page = page;
        /** Filter huruf artis ('' = semua). */
        this.letter = letter;
      }

      static parse(token) {
        const [view, id] = token.split(':');
        return new Route(view, id ? Number(id) : null);
      }

      static search(query) {
        return new Route('search', null, query);
      }

      /** Route hasil pencarian. */
      get isSearch() {
        return this.view === 'search';
      }

      /** Halaman utama (daftar) yang valid, dan halaman detail yang wajib punya ID. */
      static #LISTS = new Set(NAV_ITEMS.map((item) => item.view));
      static #DETAILS = new Set(['artist', 'album', 'genre', 'playlist', 'watch']);

      /**
       * URL hash -> Route. Bentuk: #/home, #/artists?huruf=A, #/artist/5, #/search/kata.
       * Hash tidak dikenal / rusak menghasilkan null (pemanggil memilih halaman cadangan).
       */
      static fromHash(hash) {
        try {
          const raw = String(hash ?? '').replace(/^#\/?/, '');
          if (!raw) return null;
          const [path, qs = ''] = raw.split('?');
          const [rawView, ...rest] = path.split('/');
          const view = rawView === 'songs' ? 'songs-id' : rawView; /* tautan lama #/songs */
          if (view === 'search') {
            const query = decodeURIComponent(rest.join('/')).trim();
            return query ? Route.search(query) : null;
          }
          if (Route.#DETAILS.has(view)) {
            const id = Number(rest[0]);
            return Number.isInteger(id) && id > 0 ? new Route(view, id) : null;
          }
          if (Route.#LISTS.has(view)) {
            const params = new URLSearchParams(qs);
            const page = Number.parseInt(params.get('hal'), 10);
            return new Route(view, null, '', Number.isInteger(page) && page > 1 ? page : 1);
          }
        } catch { /* hash rusak: abaikan */ }
        return null;
      }

      /** Route -> URL hash (kebalikan dari fromHash). */
      toHash() {
        if (this.isSearch) return `#/${this.view}/${encodeURIComponent(this.query)}`;
        if (this.id !== null) return `#/${this.view}/${this.id}`;
        const params = [];
        if (this.page > 1) params.push(`hal=${this.page}`);
        return `#/${this.view}${params.length ? `?${params.join('&')}` : ''}`;
      }

      /** Halaman daftar tingkat atas (punya filter huruf), bukan detail atau pencarian. */
      get isList() {
        return this.id === null && !this.isSearch;
      }

      /** Menu utama yang harus tampil aktif untuk halaman ini. */
      get section() {
        return SECTION_OF_VIEW[this.view] ?? this.view;
      }
    }

    /**
     * Router berbasis URL hash (#/songs, #/artist/5, #/search/kata) sehingga bekerja juga saat file dibuka
     * langsung (file://). Tombol back/forward browser, refresh, dan link yang dibagikan membuka halaman yang sama.
     * Versi Lyric Video memakai awalan: #/lyric/songs, #/lyric/artist/12. Tanpa awalan = Playlist Music.
     * Halaman terakhir (selain pencarian) diingat di localStorage untuk kunjungan tanpa hash.
     * Mengingat halaman terakhir yang dibuka lewat navigasi supaya mengosongkan kolom pencarian
     * bisa kembali ke halaman tersebut.
     * Status per versi (huruf, detail, pencarian, halaman terakhir, kategori) dipisah antara Playlist Music dan Lyric Video.
     */
    class Router {
      #current = new Route('home');
      #lastPage = this.#current;
      #hash = '';
      /** Versi aktif: 'music' atau 'lyric'. */
      #mode = AppStorage.mode;
      /** Kata pencarian aktif; bertahan saat pindah halaman sampai pengguna menghapusnya. */
      #query = '';
      /** Halaman pagination terakhir per halaman daftar, mis. { artists: 3 }; dipulihkan saat halaman dibuka lagi. */
      #pages = {};
      /** Halaman detail terakhir per menu, mis. { artists: 'artist:2' }; dipulihkan saat menu itu dibuka lagi dari navigasi. */
      #details = {};

      constructor(bus) {
        this.bus = bus;
        window.addEventListener('popstate', () => this.#onPopState());
      }

      get current() {
        return this.#current;
      }

      get query() {
        return this.#query;
      }

      /** True bila ada halaman sebelumnya di dalam aplikasi ini (bukan situs lain) yang bisa dikembali-i. */
      get canGoBack() {
        return (history.state?.i ?? 0) > 0;
      }

      get mode() {
        return this.#mode;
      }

      /** Versi awal: dari URL (#/lyric/...), lalu pilihan terakhir di localStorage, lalu Playlist Music. */
      static initialMode() {
        return Router.#parseHash(location.hash)?.mode ?? AppStorage.savedMode();
      }

      /** URL hash -> { mode, route }. Hash kosong atau rusak -> null. */
      static #parseHash(hash) {
        const raw = String(hash ?? '').replace(/^#\/?/, '');
        if (!raw) return null;
        if (/^lyric(?:[/?]|$)/.test(raw)) {
          const rest = raw.slice(5).replace(/^\//, '');
          return { mode: 'lyric', route: rest ? Route.fromHash(`#/${rest}`) : null };
        }
        const route = Route.fromHash(hash);
        return route ? { mode: 'music', route } : null;
      }

      #hashOf(route) {
        const hash = route.toHash();
        return this.#mode === 'lyric' ? `#/lyric/${hash.slice(2)}` : hash;
      }

      /**
       * @param {string} token  "view" atau "view:id"
       * @param {{restore?: boolean}} [options]  restore=true (klik menu utama): bila menu itu punya detail
       *        yang terakhir dibuka (mis. artist Avenged Sevenfold), buka lagi detail tersebut, bukan daftarnya.
       */
      navigate(token, { restore = false, replace = false } = {}) {
        let target = Route.parse(token);
        if (target.isList) {
          const saved = restore ? this.#details[target.view] : null;
          /* Tombol "kembali" ke daftar (restore=false) menghapus ingatan detail. */
          if (saved) target = Route.parse(saved);
          else {
            delete this.#details[target.view];
            AppStorage.update({ details: this.#details });
            target = this.#withSavedPage(target);
          }
        }
        this.#rememberDetail(target);
        if (target.view !== 'watch') this.#lastPage = target;
        /* Kembali ke Songs saat masih ada kata pencarian: tampilkan lagi hasil pencariannya. */
        this.#current = this.#withQuery(target);
        this.#writeUrl(replace);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'navigate' });
      }

      /** Pindah antara Playlist Music dan Lyric Video tanpa memuat ulang aplikasi; membuka halaman terakhir milik versi tujuan. */
      switchMode(mode) {
        if (!MODES[mode] || mode === this.#mode) return;
        this.#applyMode(mode);
        this.#enter(null, 'mode', false);
      }

      #applyMode(mode) {
        this.#mode = mode;
        AppStorage.mode = mode;
        AppStorage.saveMode(mode);
        this.bus.emit(Events.MODE_CHANGE, { mode });
      }

      /** Songs yang dibuka saat masih ada kata pencarian menampilkan hasil pencariannya. */
      #withQuery(route) {
        if (!this.#query || route.id !== null) return route;
        return route.view.startsWith('songs') ? Route.search(this.#query) : route;
      }

      /** Query kosong = kembali ke halaman terakhir. */
      search(query) {
        const wasSearch = this.#current.isSearch;
        this.#query = query;
        AppStorage.update({ query });
        /* Kolom dikosongkan saat berada di halaman lain (bukan hasil pencarian): halaman tidak perlu dimuat ulang. */
        if (!query && !wasSearch) return;
        this.#current = query ? Route.search(query) : this.#lastPage;
        /* Mengetik terus tidak menambah riwayat: entri pencarian diganti, bukan ditumpuk. */
        this.#writeUrl(wasSearch);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'search' });
      }

      /** Pindah ke halaman nomor `page` pada tampilan daftar yang sedang dibuka. */
      setPage(page) {
        const r = this.#current;
        this.#current = new Route(r.view, r.id, r.query, page);
        this.#lastPage = this.#current;
        this.#rememberPage(r.view, page);
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'page' });
      }

      /** Memicu render awal: dari URL, lalu halaman terakhir di localStorage, lalu Home. */
      start() {
        this.#mode = AppStorage.mode;
        const parsed = Router.#parseHash(location.hash);
        this.#enter(parsed?.mode === this.#mode ? parsed.route : null, 'start', true);
      }

      /** Memuat status tersimpan milik halaman aktif (huruf & detail terakhir), menyiapkan route, lalu menampilkannya. */
      #enter(hashRoute, source, replace) {
        const saved = AppStorage.read();
        this.#loadSaved(saved);
        const savedRoute = Route.fromHash(saved.route);
        let route = this.#withSavedPage(hashRoute
          ?? (savedRoute?.view === 'watch' ? null : savedRoute)
          ?? new Route('home'));
        if (route.isList) this.#rememberPage(route.view, route.page);
        this.#rememberDetail(route);
        this.#query = route.isSearch ? route.query : (typeof saved.query === 'string' ? saved.query : '');
        this.#lastPage = route.view === 'search' || route.view === 'watch' ? new Route('home') : route;
        route = this.#withQuery(route);
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#writeUrl(replace);
        document.title = MODES[this.#mode].title;
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source });
      }

      #loadSaved(saved) {
        this.#pages = {};
        this.#details = {};
        if (saved.pages && typeof saved.pages === 'object') {
          for (const [view, page] of Object.entries(saved.pages)) {
            if (Number.isInteger(page) && page > 1) this.#pages[view] = page;
          }
        }
        if (saved.details && typeof saved.details === 'object') {
          for (const [view, token] of Object.entries(saved.details)) {
            const r = typeof token === 'string' ? Route.parse(token) : null;
            if (r && r.id > 0 && Number.isInteger(r.id) && r.section === view) this.#details[view] = token;
          }
        }
      }

      #rememberPage(view, page) {
        if (view === 'search') return;
        if (page > 1) this.#pages[view] = page;
        else delete this.#pages[view];
        AppStorage.update({ pages: this.#pages });
      }

      /** Mengingat detail yang sedang dibuka (artist/album/genre/playlist) untuk menu induknya. */
      #rememberDetail(route) {
        if (route.id === null || route.isSearch || route.view === 'watch') return;
        this.#details[route.section] = `${route.view}:${route.id}`;
        AppStorage.update({ details: this.#details });
      }

      /** Halaman daftar tanpa huruf dibuka lagi: pakai huruf terakhir yang dipilih di halaman itu. */
      #withSavedPage(route) {
        const page = this.#pages[route.view];
        return route.isList && route.page === 1 && page ? new Route(route.view, null, '', page) : route;
      }

      /** Back/forward browser atau hash diubah manual di address bar (termasuk berpindah versi). */
      #onPopState() {
        const hash = location.hash;
        if (hash === this.#hash) return;
        const parsed = Router.#parseHash(hash);
        const mode = parsed?.mode ?? this.#mode;
        let hashRoute = parsed?.route ?? null;
        if (mode !== this.#mode) {
          this.#applyMode(mode);
          const saved = AppStorage.read();
          this.#loadSaved(saved);
          this.#query = typeof saved.query === 'string' ? saved.query : '';
          hashRoute ??= Route.fromHash(saved.route);
          document.title = MODES[mode].title;
        }
        let route = hashRoute ?? new Route('home');
        if (route.isList) this.#rememberPage(route.view, route.page);
        this.#rememberDetail(route);
        if (route.isSearch) this.#query = route.query;
        else {
          if (route.view !== 'watch') this.#lastPage = route;
          route = this.#withQuery(route);
        }
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#hash = this.#hashOf(route);
        AppStorage.update({ route: this.#lastPage.toHash() });
        this.bus.emit(Events.ROUTE_CHANGE, { route, source: 'popstate' });
      }

      #writeUrl(replace) {
        const hash = this.#hashOf(this.#current);
        AppStorage.update({ route: this.#lastPage.toHash() });
        if (hash === this.#hash && !replace) return;
        this.#hash = hash;
        try {
          const depth = history.state?.i ?? 0;
          history[replace ? 'replaceState' : 'pushState']({ i: replace ? depth : depth + 1 }, '', hash);
        } catch {
          location.hash = hash; /* cadangan bila History API ditolak */
        }
      }
    }

    /* ---- services/MusicLibrary.js ---- */
    /**
     * Repository katalog musik untuk SATU versi (Playlist Music atau Lyric Video).
     *
     * Struktur data:
     *  - Map<id, entity>        -> pencarian entitas O(1)
     *  - Map<key, entity[]>     -> indeks relasi (lagu per album/artis/genre, album per artis), dibangun sekali
     *  - cache hasil saring/sort -> dihitung sekali per kategori, dipakai ulang
     *
     * Kategori (Indonesian / International): daftar publik (artists, albums, songs, playlists, genres, sorted*)
     * hanya berisi isi kategori aktif (setCategory). Lookup per id (getSong, getArtist, ...) dan allSongs mencakup
     * kedua kategori, supaya Favorites, Recently played, dan antrean pemutar tetap utuh.
     */
    class MusicLibrary {
      #artists;
      #albums;
      #genres;
      #songs;
      #playlists;
      #artistById;
      #albumById;
      #genreById;
      #songById;
      #playlistById;
      #songsByAlbum;
      #songsByGenre;
      #songsByArtist;
      #albumsByArtist;
      #cache = new Map();

      constructor({ artists, genres, albums, songs, playlists }) {
        this.#artists = artists.map((row) => new Artist(row));
        this.#genres = genres.map((row) => new Genre(row));
        this.#albums = albums.map((row) => new Album(row));
        this.#songs = songs.map((row) => new Song(row));
        this.#playlists = playlists.map((row) => new Playlist(row));

        this.#artistById = indexBy(this.#artists, (a) => a.id);
        this.#albumById = indexBy(this.#albums, (a) => a.id);
        this.#genreById = indexBy(this.#genres, (g) => g.id);
        this.#songById = indexBy(this.#songs, (s) => s.id);
        this.#playlistById = indexBy(this.#playlists, (p) => p.id);

        this.#linkRelations();

        this.#songsByAlbum = groupBy(this.#songs, (s) => s.albumId);
        this.#songsByGenre = groupBy(this.#songs, (s) => s.genreId);
        this.#songsByArtist = groupBy(this.#songs, (s) => s.artistId);
        this.#albumsByArtist = groupBy(this.#albums, (a) => a.artistId);
      }

      /** Menghubungkan objek antar-entitas (song -> album -> artist, song -> genre, playlist -> songs). */
      #linkRelations() {
        for (const album of this.#albums) {
          album.artist = this.#artistById.get(album.artistId);
          album.artist.albums.push(album);
        }
        for (const song of this.#songs) {
          song.album = this.#albumById.get(song.albumId);
          song.genre = this.#genreById.get(song.genreId);
          song.album.songs.push(song);
          song.artist.songs.push(song);
          song.genre.songs.push(song);
          song.buildSearchText();
        }
        for (const playlist of this.#playlists) {
          const listed = playlist.songIds.map((id) => this.#songById.get(id)).filter(Boolean);
          playlist.songs = listed.length ? listed : this.#playlistTrack(playlist);
        }
      }

      /**
       * Playlist tanpa daftar lagu (songIds kosong) tetapi punya ID SoundCloud sendiri diputar sebagai satu trek.
       * Bila lagu dengan ID SoundCloud yang sama sudah ada di pustaka, lagu itu dipakai; jika tidak, dibuat trek
       * khusus (tidak masuk daftar lagu/pencarian) dengan id negatif agar tidak bentrok dengan id lagu.
       */
      #playlistTrack(playlist) {
        if (!playlist.soundCloudId) return [];
        const existing = this.#songs.find((s) => s.soundCloudId === playlist.soundCloudId);
        if (existing) return [existing];

        const track = new Song({
          id: -playlist.id, name: playlist.name, albumId: playlist.albumId,
          genreId: null, dur: playlist.duration, sc: playlist.soundCloudId,
        });
        const artist = this.#artistById.get(playlist.artistId)
          ?? new Artist({ id: null, name: 'Berbagai Artis', bio: '', img: null, cat: playlist.cat });
        track.album = this.#albumById.get(playlist.albumId)
          ?? Object.assign(new Album({ id: null, name: playlist.name, artistId: playlist.artistId, year: null, colorId: null }), { artist });
        return [track];
      }

      /* ---------- Koleksi global (Indonesia + internasional digabung) ---------- */

      /** Hasil dihitung sekali lalu disimpan. */
      #memo(key, build) {
        if (!this.#cache.has(key)) this.#cache.set(key, build());
        return this.#cache.get(key);
      }

      get artists() { return this.#artists; }
      get albums() { return this.#albums; }
      get songs() { return this.#songs; }
      get playlists() { return this.#playlists; }

      /** Genre yang punya lagu (dari kedua kategori). */
      get genres() {
        return this.#memo('genres', () => this.#genres.filter((genre) => this.songsOfGenre(genre.id).length > 0));
      }

      /** Semua lagu versi ini (kedua kategori): untuk antrean pemutar, durasi, dan riwayat. */
      get allSongs() { return this.#songs; }

      /* ---------- Lookup O(1) ---------- */
      getSong(id) { return this.#songById.get(id); }
      getArtist(id) { return this.#artistById.get(id); }
      getAlbum(id) { return this.#albumById.get(id); }
      getGenre(id) { return this.#genreById.get(id); }
      getPlaylist(id) { return this.#playlistById.get(id); }

      /* ---------- Relasi ---------- */
      songsOfAlbum(albumId) { return this.#songsByAlbum.get(albumId) ?? []; }
      songsOfGenre(genreId) { return this.#songsByGenre.get(genreId) ?? []; }

      /** Tahun tidak diketahui (null) diurutkan paling akhir, bukan paling awal. */
      static #yearKey(year) { return year ?? Number.MAX_SAFE_INTEGER; }

      albumsOfArtist(artistId) {
        const key = MusicLibrary.#yearKey;
        return [...(this.#albumsByArtist.get(artistId) ?? [])]
          .sort((a, b) => (key(a.year) < key(b.year) ? -1 : key(a.year) > key(b.year) ? 1 : 0));
      }

      /** Lagu artis, diurutkan menurut tahun album lalu urutan id. */
      songsOfArtist(artistId) {
        const key = MusicLibrary.#yearKey;
        return [...(this.#songsByArtist.get(artistId) ?? [])]
          .sort((a, b) => (key(a.album.year) < key(b.album.year) ? -1 : key(a.album.year) > key(b.album.year) ? 1 : 0) || a.id - b.id);
      }

      /* ---------- Daftar terurut (kategori aktif, di-cache) ---------- */
      sortedSongs() {
        return this.#memo('sorted-songs', () => [...this.songs].sort(
          (a, b) => compareText(a.artist.name, b.artist.name) || compareText(a.name, b.name)));
      }

      /** Lagu satu asal musik ('id' / 'int'), urut nama artis lalu judul. Hanya penyaring tampilan. */
      songsOfCategory(category) {
        return this.#memo(`songs:${category}`, () => this.sortedSongs().filter((song) => song.cat === category));
      }

      sortedArtists() {
        return this.#memo('sorted-artists', () => [...this.artists].sort((a, b) => compareText(a.name, b.name)));
      }

      sortedAlbums() {
        return this.#memo('sorted-albums', () => [...this.albums].sort(
          (a, b) => compareText(a.name, b.name) || compareText(a.artist.name, b.artist.name) || a.year - b.year));
      }

      sortedGenres() {
        return this.#memo('sorted-genres', () => [...this.genres].sort((a, b) => compareText(a.name, b.name)));
      }
    }

    /* ---- services/SearchService.js ---- */
    /**
     * Pencarian lagu berdasarkan judul + artis + album, pada versi dan kategori yang sedang aktif.
     * Teks pencarian setiap lagu sudah dihitung sekali (Song.searchText),
     * sehingga tiap ketikan hanya satu lintasan O(n) tanpa membangun string ulang.
     */
    class SearchService {
      constructor(library) {
        this.library = library;
      }

      /** @param {string} rawQuery teks mentah dari input */
      search(rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        if (!query) return [];
        return this.library.songs.filter((song) => song.matches(query));
      }
    }

    /* ---- services/FavoritesStore.js ---- */
    /**
     * Daftar lagu favorit, TERPISAH per versi (Playlist Music dan Lyric Video), masing-masing di localStorage
     * dengan kunci sendiri. Semua operasi (has, toggle, songs) bekerja pada versi aktif (setMode).
     * Identitas lagu = ID lagu. Trek khusus playlist (ID negatif) diberi awalan versi, mis. "music:-8", supaya unik.
     * Favorit versi lama (satu daftar bersama LOCAL/PRO) dipindahkan sekali ke versi yang memiliki lagunya.
     */
    class FavoritesStore {
      static key(mode) { return `musik-favorit-${mode}-v2`; }
      static LEGACY_KEY = 'musik-favorit-v1';

      #mode = DEFAULT_MODE;
      #keys = {};
      #keyOf = new WeakMap();
      #songByKey = {};

      constructor({ bus }) {
        this.bus = bus;
        for (const mode of Object.keys(MODES)) {
          this.#songByKey[mode] = new Map();
          this.#keys[mode] = this.#read(mode);
        }
      }

      /** Memilih versi aktif. */
      setMode(mode) {
        if (MODES[mode]) this.#mode = mode;
      }

      /** Mendaftarkan semua lagu (termasuk trek playlist) milik satu versi agar bisa dicari lewat kuncinya. */
      register(library, mode) {
        const songs = [...library.allSongs, ...library.playlists.flatMap((playlist) => playlist.songs)];
        for (const song of songs) {
          const key = song.id > 0 ? song.id : `${mode}:${song.id}`;
          this.#keyOf.set(song, key);
          this.#songByKey[mode].set(key, song);
        }
        this.#migrateLegacy(mode);
      }

      keyOf(song) {
        return this.#keyOf.get(song) ?? song.id;
      }

      has(song) {
        return Boolean(song) && this.#keys[this.#mode].includes(this.keyOf(song));
      }

      /** Menambah atau menghapus lagu dari Favorites versi aktif. Mengembalikan true bila kini menjadi favorit. */
      toggle(song) {
        const key = this.keyOf(song);
        const current = this.#keys[this.#mode];
        const favorite = !current.includes(key);
        this.#keys[this.#mode] = favorite ? [...current, key] : current.filter((k) => k !== key);
        this.#write(this.#mode);
        this.bus.emit(Events.FAVORITES_CHANGE, { song, favorite });
        return favorite;
      }

      /** Lagu favorit versi aktif, yang terbaru ditambahkan di paling atas. */
      get songs() {
        const lookup = this.#songByKey[this.#mode];
        return [...this.#keys[this.#mode]].reverse().map((key) => lookup.get(key)).filter(Boolean);
      }

      /** Pertama kali versi ini dibuka: ambil favorit lama yang lagunya ada di versi ini. */
      #migrateLegacy(mode) {
        try {
          if (localStorage.getItem(FavoritesStore.key(mode)) !== null) return;
          const legacy = JSON.parse(localStorage.getItem(FavoritesStore.LEGACY_KEY));
          if (!Array.isArray(legacy)) return;
          const known = this.#songByKey[mode];
          const moved = legacy
            .map((key) => (typeof key === 'string' ? key.replace(/^(local|pro):/, `${mode}:`) : key))
            .filter((key) => known.has(key));
          this.#keys[mode] = [...new Set(moved)];
          this.#write(mode);
        } catch { /* abaikan */ }
      }

      #read(mode) {
        try {
          const value = JSON.parse(localStorage.getItem(FavoritesStore.key(mode)));
          return Array.isArray(value)
            ? [...new Set(value.filter((k) => typeof k === 'number' || typeof k === 'string'))]
            : [];
        } catch { return []; }
      }

      #write(mode) {
        try { localStorage.setItem(FavoritesStore.key(mode), JSON.stringify(this.#keys[mode])); } catch { /* abaikan */ }
      }
    }

    /* ---- services/PlayQueue.js ---- */
    /**
     * Antrean putar.
     *
     *  - #source   : daftar asal (urutan tampilan di halaman)
     *  - #order    : urutan putar aktual (sama dengan source, atau hasil Fisher-Yates jika shuffle)
     *  - #cursor   : indeks lagu yang sedang aktif di #order
     *  - #position : Map<songId, indeks> untuk mencari posisi lagu O(1)
     *
     * Navigasi next/previous bersifat melingkar (circular buffer) dan melewati lagu yang belum
     * punya sumber SoundCloud.
     */
    class PlayQueue {
      #source = [];
      #order = [];
      #position = new Map();
      #cursor = 0;
      #shuffled = false;

      constructor(songs) {
        this.load(songs);
      }

      get current() {
        return this.#order[this.#cursor];
      }

      get cursor() {
        return this.#cursor;
      }

      get size() {
        return this.#order.length;
      }

      get isShuffled() {
        return this.#shuffled;
      }

      /** Mengganti antrean dengan `songs`. Jika startId diberikan, kursor diarahkan ke lagu itu. */
      load(songs, startId = null) {
        this.#source = songs;
        this.#rebuildOrder();
        if (startId !== null) this.#cursor = this.indexOf(startId);
        return this;
      }

      setShuffle(enabled) {
        const currentId = this.current?.id;
        this.#shuffled = enabled;
        this.#rebuildOrder();
        if (currentId !== undefined) this.#cursor = this.indexOf(currentId);
      }

      indexOf(songId) {
        return this.#position.get(songId) ?? -1;
      }

      /** Apakah antrean ini dibuat dari daftar `songs` yang sama (isi dan urutan)? */
      hasSource(songs) {
        return this.#source.length === songs.length && this.#source.every((song, i) => song === songs[i]);
      }

      isCurrent(songId) {
        return this.current?.id === songId;
      }

      jumpTo(index) {
        this.#cursor = index;
        return this.current;
      }

      /**
       * Indeks lagu berikutnya (direction = 1) atau sebelumnya (-1) yang bisa diputar,
       * dengan wrap-around. Mengembalikan -1 bila tidak ada satu pun yang bisa diputar.
       */
      findPlayable(direction) {
        const n = this.#order.length;
        for (let step = 1; step <= n; step++) {
          const index = (((this.#cursor + direction * step) % n) + n) % n;
          if (this.#order[index].isPlayable) return index;
        }
        return -1;
      }

      /** Hingga `count` lagu berikutnya yang bisa diputar (urutan putar aktual, melingkar), tanpa lagu yang sedang aktif. */
      upcoming(count) {
        const n = this.#order.length;
        const out = [];
        for (let step = 1; step < n && out.length < count; step++) {
          const song = this.#order[(this.#cursor + step) % n];
          if (song.isPlayable) out.push(song);
        }
        return out;
      }

      /**
       * Mengatur ulang urutan lagu berikutnya. `ids` = urutan baru dari lagu-lagu yang tampil di Up next.
       * Lagu-lagu itu hanya bertukar tempat di slot yang sudah mereka tempati, jadi lagu aktif dan lagu lain tidak bergeser.
       */
      reorderUpcoming(ids) {
        const n = this.#order.length;
        const wanted = new Set(ids);
        const slots = [];
        const picked = new Map();
        for (let step = 1; step < n; step++) {
          const index = (this.#cursor + step) % n;
          const song = this.#order[index];
          if (wanted.has(song.id)) { slots.push(index); picked.set(song.id, song); }
        }
        if (slots.length !== ids.length || picked.size !== ids.length) return false;
        ids.forEach((id, k) => { this.#order[slots[k]] = picked.get(id); });
        if (!this.#shuffled) this.#source = [...this.#order];
        this.#position = new Map(this.#order.map((song, index) => [song.id, index]));
        return true;
      }

      #rebuildOrder() {
        this.#order = this.#shuffled ? shuffle(this.#source) : [...this.#source];
        this.#position = new Map(this.#order.map((song, index) => [song.id, index]));
        this.#cursor = Math.min(this.#cursor, Math.max(this.#order.length - 1, 0));
      }
    }

    /* ---- services/SoundCloudPlayer.js ---- */
    /**
     * Adapter untuk SoundCloud Widget API (satu-satunya sumber audio aplikasi).
     * Seluruh pengetahuan tentang `SC.Widget` dikurung di kelas ini; bagian lain aplikasi
     * hanya berbicara lewat method sederhana (play, pause, load, ...).
     */
    class SoundCloudPlayer {
      #widget;
      #events;

      /**
       * @param {HTMLIFrameElement} iframe iframe tersembunyi berisi widget SoundCloud
       * @param {object} sc objek global `SC` dari https://w.soundcloud.com/player/api.js
       */
      constructor(iframe, sc = window.SC) {
        /* API gagal dimuat (offline/diblokir): aplikasi tetap tampil, pemutaran dinonaktifkan. */
        this.available = Boolean(sc);
        if (sc) {
          this.#widget = sc.Widget(iframe);
          this.#events = sc.Widget.Events;
        } else {
          this.#widget = {
            load() {}, play() {}, pause() {}, seekTo() {}, setVolume() {}, bind() {},
            getDuration: (cb) => cb(0), getCurrentSound: (cb) => cb(null),
          };
          this.#events = {};
        }
      }

      /** Track biasa diberi ID angka; ID berawalan "p" menandakan playlist SoundCloud. */
      static urlFor(id) {
        const value = String(id);
        return value.startsWith('p')
          ? `https://api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A${value.slice(1)}`
          : `https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A${value}`;
      }

      load(id, onReady, autoPlay = true) {
        this.#widget.load(SoundCloudPlayer.urlFor(id), {
          auto_play: autoPlay,
          show_teaser: false,
          callback: onReady,
        });
      }

      play() { this.#widget.play(); }
      pause() { this.#widget.pause(); }
      seekTo(milliseconds) { this.#widget.seekTo(milliseconds); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) { this.#widget.setVolume(fraction * 100); }

      /** @returns {Promise<number>} durasi track dalam milidetik */
      getDuration() {
        return new Promise((resolve) => this.#widget.getDuration(resolve));
      }

      onReady(handler) { this.#widget.bind(this.#events.READY, handler); }

      /** @returns {Promise<object|null>} data track yang sedang dimuat widget (id, duration dalam ms, ...) */
      getCurrentSound() {
        return new Promise((resolve) => this.#widget.getCurrentSound((sound) => resolve(sound)));
      }

      onPlay(handler) { this.#widget.bind(this.#events.PLAY, handler); }
      onPause(handler) { this.#widget.bind(this.#events.PAUSE, handler); }
      onFinish(handler) { this.#widget.bind(this.#events.FINISH, handler); }

      /** handler menerima { percent: 0..100, seconds } */
      onProgress(handler) {
        this.#widget.bind(this.#events.PLAY_PROGRESS, (e) =>
          handler({ percent: e.relativePosition * 100, seconds: e.currentPosition / 1000 }));
      }
    }

    /* ---- services/YouTubePlayer.js ---- */
    /**
     * Adapter YouTube IFrame API: antarmukanya dibuat sama dengan SoundCloudPlayer
     * (load, play, pause, seekTo, setVolume, getDuration, onPlay, ...), jadi PlayerController tidak perlu tahu bedanya.
     * Skrip YouTube baru dimuat saat lagu YouTube pertama kali diputar.
     */
    class YouTubePlayer {
      static #apiPromise = null;
      #host;
      #player = null;
      #ready = null;
      #pending = null;
      #volume = 100;
      #timer = null;
      #handlers = { play: [], pause: [], finish: [], progress: [], error: [] };

      /** @param {HTMLElement} host elemen kosong tempat YouTube membuat iframe-nya */
      constructor(host) {
        this.#host = host;
        this.available = true;
      }

      static #loadApi() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (!YouTubePlayer.#apiPromise) {
          YouTubePlayer.#apiPromise = new Promise((resolve, reject) => {
            const previous = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => { if (previous) previous(); resolve(window.YT); };
            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            script.onerror = () => { YouTubePlayer.#apiPromise = null; reject(new Error('YouTube API gagal dimuat')); };
            document.head.appendChild(script);
          });
        }
        return YouTubePlayer.#apiPromise;
      }

      #emit(name, payload) { this.#handlers[name].forEach((fn) => fn(payload)); }

      #ensure() {
        if (this.#ready) return this.#ready;
        this.#ready = YouTubePlayer.#loadApi().then((YT) => new Promise((resolve) => {
          const vars = { playsinline: 1, controls: 0, rel: 0, disablekb: 1, fs: 0, iv_load_policy: 3 };
          if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
          this.#player = new YT.Player(this.#host, {
            width: '100%', height: '100%', playerVars: vars,
            events: {
              onReady: () => resolve(this.#player),
              onStateChange: (event) => this.#onState(event.data, YT.PlayerState),
              onError: () => { this.#stopTimer(); this.#emit('error'); },
            },
          });
        }));
        this.#ready.catch(() => { this.#ready = null; this.available = false; this.#emit('error'); });
        return this.#ready;
      }

      #onState(state, S) {
        if (state === S.PLAYING) { this.#startTimer(); this.#emit('play'); }
        else if (state === S.PAUSED) { this.#stopTimer(); this.#emit('pause'); }
        else if (state === S.ENDED) { this.#stopTimer(); this.#emit('finish'); }
      }

      #startTimer() {
        this.#stopTimer();
        this.#timer = setInterval(() => {
          const p = this.#player;
          if (!p || !p.getDuration) return;
          const total = p.getDuration() || 0;
          const seconds = p.getCurrentTime() || 0;
          if (total > 0) this.#emit('progress', { percent: (seconds / total) * 100, seconds });
        }, 250);
      }

      #stopTimer() { clearInterval(this.#timer); this.#timer = null; }

      load(id, onReady, autoPlay = true) {
        const token = Symbol('load');
        this.#pending = token;
        this.#ensure().then((player) => {
          if (this.#pending !== token) return; /* sudah ada permintaan load yang lebih baru */
          player.setVolume(this.#volume);
          if (autoPlay) player.loadVideoById(id); else player.cueVideoById(id);
          if (onReady) onReady();
        }).catch(() => {});
      }

      play() { this.#player?.playVideo?.(); }
      pause() { this.#player?.pauseVideo?.(); }
      seekTo(milliseconds) { this.#player?.seekTo?.(milliseconds / 1000, true); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) {
        this.#volume = Math.round(fraction * 100);
        this.#player?.setVolume?.(this.#volume);
      }

      /** @returns {Promise<number>} durasi dalam milidetik (0 bila belum diketahui) */
      getDuration() {
        const seconds = this.#player?.getDuration?.() || 0;
        return Promise.resolve(seconds * 1000);
      }

      onPlay(handler) { this.#handlers.play.push(handler); }
      onPause(handler) { this.#handlers.pause.push(handler); }
      onFinish(handler) { this.#handlers.finish.push(handler); }
      onProgress(handler) { this.#handlers.progress.push(handler); }
      onError(handler) { this.#handlers.error.push(handler); }
    }

    /* ---- services/HybridPlayer.js ---- */
    /**
     * Memilih mesin audio per lagu: SoundCloud bila lagu punya ID SoundCloud, selain itu YouTube.
     * Antarmukanya sama dengan SoundCloudPlayer, hanya `load()` menerima objek Song (bukan ID).
     * Event dari mesin yang tidak sedang aktif diabaikan, supaya jeda otomatis saat berganti mesin tidak mengganggu status.
     */
    class HybridPlayer {
      #soundCloud;
      #youTube;
      #active;

      constructor(soundCloud, youTube) {
        this.#soundCloud = soundCloud;
        this.#youTube = youTube;
        this.#active = soundCloud;
      }

      get available() { return this.#soundCloud.available || this.#youTube.available; }

      /** Mode teater hanya tampil saat lagu YouTube aktif (iklan YouTube butuh ruang tampil, jadi tidak disembunyikan dengan display:none saat diputar). */
      showVideo(visible) { document.getElementById('theater')?.classList.toggle('show', visible); }

      load(song, onReady, autoPlay = true) {
        const useSoundCloud = Boolean(song.soundCloudId);
        const next = useSoundCloud ? this.#soundCloud : this.#youTube;
        const other = useSoundCloud ? this.#youTube : this.#soundCloud;
        this.#active = next; /* ganti dulu, baru jeda mesin lain: event jeda-nya jadi diabaikan */
        this.showVideo(!useSoundCloud);
        if (other !== next) other.pause();
        next.load(useSoundCloud ? song.soundCloudId : song.youTubeId, onReady, autoPlay);
      }

      play() { this.#active.play(); }
      pause() { this.#active.pause(); }
      seekTo(milliseconds) { this.#active.seekTo(milliseconds); }
      setVolume(fraction) { this.#soundCloud.setVolume(fraction); this.#youTube.setVolume(fraction); }
      getDuration() { return this.#active.getDuration(); }
      getCurrentSound() { return this.#active.getCurrentSound ? this.#active.getCurrentSound() : Promise.resolve(null); }
      onReady(handler) { this.#soundCloud.onReady(handler); }

      #bind(method, handler) {
        [this.#soundCloud, this.#youTube].forEach((engine) => {
          engine[method]((payload) => { if (engine === this.#active) handler(payload); });
        });
      }

      onPlay(handler) { this.#bind('onPlay', handler); }
      onPause(handler) { this.#bind('onPause', handler); }
      onFinish(handler) { this.#bind('onFinish', handler); }
      onProgress(handler) { this.#bind('onProgress', handler); }
      onError(handler) { this.#youTube.onError(handler); }
    }

    /* ---- services/PlayerController.js ---- */
    /**
     * Pengendali pemutaran: menggabungkan PlayQueue (apa yang diputar) dengan SoundCloudPlayer
     * (bagaimana diputar), lalu mengabarkan perubahan lewat EventBus.
     * Kelas ini tidak menyentuh DOM sama sekali.
     */
    class PlayerController {
      #started = false;
      #playing = false;
      #repeat = false;
      #volume = DEFAULT_VOLUME;
      #loadedSongId = null;
      /** Asal antrean aktif: 'favorites' bila diputar dari halaman Favorites, selain itu null. */
      #queueTag = null;
      #nudgeTimer = null;
      #warningTimer = null;

      /**
       * @param {object} deps
       * @param {import('./SoundCloudPlayer.js').SoundCloudPlayer} deps.soundCloud
       * @param {import('../core/EventBus.js').EventBus} deps.bus
       * @param {import('../models/Song.js').Song[]} deps.songs antrean awal
       */
      constructor({ soundCloud, bus, songs }) {
        this.sc = soundCloud;
        this.bus = bus;
        this.queue = new PlayQueue(songs);
        this.#restoreSaved();
        this.#listenToSoundCloud();
      }

      /** Memulihkan volume, shuffle/repeat, dan lagu terakhir dari localStorage (belum diputar otomatis). */
      #restoreSaved() {
        const saved = AppStorage.read();
        if (typeof saved.volume === 'number' && saved.volume >= 0 && saved.volume <= 1) this.#volume = saved.volume;
        if (saved.shuffle === true) this.queue.setShuffle(true);
        else if (saved.repeat === true) this.#repeat = true;
        const index = this.queue.indexOf(saved.songId);
        if (index !== -1) this.queue.jumpTo(index);
      }

      #persist() {
        AppStorage.update({
          volume: this.#volume,
          songId: this.queue.current?.id,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        });
      }

      get currentSong() { return this.queue.current; }
      get volume() { return this.#volume; }

      /** Lagu-lagu berikutnya di antrean aktif (untuk daftar Up next). */
      get upNext() { return this.queue.upcoming(100); }

      /** Mengubah urutan lagu berikutnya (geser di Up next); urutan putar otomatis mengikuti. */
      reorderUpNext(ids) { return this.queue.reorderUpcoming(ids); }

      /** Memutar lagu yang sudah ada di antrean aktif tanpa mengganti antreannya (klik di Up next). */
      playQueued(songId) {
        const index = this.queue.indexOf(songId);
        if (index !== -1) this.#playAt(index);
      }

      /** True jika lagu ini sudah dimulai dan sedang menjadi lagu aktif. */
      isCurrent(songId) {
        return this.#started && this.queue.isCurrent(songId);
      }

      get state() {
        return {
          activeId: this.#started && this.queue.current ? this.queue.current.id : null,
          playing: this.#playing,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        };
      }

      /**
       * Pindah Playlist Music <-> Lyric Video: pemutaran dihentikan, antrean diganti dengan lagu versi baru, dan lagu terakhir
       * milik versi itu dipulihkan (belum diputar otomatis). Widget pemutar dan pengaturan volume tetap dipakai bersama.
       */
      switchLibrary(songs) {
        clearTimeout(this.#nudgeTimer);
        clearTimeout(this.#warningTimer);
        this.sc.pause();
        this.sc.showVideo(false);
        this.#started = false;
        this.#playing = false;
        this.#loadedSongId = null;
        this.#queueTag = null;
        this.queue.load(songs);
        this.queue.jumpTo(0);
        const index = this.queue.indexOf(AppStorage.read().songId);
        if (index !== -1) this.queue.jumpTo(index);
        this.#emitState();
        this.bus.emit(Events.PLAYER_RESET, { song: this.queue.current, state: this.state });
      }

      /* ---------- Perintah dari UI ---------- */

      playFrom(songs, songId, tag = null) {
        this.#queueTag = tag;
        this.queue.load(songs, songId);
        this.#playAt(this.queue.indexOf(songId));
      }

      /**
       * Jika antrean berasal dari Favorites, ikuti perubahan daftar favorit (tambah/hapus) tanpa menghentikan lagu.
       * Lagu yang sedang diputar tetap ada di antrean walau baru dihapus dari favorit.
       */
      syncFavoritesQueue(favoriteSongs) {
        if (this.#queueTag !== 'favorites') return;
        const current = this.queue.current;
        const list = current && !favoriteSongs.includes(current) ? [current, ...favoriteSongs] : favoriteSongs;
        this.queue.load(list, current ? current.id : null);
        this.#persist();
      }

      /**
       * Lagu yang sedang aktif diklik lagi dari daftar lain (mis. hasil pencarian): antrean ikut daftar itu
       * (Next/Previous berputar di dalamnya) tanpa menghentikan atau memuat ulang lagu.
       */
      rebindQueue(songs, tag = null) {
        const current = this.queue.current;
        if (!current || !songs.includes(current) || this.queue.hasSource(songs)) return;
        this.#queueTag = tag;
        this.queue.load(songs, current.id);
        this.#persist();
        this.#emitState();
      }

      toggle() {
        const song = this.queue.current;
        if (!song) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#started = true;
        if (!song.isPlayable) {
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }
        // Lagu yang tampil di player belum pernah dimuat -> muat dulu, jangan hanya menekan play.
        if (this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
        if (this.#playing) {
          /* Jeda manual: batalkan percobaan "dorong play" otomatis agar lagu tidak menyala lagi sendiri. */
          clearTimeout(this.#nudgeTimer);
          clearTimeout(this.#warningTimer);
          this.sc.pause();
        } else this.sc.play();
      }

      /** direction: 1 = berikutnya, -1 = sebelumnya. Repeat hanya berlaku saat maju. */
      step(direction) {
        if (this.#repeat && direction > 0) {
          const song = this.queue.current;
          /* Lagu aktif belum pernah dimuat (mis. baru dipulihkan): muat dulu, jangan memutar trek bawaan widget. */
          if (!song || this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
          this.sc.seekTo(0);
          this.sc.play();
          return;
        }
        const index = this.queue.findPlayable(direction);
        if (index === -1) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#playAt(index);
      }

      toggleShuffle() {
        this.queue.setShuffle(!this.queue.isShuffled);
        if (this.queue.isShuffled) this.#repeat = false;
        this.#persist();
        this.#emitState();
      }

      toggleRepeat() {
        this.#repeat = !this.#repeat;
        if (this.#repeat) this.queue.setShuffle(false);
        this.#persist();
        this.#emitState();
      }

      async seekToPercent(percent) {
        if (this.#loadedSongId === null || this.#loadedSongId !== this.queue.current?.id) return;
        const duration = await this.sc.getDuration();
        this.sc.seekTo((percent / 100) * duration);
      }

      setVolume(fraction) {
        this.#volume = fraction;
        this.sc.setVolume(fraction);
        this.#persist();
      }

      /* ---------- Internal ---------- */

      #playAt(index) {
        const song = this.queue.jumpTo(index);
        this.#started = true;
        this.#persist();
        this.bus.emit(Events.PLAYER_TRACK, song);
        this.bus.emit(Events.PLAYER_PROGRESS, { percent: 0, seconds: 0 });

        if (!song.isPlayable) {
          this.#playing = false;
          this.sc.pause();
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }

        if (!this.sc.available) {
          this.#playing = false;
          this.#emitState();
          return this.#toast(MESSAGES.NO_PLAYER);
        }

        this.#playing = true;
        this.#loadedSongId = song.id;
        this.#emitState();
        this.sc.load(song, () => {
          this.sc.setVolume(this.#volume);
          this.sc.play();
        });
        this.#watchStart(song);
      }

      /** Beberapa browser menolak autoplay: coba sekali lagi, lalu beri petunjuk ke pengguna. */
      #watchStart(song) {
        const stalled = () => this.queue.current === song && !this.#playing;
        clearTimeout(this.#nudgeTimer);
        this.#nudgeTimer = setTimeout(() => stalled() && this.sc.play(), TIMING.PLAY_NUDGE_MS);
        clearTimeout(this.#warningTimer);
        this.#warningTimer = setTimeout(() => {
          if (!stalled()) return;
          this.#emitState();
          this.#toast(MESSAGES.NOT_STARTED);
        }, TIMING.PLAY_WARNING_MS);
      }

      #listenToSoundCloud() {
        this.sc.onPlay(() => {
          this.#playing = true;
          this.#emitState();
          this.sc.setVolume(this.#volume);
          this.#syncDuration();
        });
        this.sc.onPause(() => {
          this.#playing = false;
          this.#emitState();
        });
        this.sc.onFinish(() => {
          this.#playing = false;
          this.step(1);
        });
        this.sc.onProgress((progress) => this.bus.emit(Events.PLAYER_PROGRESS, progress));
        /* Video YouTube tidak bisa diputar (embed dibatasi / dihapus): tampilkan info dan hentikan status "playing". */
        this.sc.onError(() => {
          clearTimeout(this.#nudgeTimer);
          clearTimeout(this.#warningTimer);
          this.#playing = false;
          this.#emitState();
          this.#toast(MESSAGES.YT_ERROR);
        });
      }

      /**
       * Memperbarui durasi lagu aktif dengan durasi asli dari SoundCloud.
       * Data track diverifikasi (id harus cocok) agar event dari lagu sebelumnya tidak menimpa durasi lagu baru.
       */
      async #syncDuration() {
        const song = this.queue.current;
        if (song && !song.soundCloudId && song.youTubeId) {
          /* Lagu YouTube: durasi diambil dari pemutar YouTube. */
          const ms = await this.sc.getDuration();
          if (this.queue.current !== song || !(ms > 0)) return;
          song.duration = ms / 1000;
          DurationCache.save(song.cacheKey, song.duration);
          this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
          return;
        }
        const sound = await this.sc.getCurrentSound();
        if (!sound || !song || this.queue.current !== song) return;
        const isPlaylist = String(song.soundCloudId).startsWith('p');
        if (!isPlaylist && sound.id !== undefined && String(sound.id) !== String(song.soundCloudId)) return;
        if (!(sound.duration > 0)) return;
        song.duration = sound.duration / 1000;
        DurationCache.save(song.soundCloudId, song.duration);
        this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
      }

      #emitState() {
        this.bus.emit(Events.PLAYER_STATE, this.state);
      }

      #toast(message) {
        this.bus.emit(Events.TOAST, message);
      }
    }

    /* ---- services/AppStorage.js ---- */
    /**
     * Pengaturan pengguna di localStorage: halaman terakhir, volume, lagu terakhir, shuffle, repeat.
     * Versi Playlist Music memakai kunci lama (data pengguna lama tetap terbaca); versi Lyric Video menyimpan
     * pengaturan per-versi (route, query, letters, details, songId, cat) di bagian `modes.lyric`.
     * Volume, shuffle, dan repeat dipakai bersama oleh kedua versi.
     */
    const AppStorage = {
      KEY: 'musik-pengaturan-v1',
      SCOPED: ['route', 'query', 'letters', 'pages', 'details', 'songId', 'cat'],
      /** Versi aktif; diatur oleh App/Router sebelum membaca atau menulis pengaturan. */
      mode: DEFAULT_MODE,
      /** Salinan hasil parse di memori: localStorage tidak di-parse ulang di setiap baca. Dibuang bila tab lain menulis. */
      _cache: null,
      readAll() {
        if (this._cache) return this._cache;
        let value = null;
        try { value = JSON.parse(localStorage.getItem(this.KEY)); } catch { /* abaikan */ }
        this._cache = value && typeof value === 'object' ? value : {};
        return this._cache;
      },
      read() {
        const all = this.readAll();
        if (this.mode === DEFAULT_MODE) return all;
        const shared = Object.fromEntries(Object.entries(all).filter(([key]) => !this.SCOPED.includes(key)));
        return { ...shared, ...(all.modes?.[this.mode] ?? {}) };
      },
      update(patch) {
        try {
          const all = this.readAll();
          let next;
          if (this.mode === DEFAULT_MODE) next = { ...all, ...patch };
          else {
            const scoped = {};
            const shared = {};
            for (const [key, value] of Object.entries(patch)) (this.SCOPED.includes(key) ? scoped : shared)[key] = value;
            const modes = { ...(all.modes ?? {}), [this.mode]: { ...(all.modes?.[this.mode] ?? {}), ...scoped } };
            next = { ...all, ...shared, modes };
          }
          this._cache = next;
          localStorage.setItem(this.KEY, JSON.stringify(next));
        } catch { /* storage tidak tersedia: abaikan */ }
      },
      /** Kategori aktif di versi aktif ('id' atau 'int'). */
      category() {
        const cat = this.read().cat;
        return CATEGORIES[cat] ? cat : DEFAULT_CATEGORY;
      },
      /** Versi terakhir yang dibuka. Nilai lama ('local' / 'pro') tidak dikenal lagi dan kembali ke Playlist Music. */
      savedMode() {
        const mode = this.readAll().mode;
        return MODES[mode] ? mode : DEFAULT_MODE;
      },
      saveMode(mode) {
        try {
          const next = { ...this.readAll(), mode };
          this._cache = next;
          localStorage.setItem(this.KEY, JSON.stringify(next));
        } catch { /* abaikan */ }
      },
    };
    window.addEventListener('storage', (event) => { if (event.key === null || event.key === AppStorage.KEY) AppStorage._cache = null; });

    /* ---- services/DurationCache.js ---- */
    /** Menyimpan durasi asli dari SoundCloud di browser (localStorage), per ID track SoundCloud, supaya kunjungan berikutnya langsung tepat. Tulisan digabung (ditunda) agar prefetch ratusan lagu tidak menulis ulang seluruh cache setiap kali. */
    const DurationCache = {
      KEY: 'musik-durasi-soundcloud-v4',
      _mem: null,
      _timer: null,
      read() {
        if (!this._mem) {
          let value = null;
          try { value = JSON.parse(localStorage.getItem(this.KEY)); } catch { /* abaikan */ }
          this._mem = value && typeof value === 'object' ? value : {};
        }
        return this._mem;
      },
      save(soundCloudId, seconds) {
        const all = this.read();
        if (all[soundCloudId] === seconds) return;
        all[soundCloudId] = seconds;
        if (this._timer === null) this._timer = setTimeout(() => this.flush(), 1000);
      },
      flush() {
        clearTimeout(this._timer);
        this._timer = null;
        try { localStorage.setItem(this.KEY, JSON.stringify(this._mem)); } catch { /* storage tidak tersedia: abaikan */ }
      },
      apply(songs) {
        const all = this.read();
        songs.forEach((song) => { const key = song.cacheKey; if (key && all[key] > 0) song.duration = all[key]; });
      },
    };
    window.addEventListener('pagehide', () => { if (DurationCache._timer !== null) DurationCache.flush(); });

    /* ---- services/RecentlyPlayed.js ---- */
    /**
     * Riwayat lagu yang terakhir diputar, terpisah per versi (terbaru di depan, tanpa duplikat, maksimal HOME_RECENT_COUNT).
     * Disimpan di localStorage agar tetap ada setelah refresh. Riwayat versi lama (LOCAL/PRO) dibaca sekali dan
     * hanya lagu yang ada di versi ini yang dipakai.
     */
    class RecentlyPlayed {
      static KEYS = { music: 'musik-terakhir-diputar-music-v2', lyric: 'musik-terakhir-diputar-lyric-v2' };
      static LEGACY_KEYS = ['musik-terakhir-diputar-v1', 'musik-terakhir-diputar-pro-v1'];

      #library;
      #ids;
      #key;

      constructor({ library, bus, mode = DEFAULT_MODE }) {
        this.#library = library;
        this.#key = RecentlyPlayed.KEYS[mode] ?? RecentlyPlayed.KEYS[DEFAULT_MODE];
        this.#ids = this.#read();
        bus.on(Events.PLAYER_TRACK, (song) => this.add(song));
      }

      /** Lagu yang bisa diputar dan terdaftar di pustaka dimasukkan ke posisi paling depan. */
      add(song) {
        if (!song || !song.isPlayable || this.#library.getSong(song.id) !== song) return;
        this.#ids = [song.id, ...this.#ids.filter((id) => id !== song.id)].slice(0, HOME_RECENT_COUNT);
        try { localStorage.setItem(this.#key, JSON.stringify(this.#ids)); } catch { /* storage tidak tersedia: abaikan */ }
      }

      get songs() {
        return this.#ids.map((id) => this.#library.getSong(id)).filter(Boolean);
      }

      #valid(ids) {
        return [...new Set(ids.filter((id) => this.#library.getSong(id)))].slice(0, HOME_RECENT_COUNT);
      }

      #parse(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return Array.isArray(value) ? value : null;
        } catch { return null; }
      }

      #read() {
        const own = this.#parse(this.#key);
        if (own) return this.#valid(own);
        return this.#valid(RecentlyPlayed.LEGACY_KEYS.flatMap((key) => this.#parse(key) ?? []));
      }
    }

    /* ---- services/DurationPrefetcher.js ---- */
    /**
     * Mengambil durasi asli semua lagu dari SoundCloud di latar belakang (tanpa memutar),
     * memakai widget tersembunyi kedua, satu lagu per giliran. Hasilnya memperbaiki durasi di daftar lagu
     * tanpa harus memutar tiap lagu lebih dulu.
     */
    class DurationPrefetcher {
      constructor({ soundCloud, songs, bus }) {
        this.sc = soundCloud;
        this.songs = songs;
        this.bus = bus;
        // READY harus didengarkan sejak widget dibuat; jika baru didengarkan nanti, event-nya sudah terlewat.
        this.ready = new Promise((resolve) => this.sc.onReady(resolve));
      }

      async start() {
        await Promise.race([this.ready, new Promise((resolve) => setTimeout(resolve, TIMING.PREFETCH_READY_MS))]);
        // ID berawalan "p" = playlist SoundCloud; durasinya baru jelas saat lagu diputar.
        // Lagu yang durasinya belum diketahui (0) diukur lebih dulu, lalu sisanya.
        /* Durasi yang sudah tersimpan di cache tidak diukur ulang di setiap kunjungan. */
        const cached = DurationCache.read();
        const queue = this.songs
          .filter((song) => song.soundCloudId && !String(song.soundCloudId).startsWith('p') && !(cached[song.soundCloudId] > 0))
          .sort((a, b) => (a.duration > 0) - (b.duration > 0));
        for (const song of queue) {
          const seconds = await this.#measure(song);
          if (seconds > 0) {
            DurationCache.save(song.soundCloudId, seconds);
            if (Math.abs(seconds - song.duration) >= 0.5) {
              song.duration = seconds;
              this.bus.emit(Events.PLAYER_DURATION, { song, seconds });
            }
          }
        }
      }

      /** Dua kali percobaan; hasil hanya dipakai jika track yang terbaca memang lagu yang diminta. */
      async #measure(song) {
        for (let attempt = 0; attempt < 2; attempt += 1) {
          const seconds = await this.#measureOnce(song);
          if (seconds > 0) return seconds;
        }
        return 0;
      }

      #measureOnce(song) {
        return new Promise((resolve) => {
          const timeout = setTimeout(() => resolve(0), TIMING.PREFETCH_TIMEOUT_MS);
          this.sc.load(song.soundCloudId, async () => {
            const sound = await this.sc.getCurrentSound();
            clearTimeout(timeout);
            const matches = sound && String(sound.id) === String(song.soundCloudId);
            resolve(matches && sound.duration > 0 ? sound.duration / 1000 : 0);
          }, false);
        });
      }
    }

    /* ################ UI TEMPLATES ################ */

    /* ---- components/ui/templates.js ---- */
    /**
     * Komponen presentasional (stateless): menerima props, mengembalikan string HTML.
     * Dipakai ulang oleh banyak view; tidak tahu apa pun tentang router atau player.
     */

    const IMG_ATTRS = 'referrerpolicy="no-referrer"';

    const Image = (src, alt = '') => `<img ${IMG_ATTRS} src="${e(src)}" alt="${e(alt)}">`;

    /** Thumbnail baris lagu: dimuat saat mendekati layar. */
    const Thumb = (src) => `<img ${IMG_ATTRS} loading="lazy" decoding="async" src="${e(src)}" alt="">`;

    const CardGrid = (cardsHtml) => `<div class="grid">${cardsHtml}</div>`;

    const SectionTitle = (text) => `<h2 class="sub">${e(text)}</h2>`;

    const Section = (title, contentHtml) =>
      `<section class="section"><h2>${e(title)}</h2>${contentHtml}</section>`;

    const BackButton = (view, label) =>
      `<button class="back" data-go="${e(view)}"><i class="fa-solid fa-arrow-left"></i> ${e(label)}</button>`;

    /** Kartu navigasi (artis, album, playlist). `round` untuk cover bulat. */
    const Card = ({ go, img, title, desc, round = false }) =>
      `<article class="card ${round ? 'round' : ''}" data-go="${e(go)}"><div class="cover">` +
      `<img ${IMG_ATTRS} loading="lazy" src="${e(img)}" alt="${e(title)}"></div>` +
      `<div class="card-title">${e(title)}</div><div class="card-desc">${e(desc)}</div></article>`;

    /** Kartu lagu di Home: klik untuk memutar. Cover berupa warna sesuai warna lagu (album), bukan gambar. */
    const SongCard = (song) =>
      `<article class="card ${song.isPlayable ? '' : 'nosrc'}" data-play="${song.id}"><div class="cover">` +
      `<img ${IMG_ATTRS} loading="lazy" src="${e(colorfulPlaceholder(song.album.colorId))}" alt="${e(song.name)}">` +
      `<button class="card-play" aria-label="Play ${e(song.name)}"><i class="fa-solid fa-play"></i></button></div>` +
      `<div class="card-title">${e(song.name)}</div><div class="card-desc">${e(song.artist.name)}</div></article>`;

    /** Versi Videos (hijau) memakai tampilan video; versi Songs memakai tampilan musik. */
    const isVideoMode = () => AppStorage.mode === 'lyric';

    /** Kartu video 16:9 dengan thumbnail YouTube. `favKey` (opsional) menambahkan tombol love untuk menghapus dari Favorites. */
    const VideoCard = (song, favKey = null) => {
      const fallback = colorfulPlaceholder(song.album.colorId);
      const known = song.duration > 0;
      return `<article class="vcard ${song.isPlayable ? '' : 'nosrc'}" role="listitem" data-play="${song.id}">` +
        `<div class="vthumb"><img ${IMG_ATTRS} loading="lazy" src="${e(song.thumb ?? fallback)}" alt="${e(song.name)}" ` +
        `onerror="this.onerror=null;this.src='${e(fallback)}'">` +
        `<span class="vdur"${known ? '' : ' hidden'}>${known ? formatTime(song.duration) : ''}</span>` +
        `<span class="vplay"><i class="fa-solid fa-play"></i></span></div>` +
        `<div class="vmeta"><div class="vtitle">${e(song.name)}</div><div class="vsub">${e(song.artist.name)}</div></div>` +
        (favKey === null ? '' :
          `<button class="fav-btn on vfav" data-fav="${e(String(favKey))}" aria-label="Hapus ${e(song.name)} dari Favorites" title="Hapus dari Favorites">` +
          `<i class="fa-solid fa-heart"></i></button>`) +
        `</article>`;
    };

    const VideoGrid = (songs, favKeyOf = null) =>
      `<div class="vgrid" role="list">${songs.map((song) => VideoCard(song, favKeyOf ? favKeyOf(song) : null)).join('')}</div>`;

    /** Daftar lagu bergaya kartu: kartu video di versi Videos, kartu cover di versi Songs. */
    const SongGrid = (songs) => (isVideoMode() ? VideoGrid(songs) : CardGrid(songs.map(SongCard).join('')));

    const GenreTile = (genre, count) =>
      `<div class="gtile" style="background:${e(genre.color)}" data-go="genre:${genre.id}">` +
      `${e(genre.name)}<small>${count} lagu</small></div>`;

    /** `mediaHtml` dan `metaHtml` dipercaya (disusun oleh view dengan data yang sudah di-escape). */
    const Hero = ({ mediaHtml, type, title, metaHtml, round = false }) =>
      `<div class="hero ${round ? 'round' : ''}">${mediaHtml}<div><small>${e(type)}</small>` +
      `<h1>${e(title)}</h1><p>${metaHtml}</p></div></div>`;

    const GenreCover = (genre) =>
      `<div class="gen" style="background:${e(genre.color)}"><i class="fa-solid fa-icons"></i></div>`;

    const TrackRow = (song, index) =>
      `<div class="row ${song.isPlayable ? '' : 'nosrc'}" role="listitem" data-play="${song.id}">` +
      `<span class="n"><b>${index + 1}</b><i class="fa-solid fa-play"></i></span>` +
      `<span class="t">${Thumb(song.cover)}<span><em>${e(song.name)}</em>` +
      `<small>${e(song.artist.name)}</small></span></span>` +
      `<span class="c-al"${song.albumId != null ? ` data-go="album:${song.albumId}"` : ''}>${e(song.album.name)}</span>` +
      `<span class="c-t">${formatDuration(song.duration)}</span></div>`;

    /**
     * Baris lagu di halaman Favorites. Kolom album hanya menjadi tautan bila album itu milik halaman yang sedang
     * aktif (lagu favorit dari halaman lain tidak punya halaman album di sini). Ikon love menghapus dari Favorites.
     */
    const FavoriteRow = (song, index, albumLinkable, key) =>
      `<div class="row fav ${song.isPlayable ? '' : 'nosrc'}" role="listitem" data-play="${song.id}">` +
      `<span class="n"><b>${index + 1}</b><i class="fa-solid fa-play"></i></span>` +
      `<span class="t">${Thumb(song.cover)}<span><em>${e(song.name)}</em>` +
      `<small>${e(song.artist.name)}</small></span></span>` +
      `<span class="c-al"${albumLinkable ? ` data-go="album:${song.albumId}"` : ''}>${e(song.album.name)}</span>` +
      `<span class="c-t">${formatDuration(song.duration)}</span>` +
      `<button class="fav-btn on" data-fav="${e(String(key))}" aria-label="Hapus ${e(song.name)} dari Favorites" title="Hapus dari Favorites">` +
      `<i class="fa-solid fa-heart"></i></button></div>`;

    const AudioTrackList = (songs, offset = 0) =>
      '<div role="list"><div class="row head"><span>#</span><span>Title</span>' +
      '<span class="c-al">Album</span><span class="c-t"><i class="fa-regular fa-clock"></i></span></div>' +
      songs.map((song, i) => TrackRow(song, i + offset)).join('') + '</div>';

    /** Daftar lagu di halaman Songs/Artist/Album/Genre/Playlist/Search: grid video di versi Videos, tabel di versi Songs. */
    const TrackList = (songs, offset = 0) => (isVideoMode() ? VideoGrid(songs) : AudioTrackList(songs, offset));

    /** Pagination angka (1, 2, 3, ...) dengan tombol sebelumnya/berikutnya. Halaman jauh diringkas dengan "…". */
    const Pager = (page, total) => {
      if (total <= 1) return '';
      const keep = new Set([1, total, page - 1, page, page + 1].filter((n) => n >= 1 && n <= total));
      const numbers = [...keep].sort((a, b) => a - b);
      const items = [];
      numbers.forEach((n, i) => {
        if (i && n - numbers[i - 1] > 1) items.push('<span class="gap">…</span>');
        items.push(`<button data-page="${n}" class="${n === page ? 'active' : ''}"${n === page ? ' aria-current="page"' : ''}>${n}</button>`);
      });
      const arrow = (target, icon, label) =>
        `<button data-page="${target ?? ''}" aria-label="${label}" ${target ? '' : 'disabled'}><i class="fa-solid ${icon}"></i></button>`;
      return '<nav class="pager" aria-label="Pagination halaman">' +
        arrow(page > 1 ? page - 1 : null, 'fa-chevron-left', 'Halaman sebelumnya') +
        items.join('') +
        arrow(page < total ? page + 1 : null, 'fa-chevron-right', 'Halaman berikutnya') + '</nav>';
    };

    /** Membagi daftar menjadi halaman berisi PAGE_SIZE item. `unit` = satuan untuk keterangan (lagu / artis / album). */
    function paginate(items, page, unit) {
      const total = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      const current = Math.min(Math.max(1, Number(page) || 1), total);
      const offset = (current - 1) * PAGE_SIZE;
      const list = items.slice(offset, offset + PAGE_SIZE);
      const info = items.length > PAGE_SIZE
        ? `<p class="pager-info">Menampilkan ${offset + 1}–${offset + list.length} dari ${items.length} ${e(unit)}</p>` : '';
      return { list, offset, bar: info + Pager(current, total) };
    }

    /**
     * Rotasi alfabet (versi Videos, halaman Indonesian/International Songs): kelompok lagu menurut huruf awal nama artis
     * digeser melingkar sehingga huruf ke-`step` (A, B, C, ... lalu kembali ke A) berada di paling atas.
     * Hanya posisi kelompok yang berubah: urutan di dalam kelompok tetap, tidak ada lagu yang hilang atau ganda.
     * Artis berawalan angka/simbol ('#') berada di antara Z dan A. Huruf yang tidak punya lagu dilewati.
     */
    const AlphaRotation = { step: 0 };
    const artistLetter = (song) => {
      const first = String(song.artist.name).trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').charAt(0).toUpperCase();
      return first >= 'A' && first <= 'Z' ? first : '#';
    };
    function rotateByArtistLetter(songs, step) {
      const groups = new Map();
      for (const song of songs) {
        const key = artistLetter(song);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(song);
      }
      const letters = [...groups.keys()].filter((key) => key !== '#').sort();
      if (letters.length < 2) return songs;
      const at = step % letters.length;
      const order = [...letters.slice(at), ...(groups.has('#') ? ['#'] : []), ...letters.slice(0, at)];
      return order.flatMap((key) => groups.get(key));
    }

    const EmptyResult = () => `<p style="color:var(--muted)">${MESSAGES.NO_RESULTS}</p>`;

    /* ################ VIEWS        ################ */

    /* ---- views/BaseView.js ---- */
    /**
     * Kelas dasar halaman. Subclass mengimplementasikan render(route) dan mengembalikan:
     *   { html: string, songs: Song[] }
     * `songs` adalah daftar lagu yang tampil di halaman; ia menjadi antrean saat pengguna menekan play.
     */
    class BaseView {
      constructor(library) {
        this.library = library;
      }

      render() {
        throw new Error(`${this.constructor.name} harus mengimplementasikan render()`);
      }

      /** Hasil standar untuk halaman tanpa daftar lagu yang bisa diputar. */
      static page(html, songs = []) {
        return { html, songs };
      }
    }

    /* ---- views/ListViews.js ---- */
    /** Halaman daftar (tingkat atas): Home, Songs, Artists, Albums, Genres, Playlists. */

    class HomeView extends BaseView {
      /** Rekomendasi dari seluruh koleksi. */
      #recommended = null;

      constructor(library, recent) {
        super(library);
        this.recent = recent;
      }

      /* Diacak sekali per kategori saat web dimuat: tetap sama selama berpindah halaman, berganti saat refresh. */
      #recommendedSongs() {
        if (!this.#recommended) {
          const playable = this.library.songs.filter((song) => song.isPlayable);
          this.#recommended = shuffle(playable).slice(0, HOME_RECOMMENDED_COUNT);
        }
        return this.#recommended;
      }

      render() {
        const recommended = this.#recommendedSongs();
        const recent = this.recent.songs;
        const recommendedHtml = recommended.length
          ? SongGrid(recommended)
          : `<p style="color:var(--muted)">${MESSAGES.NO_SONGS}</p>`;
        const recentHtml = recent.length
          ? SongGrid(recent)
          : `<p style="color:var(--muted)">${MESSAGES.NO_RECENT}</p>`;
        const html = Section('Recommended songs', recommendedHtml)
          + Section('Recently played', recentHtml);
        /* Antrean Home = seluruh lagu versi ini, karena Recently played bisa berisi lagu dari kedua kategori. */
        return BaseView.page(html, this.library.allSongs);
      }
    }

    /** Menu Indonesian Songs / International Songs: penyaring lagu berdasarkan asal musik. */
    class SongsView extends BaseView {
      constructor(library, category) {
        super(library);
        this.category = category;
      }

      render({ page }) {
        /* 50 lagu per halaman (urut nama artis lalu judul); antrean putar = seluruh lagu kategori ini. */
        const { label } = CATEGORIES[this.category];
        const sorted = this.library.songsOfCategory(this.category);
        const songs = isVideoMode() ? rotateByArtistLetter(sorted, AlphaRotation.step) : sorted;
        if (!songs.length) return BaseView.page(SectionTitle(label) + `<p style="color:var(--muted)">${MESSAGES.NO_SONGS}</p>`, songs);
        const { list, offset, bar } = paginate(songs, page, 'lagu');
        /* data-songs-list: penanda khusus daftar lagu Indonesian/International Songs (dipakai CSS sentuh) */
        const table = TrackList(list, offset).replace('<div role="list">', '<div role="list" data-songs-list>');
        return BaseView.page(SectionTitle(label) + table + bar, songs);
      }
    }

    class ArtistsView extends BaseView {
      render({ page }) {
        const { list, bar } = paginate(this.library.sortedArtists(), page, 'artis');
        const cards = list
          .map((a) => Card({ go: `artist:${a.id}`, img: a.img, title: a.name, desc: a.bio, round: true }));
        const body = cards.length ? CardGrid(cards.join('')) : `<p style="color:var(--muted)">${MESSAGES.NO_ARTISTS}</p>`;
        return BaseView.page(SectionTitle('Artists') + body + bar);
      }
    }

    class AlbumsView extends BaseView {
      render({ page }) {
        /* 50 album per halaman; urut nama album. */
        const { list, bar } = paginate(this.library.sortedAlbums(), page, 'album');
        const cards = list
          .map((a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: `${a.yearLabel} · ${a.artist.name}` }));
        return BaseView.page(SectionTitle('Albums') + CardGrid(cards.join('')) + bar);
      }
    }

    class GenresView extends BaseView {
      render() {
        const tiles = this.library.sortedGenres().map((genre) => GenreTile(genre, this.library.songsOfGenre(genre.id).length));
        return BaseView.page(SectionTitle('Genres') + CardGrid(tiles.join('')));
      }
    }

    class PlaylistsView extends BaseView {
      render() {
        const cards = this.library.playlists
          .map((p) => Card({ go: `playlist:${p.id}`, img: p.img, title: p.name, desc: p.desc }));
        const body = cards.length ? CardGrid(cards.join('')) : `<p style="color:var(--muted)">${MESSAGES.NO_PLAYLISTS}</p>`;
        return BaseView.page(SectionTitle('Playlists') + body);
      }
    }

    /* ---- views/DetailViews.js ---- */
    /** Halaman detail: Artist, Album, Genre, Playlist. Entitas tidak ditemukan -> halaman kosong. */

    class ArtistView extends BaseView {
      render({ id }) {
        const artist = this.library.getArtist(id);
        if (!artist) return BaseView.page('');
        const albums = this.library.albumsOfArtist(id);
        const songs = this.library.songsOfArtist(id);
        const albumCards = albums.map((a) => Card({ go: `album:${a.id}`, img: a.img, title: a.name, desc: a.yearLabel }));

        const html = BackButton('artists', 'Artists')
          + Hero({
            mediaHtml: Image(artist.img),
            type: 'Artist',
            title: artist.name,
            metaHtml: `${e(artist.bio)} · ${albums.length} album · ${songs.length} lagu`,
            round: true,
          })
          + SectionTitle('Albums') + CardGrid(albumCards.join(''))
          + SectionTitle('Songs') + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    class AlbumView extends BaseView {
      render({ id }) {
        const album = this.library.getAlbum(id);
        if (!album) return BaseView.page('');
        const songs = this.library.songsOfAlbum(id);
        const artistLink =
          `<a data-go="artist:${album.artist.id}" style="cursor:pointer;color:#fff;font-weight:700">${e(album.artist.name)}</a>`;

        const html = BackButton('albums', 'Albums')
          + Hero({
            mediaHtml: Image(album.img),
            type: 'Album',
            title: album.name,
            metaHtml: `${artistLink} · ${album.yearLabel} · ${formatTotal(songs)}`,
          })
          + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    class GenreView extends BaseView {
      render({ id }) {
        const genre = this.library.getGenre(id);
        if (!genre) return BaseView.page('');
        const songs = this.library.songsOfGenre(id);

        const html = BackButton('genres', 'Genres')
          + Hero({ mediaHtml: GenreCover(genre), type: 'Genre', title: genre.name, metaHtml: formatTotal(songs) })
          + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    class PlaylistView extends BaseView {
      render({ id }) {
        const playlist = this.library.getPlaylist(id);
        if (!playlist) return BaseView.page('');
        const songs = playlist.songs;

        const html = BackButton('playlists', 'Playlists')
          + Hero({
            mediaHtml: Image(playlist.img),
            type: 'Playlist',
            title: playlist.name,
            metaHtml: `${e(playlist.desc)} · ${formatTotal(songs)}`,
          })
          + TrackList(songs);
        return BaseView.page(html, songs);
      }
    }

    /* ---- views/SearchView.js ---- */
    class SearchView extends BaseView {
      constructor(library, searchService) {
        super(library);
        this.searchService = searchService;
      }

      render({ query }) {
        /* Pencarian hanya di versi dan kategori yang sedang dibuka. */
        const songs = this.searchService.search(query);
        const title = `Hasil untuk “${stripHtmlChars(query)}”`;
        const body = songs.length ? TrackList(songs) : EmptyResult();
        return BaseView.page(SectionTitle(title) + body, songs);
      }
    }

    /* ---- views/index.js ---- */
    /**
     * Registry halaman: nama view (Route.view) -> instance View.
     * Menambah halaman baru = membuat kelas View + mendaftarkannya di sini.
     */
    /** Halaman Favorites: lagu favorit versi aktif (kedua kategori). Antrean putar = daftar favorit ini. */
    class FavoritesView extends BaseView {
      constructor(library, favorites) {
        super(library);
        this.favorites = favorites;
      }

      render() {
        const songs = this.favorites.songs;
        if (!songs.length) {
          return BaseView.page(SectionTitle('Favorites') + `<p style="color:var(--muted)">${MESSAGES.NO_FAVORITES}</p>`, songs);
        }
